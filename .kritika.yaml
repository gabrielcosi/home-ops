---
# yaml-language-server: $schema=https://kritika.home-operations.com/kritika.schema.json
trigger:
  exclude:
    - name: private-images
      expr: >-
        pr.bot && ["registry.xcd.dev/gabrielcosi/", "registry.xcd.dev/shirleyrossell/"].exists(p, pr.title.contains(p) || pr.body.contains(p))
review:
  model: bifrost/anthropic/claude-sonnet-5-5
  fallback: bifrost/proxyapi/claude-sonnet-5-5
  effort: high
  agents:
    - name: deps
      model: bifrost/opencode/deepseek-v4.1-flash
      when:
        - { name: renovate, expr: pr.bot }
confidence:
  model: bifrost/opencode/glm-5.3-flash
  fallback: bifrost/opencode/deepseek-v4.1-flash
  threshold: 4
  when:
    - name: renovate
      expr: pr.bot
  gate: true
skills:
  scope:
    renovate:
      when:
        - expr: pr.bot
rules:
  - id: render-helmreleases
    paths:
      - kubernetes/**
    rule: >-
      Render every HelmRelease the change touches before judging what it produces. Call the run tool with command
      "flate" alone and the arguments as separate elements: ["build", "hr", "<name>", "--path", "kubernetes/apps",
      "-n", "<namespace>", "--no-progress"]. Read rollout strategy, labels, ports,
      resource names and every other chart default from that output, with grep on the kept file when it is cut.
      A claim about what the chart produces that no successful render backs is not a finding: a value absent from
      the repository's YAML says nothing about the chart's default. When the render fails or returns nothing,
      say so and what the error was, and make no such claim. The checkout has no git history, so only the head
      renders: read what the base produced upstream at the old tag. flate exits nonzero for any failure in the path;
      a failure is a finding only when it belongs to the HelmRelease under review and the change caused it, and a
      source that could not be fetched says nothing about the change. Every HelmRelease also gets the patches in
      kubernetes/flux/cluster/ks.yaml, which flate does not apply.
context:
  - path: AGENTS.md
    description: Repository layout, file naming, Flux app shape, secrets and pinning conventions.
comments:
  summary: .agents/kritika/summary.md.tmpl
tools:
  "aqua:home-operations/flate": "v0.7.3" # renovate: github-releases=home-operations/flate
  "aqua:google/go-containerregistry": "v0.22.1" # renovate: github-releases=google/go-containerregistry
