---
secrets:
  1pw_token:
    file: /home/truenas_admin/.config/doco-cd/1pw_token
  api_keys:
    file: /home/truenas_admin/.config/doco-cd/api_keys
  webhook_secret:
    file: /home/truenas_admin/.config/doco-cd/webhook_secret
services:
  app:
    container_name: doco-cd
    environment:
      API_KEYS_FILE: /run/secrets/api_keys
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      DEPLOY_CONFIG_BASE_DIR: ./docker/truenas/
      LOG_LEVEL: info
      POLL_CONFIG: |-
        - url: https://github.com/gabrielcosi/home-ops.git
          reference: main
          interval: 3600
      SECRET_PROVIDER: 1password
      SECRET_PROVIDER_ACCESS_TOKEN_FILE: /run/secrets/1pw_token
      TZ: Europe/Berlin
    ports:
      - '8080:80'
    healthcheck:
      test:
        - CMD
        - /doco-cd
        - healthcheck
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3
    image: ghcr.io/kimdre/doco-cd:0.134.0@sha256:1d40f570403689c762c63009ade3d5d0dc24595bf40f9629a8ab3865e4ddb768
    labels:
      - prometheus.scrape=true
      - prometheus.port=9120
      - prometheus.job=doco-cd
    restart: unless-stopped
    secrets:
      - 1pw_token
      - api_keys
      - webhook_secret
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
volumes:
  data: {}
