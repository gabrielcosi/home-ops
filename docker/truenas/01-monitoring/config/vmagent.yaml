global:
  scrape_interval: 30s

scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets:
          - 127.0.0.1:9100
        labels:
          instance: truenas
          nodename: truenas

  - job_name: smartctl-exporter
    scrape_interval: 60s
    static_configs:
      - targets:
          - 127.0.0.1:9633
        labels:
          instance: truenas

  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        filters:
          - name: label
            values:
              - prometheus.scrape=true
    relabel_configs:
      - source_labels:
          - __meta_docker_container_network_mode
        regex: host
        action: drop
      - source_labels:
          - __meta_docker_network_ip
          - __meta_docker_container_label_prometheus_port
        separator: ":"
        target_label: __address__
      - source_labels:
          - __meta_docker_container_label_prometheus_job
        target_label: job
      - target_label: instance
        replacement: truenas
