healthCheckTimeout: 90
globalTTL: 300

models:
  fast:
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 32768
    cmd: |
      /app/llama-server \
      --host 0.0.0.0 \
      --port ${PORT} \
      --model /models/Qwen3.5-0.8B-UD-Q4_K_XL.gguf \
      --ctx-size 32768 \
      --jinja \
      --cache-type-k q8_0 \
      --cache-type-v q8_0 \
      --temp 1.0 \
      --top-p 0.95 \
      --top-k 64 \
      --reasoning off \
      --flash-attn on \
      --n-gpu-layers 99
    useModelName: fast
    concurrencyLimit: 16

  general:
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 65536
    cmd: |
      /app/llama-server \
      --host 0.0.0.0 \
      --port ${PORT} \
      --model /models/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-Q8_0.gguf \
      --mmproj /models/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-mmproj-BF16.gguf \
      --ctx-size 65536 \
      --jinja \
      --cache-type-k q8_0 \
      --cache-type-v q8_0 \
      --temp 1.0 \
      --top-p 0.95 \
      --top-k 64 \
      --min-p 0 \
      --reasoning off \
      --flash-attn on \
      --n-gpu-layers 99
    useModelName: general
    concurrencyLimit: 16

  qwen3.6-35b-a3b:
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 262144
    cmd: |
      /app/llama-server \
      --host 0.0.0.0 \
      --port ${PORT} \
      --model /models/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf \
      --mmproj /models/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-mmproj-f16.gguf \
      --ctx-size 262144 \
      --parallel 1 \
      --no-mmap \
      --threads 8 \
      --threads-batch 16 \
      --jinja \
      --cache-type-k q8_0 \
      --cache-type-v q8_0 \
      --temp 1.0 \
      --top-p 0.95 \
      --top-k 64 \
      --min-p 0 \
      --presence-penalty 0 \
      --reasoning-budget 10000 \
      --reasoning-budget-message "...I got enough. Let's answer now." \
      --flash-attn on \
      --fit on
    useModelName: qwen3.6-35b-a3b
    concurrencyLimit: 1

  qwen3.6-27b:
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 131072
    cmd: |
      /app/llama-server \
      --host 0.0.0.0 \
      --port ${PORT} \
      --model /models/Qwen3.6-27B-uncensored-heretic-v2-Native-MTP-Preserved/Qwen3.6-27B-uncensored-heretic-v2-Native-MTP-Preserved-Q4_K_M.gguf \
      --ctx-size 131072 \
      --parallel 2 \
      --cache-reuse 256 \
      --jinja \
      --cache-type-k q8_0 \
      --cache-type-v q8_0 \
      --temp 0.6 \
      --top-p 0.95 \
      --top-k 20 \
      --min-p 0.0 \
      --presence-penalty 1.5 \
      --repeat-penalty 1.0 \
      --reasoning-budget 10000 \
      --reasoning-budget-message "...I got enough. Let's answer now." \
      --flash-attn on \
      --n-gpu-layers 99 \
      --spec-type draft-mtp \
      --spec-draft-n-max 2
    useModelName: qwen3.6-27b
    concurrencyLimit: 2

  gemma4:
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 262144
    cmd: |
      /app/llama-server \
      --host 0.0.0.0 \
      --port ${PORT} \
      --model /models/gemma-4-26B-A4B-it-ultra-uncensored-heretic/gemma-4-26B-A4B-it-ultra-uncensored-heretic-Q8_0.gguf \
      --mmproj /models/gemma-4-26B-A4B-it-ultra-uncensored-heretic/gemma-4-26B-A4B-it-ultra-uncensored-heretic-mmproj-BF16.gguf \
      --ctx-size 262144 \
      --jinja \
      --temp 1.0 \
      --top-p 0.95 \
      --top-k 64 \
      --min-p 0 \
      --presence-penalty 0 \
      --reasoning-budget 10000 \
      --reasoning-budget-message "...I got enough. Let's answer now." \
      --cpu-moe \
      --flash-attn on \
      --n-gpu-layers 99
    useModelName: gemma4
    concurrencyLimit: 120

  ocr:
    capabilities:
      in: [text, image]
      out: [text]
      context: 16384
    cmd: |
      /app/llama-server \
      --host 0.0.0.0 \
      --port ${PORT} \
      --model /models/GLM-OCR-f16.gguf \
      --mmproj /models/GLM-OCR-mmproj-Q8_0.gguf \
      --ctx-size 16384 \
      --jinja \
      --reasoning-budget 0 \
      --flash-attn on \
      --n-gpu-layers 99
    useModelName: ocr
    concurrencyLimit: 16

  stt:
    capabilities:
      in: [audio]
      out: [text]
    cmd: |
      docker run --rm --init \
      --name stt-${PORT} \
      --network llama-swap \
      --gpus all \
      -p ${PORT}:8000 \
      -v /opt/models/.cache/huggingface/hub:/home/ubuntu/.cache/huggingface/hub \
      -e WHISPER__INFERENCE_DEVICE=cuda \
      -e WHISPER__COMPUTE_TYPE=float16 \
      ghcr.io/speaches-ai/speaches:latest-cuda-12.6.3
    cmdStop: docker stop stt-${PORT} || true
    proxy: http://stt-${PORT}:8000
    checkEndpoint: /health
    useModelName: deepdml/faster-whisper-large-v3-turbo-ct2
    concurrencyLimit: 4

  tts:
    capabilities:
      in: [text]
      out: [audio]
    cmd: |
      docker run --rm --init \
      --name tts-${PORT} \
      --network llama-swap \
      --gpus all \
      -p ${PORT}:8004 \
      -v /opt/models/.cache/huggingface:/app/hf_cache \
      -v /opt/models/.cache/chatterbox/voices:/app/voices \
      -v /opt/models/.cache/chatterbox/config.yaml:/app/config.yaml:ro \
      ghcr.io/gabrielcosi/chatterbox-tts-server:2.0.0
    cmdStop: docker stop tts-${PORT} || true
    proxy: http://tts-${PORT}:8004
    checkEndpoint: /v1/audio/voices
    useModelName: ResembleAI/chatterbox-turbo
    concurrencyLimit: 4

  embeddings:
    capabilities:
      in: [text]
      out: [text]
      context: 8192
    cmd: |
      /app/llama-server \
      --host 0.0.0.0 \
      --port ${PORT} \
      --model /models/Qwen3-Embedding-0.6B-Q8_0.gguf \
      --embeddings \
      --ctx-size 8192 \
      --flash-attn on \
      --n-gpu-layers 99
    useModelName: embeddings
    concurrencyLimit: 16

matrix:
  vars:
    fast: fast
    gen: general
    q3627b: qwen3.6-27b
    q3635b: qwen3.6-35b-a3b
    g4: gemma4
    ocr: ocr
    stt: stt
    tts: tts
    emb: embeddings

  sets:
    default: '(gen | q3627b | q3635b | g4) & fast & ocr & stt & tts & emb'
