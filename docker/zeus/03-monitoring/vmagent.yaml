global:
  scrape_interval: 30s

scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          instance: zeus
          nodename: zeus

  - job_name: dcgm-exporter
    static_configs:
      - targets:
          - dcgm-exporter:9400
        labels:
          instance: zeus

  - job_name: doco-cd
    static_configs:
      - targets:
          - doco-cd:9120
        labels:
          instance: zeus
