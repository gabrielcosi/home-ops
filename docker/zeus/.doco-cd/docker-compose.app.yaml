---
secrets:
  1pw_token:
    file: /opt/doco-cd/1pw_token
  api_secret:
    file: /opt/doco-cd/api_secret

services:
  app:
    container_name: doco-cd
    environment:
      API_SECRET_FILE: /run/secrets/api_secret
      DEPLOY_CONFIG_BASE_DIR: ./docker/zeus/
      LOG_LEVEL: info
      POLL_CONFIG: |-
        - url: https://github.com/gabrielcosi/home-ops.git
          reference: main
          interval: 900
      SECRET_PROVIDER: 1password
      SECRET_PROVIDER_ACCESS_TOKEN_FILE: /run/secrets/1pw_token
      TZ: Europe/Berlin
    ports:
      - '8080:80'
    healthcheck:
      test:
        - CMD
        - /doco-cd
        - healthcheck
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3
    image: ghcr.io/kimdre/doco-cd:0.100.0@sha256:4bf47fa47ee59245a6dbacd8643dd67401667b345841f7c3b31798251ae08885
    restart: unless-stopped
    secrets:
      - 1pw_token
      - api_secret
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
    networks:
      - zeus

volumes:
  data:

networks:
  zeus:
    external: true
