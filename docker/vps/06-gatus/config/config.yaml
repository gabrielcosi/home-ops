alerting:
  pushover:
    application-token: ${PUSHOVER_TOKEN}
    user-key: ${PUSHOVER_USER_KEY}
    title: Gatus
    priority: 1
    resolved-priority: 0
    default-alert:
      description: health-check failed
      failure-threshold: 3
      minimum-reminder-interval: 1h
      send-on-resolved: true
      success-threshold: 2

endpoints:
  - name: status page
    group: home
    url: https://status.xcd.dev
    interval: 1m
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - '[STATUS] == 200'
    alerts:
      - type: pushover

external-endpoints:
  - name: heartbeat
    group: home
    token: ${REMOTE_HEARTBEAT_TOKEN}
    heartbeat:
      interval: 5m
    alerts:
      - type: pushover

storage:
  type: sqlite
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db

ui:
  title: Status | Gatus
  header: Status
  logo: https://avatars.githubusercontent.com/u/44176694
  link: https://github.com/gabrielcosi
  buttons:
    - name: Github
      link: https://github.com/gabrielcosi

web:
  port: ${GATUS_WEB_PORT}
