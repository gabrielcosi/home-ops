global:
  scrape_interval: 30s

scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          instance: edge-vps
          nodename: vps

  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        filters:
          - name: label
            values:
              - prometheus.scrape=true
    relabel_configs:
      - source_labels:
          - __meta_docker_network_ip
          - __meta_docker_container_label_prometheus_port
        separator: ":"
        target_label: __address__
      - source_labels:
          - __meta_docker_container_label_prometheus_job
        target_label: job
      - target_label: instance
        replacement: edge-vps

  - job_name: towonel-hub
    static_configs:
      - targets:
          - towonel-hub:9091
        labels:
          instance: edge-vps

  - job_name: towonel-edge
    static_configs:
      - targets:
          - towonel-hub:9092
        labels:
          instance: edge-vps
