---
name: edge

services:
  caddy:
    image: ghcr.io/bjw-s-labs/caddy-l4:2.11.9@sha256:2ca65102e513f59fa431f1eea31c30e089893407a30557f0c9b36c7006d4967b
    container_name: caddy
    restart: unless-stopped
    environment:
      CADDY_ACME_EMAIL: ${TOWONEL_ACME_EMAIL}
      VPS_LOCAL_HOSTS: >-
        towonel.xcd.dev
        doco-cd.xcd.dev
        status-vps.xcd.dev
    ports:
      - "${VPS_IP}:80:80"
      - "${VPS_IP}:443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    labels:
      - prometheus.scrape=false

volumes:
  caddy-data:
  caddy-config:

configs:
  caddyfile:
    file: ./config/Caddyfile

networks:
  default:
    name: edge
    external: true
