---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  values:
    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        cpu: null
        memory: 512Mi
    serviceMonitor:
      create: true
    web:
      config:
        authentication:
          type: Anonymous
          anonymous:
            username: flux
            groups:
              - flux-admin
      httpRoute:
        enabled: true
        hostnames:
          - flux-operator.xcd.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
      networkPolicy:
        create: false
