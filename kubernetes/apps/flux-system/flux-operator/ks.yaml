---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
spec:
  interval: 1h
  path: ./kubernetes/apps/flux-system/flux-operator/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: flux-operator
    namespace: flux-system
  targetNamespace: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-instance
spec:
  dependsOn:
    - name: flux-operator
  interval: 1h
  path: ./kubernetes/apps/flux-system/flux-operator/instance
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: flux-operator
    namespace: flux-system
  targetNamespace: flux-system
  wait: false
