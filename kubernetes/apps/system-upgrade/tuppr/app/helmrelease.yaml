---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  chartRef:
    kind: OCIRepository
    name: tuppr
  interval: 1h
  values:
    replicaCount: 2
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    silences:
      enabled: true
      alertmanager:
        address: http://vmalertmanager-victoria-metrics-cluster.monitoring.svc.cluster.local:9093
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          allowCrossNamespaceImport: true
          matchLabels:
            dashboards: grafana
