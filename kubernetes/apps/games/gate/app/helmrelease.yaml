---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gate
spec:
  chartRef:
    kind: OCIRepository
    name: gate
  interval: 1h
  values:
    controllers:
      gate:
        annotations:
          reloader.stakater.com/auto: 'true'

        pod:
          imagePullSecrets:
            - name: registry-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

        containers:
          app:
            image:
              repository: reg.xcd.dev/private/warden
              tag: 0.1.2
            args:
              - --config
              - /etc/gate/config.yml
            env:
              GATE_VELOCITY_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: gate-secrets
                    key: forwarding.secret
              WARDEN_SERVERS: minecraft
              WARDEN_ALLOWLIST_DIR: /allowlist
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 25565
                  periodSeconds: 15
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 25565
                  periodSeconds: 5
                  failureThreshold: 12
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

          limbo:
            image:
              repository: ghcr.io/quozul/picolimbo
              tag: v1.13.2-mc26.2
            command:
              - pico_limbo
            args:
              - --config
              - /etc/picolimbo/server.toml
            env:
              FORWARDING_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: gate-secrets
                    key: forwarding.secret
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 30000
                  periodSeconds: 15
                  failureThreshold: 5
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        forceRename: gate
        primary: true
        annotations:
          io.cilium/lb-ipam-ips: 192.168.69.184
          external-dns.alpha.kubernetes.io/hostname: mc.xcd.dev
        labels:
          external-dns/instance: unifi
        type: LoadBalancer
        ports:
          minecraft:
            port: 25565

      demand:
        controller: gate
        ports:
          demand:
            port: 8080

    persistence:
      config:
        type: configMap
        name: gate-config
        advancedMounts:
          gate:
            app:
              - path: /etc/gate/config.yml
                subPath: config.yml
                readOnly: true
            limbo:
              - path: /etc/picolimbo/server.toml
                subPath: server.toml
                readOnly: true

      allowlist:
        type: secret
        name: gate-allowlist
        advancedMounts:
          gate:
            app:
              - path: /allowlist
                readOnly: true

      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
