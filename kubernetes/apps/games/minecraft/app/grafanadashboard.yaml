---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: minecraft
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: |
    {
      "uid": "minecraft-server",
      "title": "Minecraft",
      "tags": ["minecraft", "games"],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "time": { "from": "now-24h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Players online",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [{ "expr": "sum(minecraft_players_online)", "refId": "A" }],
          "fieldConfig": { "defaults": {
            "color": { "mode": "fixed", "fixedColor": "blue" },
            "noValue": "0"
          }, "overrides": [] },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 2, "type": "stat", "title": "State",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [{ "expr": "kube_deployment_status_replicas_available{namespace=\"games\", deployment=\"minecraft\"}", "refId": "A" }],
          "fieldConfig": { "defaults": {
            "mappings": [
              { "type": "value", "options": {
                "0": { "text": "Sleeping", "color": "blue", "index": 0 },
                "1": { "text": "Up", "color": "green", "index": 1 }
              } }
            ],
            "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
          }, "overrides": [] },
          "options": { "graphMode": "none", "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 3, "type": "stat", "title": "TPS",
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [{ "expr": "max(minecraft_tps)", "refId": "A" }],
          "fieldConfig": { "defaults": {
            "decimals": 1, "max": 20,
            "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "red", "value": null },
              { "color": "yellow", "value": 15 },
              { "color": "green", "value": 19.5 }
            ] }
          }, "overrides": [] },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 4, "type": "stat", "title": "MSPT (max)",
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [{ "expr": "max(minecraft_mspt{type=\"max\"})", "refId": "A" }],
          "fieldConfig": { "defaults": {
            "unit": "ms", "decimals": 1,
            "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null },
              { "color": "yellow", "value": 40 },
              { "color": "red", "value": 50 }
            ] }
          }, "overrides": [] },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 5, "type": "stat", "title": "Loaded chunks",
          "gridPos": { "x": 16, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [{ "expr": "sum(minecraft_loaded_chunks)", "refId": "A" }],
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "purple" } }, "overrides": [] },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 6, "type": "stat", "title": "Entities",
          "gridPos": { "x": 20, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [{ "expr": "sum(minecraft_entities)", "refId": "A" }],
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "orange" } }, "overrides": [] },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 10, "type": "timeseries", "title": "Players online",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [{ "expr": "sum(minecraft_players_online)", "legendFormat": "players", "refId": "A" }],
          "fieldConfig": { "defaults": {
            "min": 0, "decimals": 0,
            "color": { "mode": "fixed", "fixedColor": "blue" },
            "custom": { "lineWidth": 2, "fillOpacity": 10, "spanNulls": false, "showPoints": "never" }
          }, "overrides": [] },
          "options": { "legend": { "showLegend": false }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 11, "type": "timeseries", "title": "TPS",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [{ "expr": "max(minecraft_tps)", "legendFormat": "tps", "refId": "A" }],
          "fieldConfig": { "defaults": {
            "min": 0, "max": 20, "decimals": 1,
            "color": { "mode": "fixed", "fixedColor": "green" },
            "custom": { "lineWidth": 2, "fillOpacity": 10, "spanNulls": false, "showPoints": "never" }
          }, "overrides": [] },
          "options": { "legend": { "showLegend": false }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 12, "type": "timeseries", "title": "MSPT",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [{ "expr": "max by (type) (minecraft_mspt)", "legendFormat": "{{type}}", "refId": "A" }],
          "fieldConfig": { "defaults": {
            "unit": "ms", "min": 0,
            "custom": { "lineWidth": 2, "fillOpacity": 0, "spanNulls": false, "showPoints": "never" }
          }, "overrides": [] },
          "options": { "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 13, "type": "timeseries", "title": "Entities by group",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [{ "expr": "sum by (group) (minecraft_entities)", "legendFormat": "{{group}}", "refId": "A" }],
          "fieldConfig": { "defaults": {
            "min": 0, "decimals": 0,
            "custom": { "lineWidth": 2, "fillOpacity": 0, "spanNulls": false, "showPoints": "never" }
          }, "overrides": [] },
          "options": { "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 14, "type": "timeseries", "title": "Loaded chunks",
          "gridPos": { "x": 0, "y": 20, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [{ "expr": "sum by (world) (minecraft_loaded_chunks)", "legendFormat": "{{world}}", "refId": "A" }],
          "fieldConfig": { "defaults": {
            "min": 0, "decimals": 0,
            "custom": { "lineWidth": 2, "fillOpacity": 0, "spanNulls": false, "showPoints": "never" }
          }, "overrides": [] },
          "options": { "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 15, "type": "timeseries", "title": "Handshakes",
          "gridPos": { "x": 12, "y": 20, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [{ "expr": "sum by (type) (rate(minecraft_handshakes_total[$__rate_interval]))", "legendFormat": "{{type}}", "refId": "A" }],
          "fieldConfig": { "defaults": {
            "unit": "reqps", "min": 0,
            "custom": { "lineWidth": 2, "fillOpacity": 0, "spanNulls": false, "showPoints": "never" }
          }, "overrides": [] },
          "options": { "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 16, "type": "timeseries", "title": "JVM heap",
          "gridPos": { "x": 0, "y": 28, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "expr": "sum(jvm_memory_bytes_used{namespace=\"games\", area=\"heap\"})", "legendFormat": "used", "refId": "A" },
            { "expr": "sum(jvm_memory_bytes_max{namespace=\"games\", area=\"heap\"})", "legendFormat": "max", "refId": "B" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes", "min": 0,
              "custom": { "lineWidth": 2, "fillOpacity": 10, "spanNulls": false, "showPoints": "never" }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "max" },
                "properties": [
                  { "id": "custom.lineStyle", "value": { "dash": [6, 4], "fill": "dash" } },
                  { "id": "custom.fillOpacity", "value": 0 },
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }
                ] }
            ]
          },
          "options": { "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 17, "type": "timeseries", "title": "Container CPU",
          "gridPos": { "x": 12, "y": 28, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [{ "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"games\", pod=~\"minecraft-.+\", container=\"app\"}[$__rate_interval]))", "legendFormat": "cores", "refId": "A" }],
          "fieldConfig": { "defaults": {
            "min": 0, "decimals": 2,
            "color": { "mode": "fixed", "fixedColor": "yellow" },
            "custom": { "lineWidth": 2, "fillOpacity": 10, "spanNulls": false, "showPoints": "never" }
          }, "overrides": [] },
          "options": { "legend": { "showLegend": false }, "tooltip": { "mode": "multi" } }
        }
      ]
    }
