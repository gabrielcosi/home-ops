---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
spec:
  chartRef:
    kind: OCIRepository
    name: minecraft
  interval: 1h
  values:
    controllers:
      minecraft:
        strategy: Recreate

        pod:
          nodeSelector:
            kubernetes.io/hostname: wrk-01
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

        containers:
          app:
            image:
              repository: ghcr.io/itzg/minecraft-server
              tag: 2026.8.0-java25
            env:
              EULA: 'TRUE'
              TYPE: FABRIC
              VERSION: '26.2'
              MEMORY: 6G
              USE_AIKAR_FLAGS: 'true'
              ONLINE_MODE: 'FALSE'
              MODRINTH_PROJECTS: fabric-api,fabricproxy-lite,fabricexporter,spark,lithium,ferrite-core,krypton,dynamic-lights,ping-wheel,worldedit
              REMOVE_OLD_MODS: 'true'
              FABRIC_PROXY_SECRET_FILE: /secrets/forwarding.secret
              ENABLE_RCON: 'FALSE'
              CREATE_CONSOLE_IN_PIPE: 'true'
              PAUSE_WHEN_EMPTY_SECONDS: '60'
              DIFFICULTY: hard
              TZ: Europe/Berlin
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - mc-health
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - mc-health
                  periodSeconds: 15
                  failureThreshold: 60
            resources:
              requests:
                cpu: 500m
                memory: 8Gi
              limits:
                memory: 8Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        ports:
          minecraft:
            port: 25565
          metrics:
            port: 25585

    serviceMonitor:
      app:
        serviceName: minecraft
        endpoints:
          - port: metrics
            path: /metrics
            interval: 30s
            scrapeTimeout: 10s

    persistence:
      data:
        existingClaim: minecraft
        advancedMounts:
          minecraft:
            app:
              - path: /data

      secrets:
        type: secret
        name: minecraft-secrets
        advancedMounts:
          minecraft:
            app:
              - path: /secrets
                readOnly: true

      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
