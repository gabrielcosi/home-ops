---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: generic-device-plugin
spec:
  interval: 1h
  path: ./kubernetes/apps/kube-system/generic-device-plugin/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: generic-device-plugin
    namespace: flux-system
  targetNamespace: kube-system
  wait: false
