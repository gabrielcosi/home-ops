---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cilium
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
  configMapRef:
    name: cilium-dashboard
    key: cilium-dashboard.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cilium-operator
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
  configMapRef:
    name: cilium-operator-dashboard
    key: cilium-operator-dashboard.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: hubble-traffic
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: |
    {
      "uid": "hubble-traffic",
      "title": "Hubble / Traffic",
      "tags": ["hubble", "cilium", "network"],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "time": {"from": "now-6h", "to": "now"},
      "timepicker": {},
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "victoriametrics"},
            "query": {"qryType": 1, "query": "label_values(hubble_flows_processed_total, source_namespace)", "refId": "PrometheusVariableQueryEditor-VariableQuery"},
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {"selected": true, "text": ["All"], "value": ["$__all"]},
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "workload",
            "label": "Workload",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "victoriametrics"},
            "query": {"qryType": 1, "query": "label_values(hubble_flows_processed_total{source_namespace=~\"$namespace\"}, source_workload)", "refId": "PrometheusVariableQueryEditor-VariableQuery"},
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {"selected": true, "text": ["All"], "value": ["$__all"]},
            "refresh": 2,
            "sort": 1
          }
        ],
        "hide": 0
      },
      "panels": [
        {"type": "row", "title": "Overview", "id": 100, "collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}, "panels": []},
        {
          "type": "stat", "title": "Flows", "id": 1,
          "description": "Flow events over the selected range.",
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "gridPos": {"h": 4, "w": 3, "x": 0, "y": 1},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "color": {"mode": "fixed", "fixedColor": "text"}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "graphMode": "area", "textMode": "auto", "colorMode": "none"},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "victoriametrics"}, "instant": true, "expr": "sum(increase(hubble_flows_processed_total{source_namespace=~\"$namespace\", source_workload=~\"$workload\"}[$__range]))"}]
        },
        {
          "type": "stat", "title": "Dropped", "id": 2,
          "description": "Flows denied by network policy. The Drops table also lists datapath drops, which no policy caused.",
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "gridPos": {"h": 4, "w": 3, "x": 3, "y": 1},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "text", "value": null}, {"color": "orange", "value": 0.01}, {"color": "red", "value": 1}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "graphMode": "area", "textMode": "auto", "colorMode": "value"},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "victoriametrics"}, "instant": true, "expr": "sum(increase(hubble_drop_total{source_namespace=~\"$namespace\", source_workload=~\"$workload\", reason=~\"POLICY_.*\"}[$__range]))"}]
        },
        {
          "type": "stat", "title": "Drop ratio", "id": 3,
          "description": "Policy-denied flows as a share of all flows.",
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "gridPos": {"h": 4, "w": 3, "x": 6, "y": 1},
          "fieldConfig": {"defaults": {"unit": "percentunit", "decimals": 2, "min": 0, "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "text", "value": null}, {"color": "orange", "value": 0.01}, {"color": "red", "value": 0.05}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "graphMode": "area", "textMode": "auto", "colorMode": "value"},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "victoriametrics"}, "instant": true, "expr": "sum(increase(hubble_drop_total{source_namespace=~\"$namespace\", source_workload=~\"$workload\", reason=~\"POLICY_.*\"}[$__range])) / clamp_min(sum(increase(hubble_flows_processed_total{source_namespace=~\"$namespace\", source_workload=~\"$workload\"}[$__range])), 1)"}]
        },
        {
          "type": "stat", "title": "Namespaces", "id": 4,
          "description": "Namespaces sending traffic in the selection.",
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "gridPos": {"h": 4, "w": 3, "x": 9, "y": 1},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "color": {"mode": "fixed", "fixedColor": "text"}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "graphMode": "area", "textMode": "auto", "colorMode": "none"},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "victoriametrics"}, "instant": true, "expr": "count(count by (source_namespace) (increase(hubble_flows_processed_total{source_namespace=~\"$namespace\", source_workload=~\"$workload\", source_namespace!=\"\"}[$__range]) > 0))"}]
        },
        {
          "type": "stat", "title": "Workloads", "id": 5,
          "description": "Distinct sending workloads in the selection.",
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "gridPos": {"h": 4, "w": 3, "x": 12, "y": 1},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "color": {"mode": "fixed", "fixedColor": "text"}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "graphMode": "area", "textMode": "auto", "colorMode": "none"},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "victoriametrics"}, "instant": true, "expr": "count(count by (source) (increase(hubble_flows_processed_total{source_namespace=~\"$namespace\", source_workload=~\"$workload\", source!=\"\"}[$__range]) > 0))"}]
        },
        {
          "type": "stat", "title": "Internet peers", "id": 6,
          "description": "Distinct public addresses contacted, excluding cluster, node and LAN ranges.",
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "gridPos": {"h": 4, "w": 3, "x": 15, "y": 1},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "color": {"mode": "fixed", "fixedColor": "text"}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "graphMode": "area", "textMode": "auto", "colorMode": "none"},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "victoriametrics"}, "instant": true, "expr": "count(count by (destination) (increase(hubble_flows_processed_total{source_namespace=~\"$namespace\", source_workload=~\"$workload\", destination=~\"^[0-9]+[.].*\", destination!~\"^(10[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|192[.]168[.]|127[.]|169[.]254[.]).*\"}[$__range]) > 0))"}]
        },
        {
          "type": "stat", "title": "DNS", "id": 7,
          "description": "Queries seen by the Cilium DNS proxy over the selected range.",
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "gridPos": {"h": 4, "w": 3, "x": 18, "y": 1},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 1, "color": {"mode": "fixed", "fixedColor": "text"}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "graphMode": "area", "textMode": "auto", "colorMode": "none"},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "victoriametrics"}, "instant": true, "expr": "sum(increase(hubble_dns_queries_total{source_namespace=~\"$namespace\", source_workload=~\"$workload\"}[$__range]))"}]
        },
        {
          "type": "stat", "title": "New connections", "id": 8,
          "description": "TCP SYNs over the selected range.",
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "gridPos": {"h": 4, "w": 3, "x": 21, "y": 1},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 1, "color": {"mode": "fixed", "fixedColor": "text"}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "graphMode": "area", "textMode": "auto", "colorMode": "none"},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "victoriametrics"}, "instant": true, "expr": "sum(increase(hubble_tcp_flags_total{source_namespace=~\"$namespace\", source_workload=~\"$workload\", flag=\"SYN\"}[$__range]))"}]
        },
        {"type": "row", "title": "Over time", "id": 101, "collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 5}},
        {
          "type": "timeseries", "title": "Flows by verdict", "id": 10,
          "description": "Forwarded against dropped for the selection.",
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 6},
          "fieldConfig": {
            "defaults": {"unit": "reqps", "decimals": 1, "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 8, "showPoints": "never", "axisSoftMin": 0, "gradientMode": "none"}},
            "overrides": [
              {"matcher": {"id": "byName", "options": "DROPPED"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]},
              {"matcher": {"id": "byName", "options": "FORWARDED"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "green"}}]}
            ]
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": []}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "victoriametrics"}, "expr": "sum by (verdict) (rate(hubble_flows_processed_total{source_namespace=~\"$namespace\", source_workload=~\"$workload\"}[$__rate_interval]))", "legendFormat": "{{verdict}}"}]
        },
        {
          "type": "timeseries", "title": "Busiest sources", "id": 11,
          "description": "Top eight sending workloads over the window.",
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 6},
          "fieldConfig": {"defaults": {"unit": "reqps", "decimals": 1, "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 0, "showPoints": "never", "axisSoftMin": 0}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": []}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "victoriametrics"}, "expr": "topk(8, sum by (source) (rate(hubble_flows_processed_total{source_namespace=~\"$namespace\", source_workload=~\"$workload\"}[$__rate_interval])))", "legendFormat": "{{source}}"}]
        },
        {
          "type": "timeseries", "title": "Busiest destinations", "id": 12,
          "description": "Top eight destinations over the window.",
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 6},
          "fieldConfig": {"defaults": {"unit": "reqps", "decimals": 1, "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 0, "showPoints": "never", "axisSoftMin": 0}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": []}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "victoriametrics"}, "expr": "topk(8, sum by (destination) (rate(hubble_flows_processed_total{source_namespace=~\"$namespace\", source_workload=~\"$workload\"}[$__rate_interval])))", "legendFormat": "{{destination}}"}]
        },
        {"type": "row", "title": "Peers", "id": 102, "collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 14}},
        {
          "type": "table", "title": "Workload pairs", "id": 20,
          "description": "Source to destination inside the cluster.",
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 15},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "custom": {"align": "auto", "cellOptions": {"type": "auto"}, "filterable": true}}, "overrides": []},
          "options": {"showHeader": true, "sortBy": [{"displayName": "Flows", "desc": true}], "footer": {"show": false}},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "victoriametrics"}, "expr": "topk(25, sum by (source, destination) (increase(hubble_flows_processed_total{source_namespace=~\"$namespace\", source_workload=~\"$workload\", destination_namespace!=\"\"}[$__range]))) > 0", "format": "table", "instant": true}],
          "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}, "renameByName": {"source": "Source", "destination": "Destination", "Value": "Flows"}}}]
        },
        {
          "type": "table", "title": "Internet peers", "id": 21,
          "description": "Public addresses only. Cluster, node and LAN ranges are excluded.",
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 15},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "custom": {"align": "auto", "cellOptions": {"type": "auto"}, "filterable": true}}, "overrides": []},
          "options": {"showHeader": true, "sortBy": [{"displayName": "Flows", "desc": true}], "footer": {"show": false}},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "victoriametrics"}, "expr": "topk(25, sum by (source, destination) (increase(hubble_flows_processed_total{source_namespace=~\"$namespace\", source_workload=~\"$workload\", destination=~\"^[0-9]+[.].*\", destination!~\"^(10[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|192[.]168[.]|127[.]|169[.]254[.]).*\"}[$__range]))) > 0", "format": "table", "instant": true}],
          "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}, "renameByName": {"source": "Source", "destination": "Address", "Value": "Flows"}}}]
        },
        {"type": "row", "title": "Names and drops", "id": 103, "collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 24}},
        {
          "type": "table", "title": "DNS names", "id": 30,
          "description": "Search-domain expansions under cluster.local are excluded; ndots:5 emits three of them per external lookup.",
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 25},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "custom": {"align": "auto", "cellOptions": {"type": "auto"}, "filterable": true}}, "overrides": []},
          "options": {"showHeader": true, "sortBy": [{"displayName": "Queries", "desc": true}], "footer": {"show": false}},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "victoriametrics"}, "expr": "label_replace(topk(25, sum by (source, query) (increase(hubble_dns_queries_total{source_namespace=~\"$namespace\", source_workload=~\"$workload\", query!~\".*[.]cluster[.]local[.]\"}[$__range]))), \"query\", \"$1\", \"query\", \"(.*)[.]\") > 0", "format": "table", "instant": true}],
          "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}, "renameByName": {"source": "Source", "query": "Name", "Value": "Queries"}}}]
        },
        {
          "type": "table", "title": "Drops", "id": 31,
          "description": "Peer and datapath reason for each denied flow.",
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 25},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "custom": {"align": "auto", "cellOptions": {"type": "auto"}, "filterable": true}}, "overrides": []},
          "options": {"showHeader": true, "sortBy": [{"displayName": "Drops", "desc": true}], "footer": {"show": false}},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "victoriametrics"}, "expr": "topk(25, sum by (source, destination, reason) (increase(hubble_drop_total{source_namespace=~\"$namespace\", source_workload=~\"$workload\"}[$__range]))) > 0", "format": "table", "instant": true}],
          "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}, "renameByName": {"source": "Source", "destination": "Destination", "reason": "Reason", "Value": "Drops"}}}]
        }
      ]
    }
