---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    cluster:
      name: talos
      id: 1
    
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    
    # Talos specific
    k8sServiceHost: localhost
    k8sServicePort: 7445
    securityContext:
      capabilities:
        ciliumAgent:
          [
            CHOWN,
            KILL,
            NET_ADMIN,
            NET_RAW,
            IPC_LOCK,
            SYS_ADMIN,
            SYS_RESOURCE,
            DAC_OVERRIDE,
            FOWNER,
            SETGID,
            SETUID,
            PERFMON,
            BPF,
          ]
        cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE, PERFMON, BPF]
    
    socketLB:
      enabled: true
      hostNamespaceOnly: true
    
    cni:
      exclusive: false
    
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    
    # ===== ROUTING CONFIGURATION =====
    routingMode: native
    autoDirectNodeRoutes: true
    ipv4NativeRoutingCIDR: 10.42.0.0/16
    devices: bond+
    MTU: 9000
    
    # ===== BPF PERFORMANCE OPTIMIZATIONS =====
    bpf:
      datapathMode: netkit
      masquerade: true
      preallocateMaps: true
      tproxy: false
    
    bpfClockProbe: true
    enableIPv4BIGTCP: true
    
    endpointRoutes:
      enabled: true
    
    # ===== BANDWIDTH MANAGEMENT =====
    bandwidthManager:
      enabled: true
      bbr: true
    
    pmtuDiscovery:
      enabled: true
    
    localRedirectPolicies:
      enabled: true
    
    # ===== IPAM =====
    # https://docs.cilium.io/en/stable/network/concepts/ipam/
    ipam:
      mode: kubernetes
    
    # ===== OPERATOR CONFIGURATION =====
    operator:
      dashboards:
        enabled: true
      rollOutPods: true
      replicas: 2
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 128Mi
      prometheus:
        serviceMonitor:
          enabled: true
    
    rollOutCiliumPods: true
    updateStrategy:
      rollingUpdate:
        maxUnavailable: 1
    pprof:
      enabled: true
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 512Mi
    
    # ===== BGP + L2 ANNOUNCEMENTS =====
    l2announcements:
      enabled: true
    
    bgpControlPlane:
      enabled: true
    
    k8sClientRateLimit:
      qps: 25
      burst: 50
    
    # ===== LOAD BALANCER =====
    loadBalancer:
      algorithm: maglev
      mode: dsr
    
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    
    dashboards:
      enabled: true
    
    gatewayAPI:
      enabled: false
    envoy:
      enabled: false
    hubble:
      enabled: true
      metrics:
        dynamic:
          enabled: true
          config:
            createConfigMap: true
            content:
              - name: dns
                contextOptions:
                  - name: query
                  - name: sourceContext
                    values: ["workload", "pod"]
                  - name: destinationContext
                    values: ["workload", "pod", "dns", "ip"]
                  - name: labelsContext
                    values:
                      - source_namespace
                      - destination_namespace
                      - source_workload
                      - destination_workload
              - name: drop
                contextOptions: &hubbleContext
                  - name: sourceContext
                    values: ["workload", "pod"]
                  - name: destinationContext
                    values: ["workload", "pod", "dns", "ip"]
                  - name: labelsContext
                    values:
                      - source_namespace
                      - destination_namespace
                      - source_workload
                      - destination_workload
              - name: icmp
                contextOptions: *hubbleContext
              - name: flow
                contextOptions: *hubbleContext
                excludeFilters: &hubbleChurn
                  - source_label: ["app.kubernetes.io/managed-by=kopiur"]
                  - destination_label: ["app.kubernetes.io/managed-by=kopiur"]
                  - source_label: ["renovate-operator.mogenius.com/renovatejob=forgejo"]
                  - destination_label: ["renovate-operator.mogenius.com/renovatejob=forgejo"]
              - name: tcp
                contextOptions: *hubbleContext
                excludeFilters: *hubbleChurn
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: false
      export:
        dynamic:
          enabled: true
          config:
            createConfigMap: true
            content:
              - name: traffic
                filePath: /var/run/cilium/hubble/traffic.log
                aggregationInterval: "5m"
                excludeFilters:
                  - event_type:
                      - type: 130
                        match_sub_type: true
                        sub_type: 5
                fieldAggregate:
                  - source.namespace
                  - source.pod_name
                  - destination.namespace
                  - destination.pod_name
                  - IP
                  - verdict
                fileMaxSizeMb: 100
                fileMaxBackups: 3
                fileCompress: false
              - name: denied
                filePath: /var/run/cilium/hubble/denied.log
                includeFilters:
                  - verdict: ["DROPPED", "ERROR"]
                fieldMask:
                  - time
                  - node_name
                  - verdict
                  - drop_reason_desc
                  - is_reply
                  - source.namespace
                  - source.pod_name
                  - destination.namespace
                  - destination.pod_name
                  - IP
                  - l4
                fileMaxSizeMb: 20
                fileMaxBackups: 3
                fileCompress: false
      relay:
        enabled: true
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
