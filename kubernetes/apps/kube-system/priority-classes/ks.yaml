---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: priority-classes
spec:
  interval: 1h
  path: ./kubernetes/apps/kube-system/priority-classes/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: priority-classes
    namespace: flux-system
  targetNamespace: kube-system
  wait: false
