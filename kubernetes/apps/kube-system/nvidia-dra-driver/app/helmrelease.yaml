---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-dra-driver
spec:
  chartRef:
    kind: OCIRepository
    name: nvidia-dra-driver
  interval: 1h
  values:
    featureGates:
      MPSSupport: true
      TimeSlicingSettings: true
    gpuResourcesEnabledOverride: true
    nvidiaDriverRoot: /usr/local
    resources:
      computeDomains:
        enabled: false
      gpus:
        enabled: true
    kubeletPlugin:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: extensions.talos.dev/nvidia-open-gpu-kernel-modules-production
                    operator: Exists
