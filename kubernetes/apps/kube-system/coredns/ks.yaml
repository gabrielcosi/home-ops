---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: coredns
spec:
  interval: 1h
  path: ./kubernetes/apps/kube-system/coredns/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: coredns
    namespace: flux-system
  targetNamespace: kube-system
  wait: false
