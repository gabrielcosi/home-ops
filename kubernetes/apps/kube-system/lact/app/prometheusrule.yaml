---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lact
  namespace: kube-system
spec:
  groups:
    - name: lact.rules
      rules:
        - alert: GpuCoolingNotResponding
          expr: |-
            max by (instance, UUID, modelName) (DCGM_FI_DEV_GPU_TEMP) > 78
              and max by (instance, UUID, modelName) (DCGM_FI_DEV_FAN_SPEED) < 95
          for: 10m
          annotations:
            summary: >-
              {{ $labels.modelName }} on {{ $labels.instance }} is above 78°C while its fan is below 95%
          labels:
            severity: warning

        - alert: GpuFanStuckHigh
          expr: |-
            max by (instance, UUID, modelName) (DCGM_FI_DEV_FAN_SPEED) > 80
              and max by (instance, UUID, modelName) (DCGM_FI_DEV_GPU_TEMP) < 55
          for: 30m
          annotations:
            summary: >-
              {{ $labels.modelName }} fan on {{ $labels.instance }} is above 80% while the GPU is idle
          labels:
            severity: warning
