---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          server: tank.internal
          path: /mnt/fast-pool/kopiur
  encryption:
    passwordSecretRef:
      name: kopiur-nas-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  health:
    indexBlobWarnThreshold: 5000
  identityDefaults:
    hostnameExpr: "namespace"
    usernameExpr: "policyName"
  maintenance:
    schedule:
      quick:
        cron: "0 */2 * * *"
        jitter: "30m"
      full:
        cron: "0 3 * * *"
        jitter: "1h"
  moverDefaults:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    ttlSecondsAfterFinished: 300
  parameters:
    epoch:
      minDuration: "1h"
  scheduleDefaults:
    timezone: Europe/Berlin
