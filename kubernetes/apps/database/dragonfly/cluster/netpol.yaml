---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dragonfly-allow-clients
  namespace: database
spec:
  description: Allow any in-cluster pod to reach the shared Dragonfly client port; egress only to replicas.
  endpointSelector:
    matchLabels:
      k8s:app: dragonfly
      k8s:app.kubernetes.io/name: dragonfly
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:app: dragonfly
            k8s:app.kubernetes.io/name: dragonfly
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
            - port: "9999"
              protocol: TCP
