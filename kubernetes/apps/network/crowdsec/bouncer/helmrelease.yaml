---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec-bouncer
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec-bouncer
  interval: 1h
  values:
    controllers:
      crowdsec-bouncer:
        annotations:
          reloader.stakater.com/auto: 'true'
        replicas: 2
        strategy: RollingUpdate

        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: crowdsec-bouncer

        containers:
          app:
            image:
              repository: ghcr.io/kdwils/envoy-proxy-bouncer
              tag: v0.8.4@sha256:3c7ff986f04c5f1739989463d2e9553f0e7163f9a55d02d240ed6e794e4078f0
            args: ['serve', '--config', '/app/config/config.yaml']
            env:
              ENVOY_BOUNCER_BOUNCER_APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: crowdsec-secrets
                    key: BOUNCER_KEY_ENVOY
              ENVOY_BOUNCER_WAF_APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: crowdsec-secrets
                    key: BOUNCER_KEY_ENVOY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  grpc:
                    port: 8080
                    service: liveness
              readiness:
                enabled: true
                custom: true
                spec:
                  grpc:
                    port: 8080
                    service: readiness
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ['ALL']

    service:
      app:
        ports:
          grpc:
            port: 8080
            appProtocol: kubernetes.io/h2c
          metrics:
            port: 9090

    serviceMonitor:
      app:
        endpoints:
          - port: metrics

    persistence:
      config:
        type: configMap
        name: crowdsec-bouncer-config
        globalMounts:
          - path: /app/config/config.yaml
            subPath: config.yaml
            readOnly: true
