---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec
spec:
  components:
    - ../../../../components/postgres/pass
  dependsOn:
    - name: cloudnative-pg
      namespace: cnpg-system
    - name: shared-pg
      namespace: database
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: crowdsec
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/network/crowdsec/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: false
  postBuild:
    substitute:
      APP: crowdsec
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec-bouncer
spec:
  dependsOn:
    - name: crowdsec
      namespace: network
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: crowdsec-bouncer
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/network/crowdsec/bouncer
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: false
