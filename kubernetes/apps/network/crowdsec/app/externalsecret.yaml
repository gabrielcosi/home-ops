---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    template:
      data:
        BOUNCER_KEY_ENVOY: '{{ .crowdsec_bouncer_key }}'
        CS_LAPI_SECRET: '{{ .crowdsec_lapi_secret }}'
        REGISTRATION_TOKEN: '{{ .crowdsec_registration_token }}'
  dataFrom:
    - extract:
        key: crowdsec
