---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./rbac.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: crowdsec-values
    files:
      - config.yaml=config/config.yaml
      - console.yaml=config/console.yaml
      - banwhitelist.yaml=config/banwhitelist.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
