---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: connector
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        resources:
          requests:
            cpu: 1m
            memory: 75Mi
          limits:
            memory: 175Mi
      tailscaleInitContainer:
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
