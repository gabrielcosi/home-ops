---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-connectors
spec:
  dependsOn:
    - name: tailscale-operator
      namespace: network
  healthChecks:
    - apiVersion: tailscale.com/v1alpha1
      kind: Connector
      name: egress
    - apiVersion: tailscale.com/v1alpha1
      kind: Connector
      name: ingress
  interval: 1h
  path: ./kubernetes/apps/network/tailscale/connectors/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
