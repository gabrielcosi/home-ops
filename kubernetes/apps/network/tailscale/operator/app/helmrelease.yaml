---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
spec:
  chartRef:
    kind: OCIRepository
    name: tailscale-operator
  interval: 1h
  values:
    oauthSecretVolume:
      secret:
        secretName: tailscale-secrets
    operatorConfig:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ['ALL']
      extraEnv:
        - name: XDG_CONFIG_HOME
          value: /tmp
      podAnnotations:
        secret.reloader.stakater.com/reload: tailscale-secrets
