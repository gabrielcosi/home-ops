---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: echo
spec:
  description: Restrict echo to ingress only, with all egress denied.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: echo
      app.kubernetes.io/name: echo
  egressDeny:
    - toEntities:
        - all
