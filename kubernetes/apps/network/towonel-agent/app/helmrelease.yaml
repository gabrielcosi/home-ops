---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-agent
spec:
  chartRef:
    kind: OCIRepository
    name: towonel-agent
  interval: 1h
  values:
    controllers:
      main:
        replicas: 2
        annotations:
          reloader.stakater.com/auto: 'true'
    agent:
      logLevel: info
      healthPort: 9090
      services:
        - hostname: "*.xcd.dev"
          origin: envoy-external.network.svc.cluster.local:443
        - hostname: "gabrielcosi.dev"
          origin: envoy-external.network.svc.cluster.local:443
      tcpServices:
        - name: forgejo-ssh
          origin: envoy-external.network.svc.cluster.local:22
          listen_port: 2222
        - name: monitoring-ingest
          origin: vmauth-ingest.monitoring.svc.cluster.local:8427
          listen_port: 18429
        - name: minecraft
          origin: gate.games.svc.cluster.local:25565
          listen_port: 25565
      inviteTokenSecret:
        name: towonel-secrets
        key: TOWONEL_INVITE_TOKEN
    serviceMonitor:
      main:
        enabled: true
        endpoints:
          - port: metrics
            interval: 1m
            scrapeTimeout: 10s
            path: /metrics
    monitoring:
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          allowCrossNamespaceImport: true
          matchLabels:
            dashboards: grafana
