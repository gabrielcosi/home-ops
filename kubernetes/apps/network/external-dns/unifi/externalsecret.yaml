---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-unifi-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    template:
      data:
        UNIFI_API_KEY: '{{ .unifi_api_key }}'

  dataFrom:
    - extract:
        key: unifi
