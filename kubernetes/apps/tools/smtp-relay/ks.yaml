kind: Kustomization
metadata:
  name: smtp-relay
spec:
  interval: 1h
  path: ./kubernetes/apps/tools/smtp-relay/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: smtp-relay
    namespace: flux-system
  targetNamespace: tools
  wait: false
