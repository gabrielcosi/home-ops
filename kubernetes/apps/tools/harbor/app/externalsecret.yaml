---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect

  target:
    template:
      data:
        PG_BACKUP_ACCESS_KEY_ID: '{{ .harbor_nas_backup_access_key_id }}'
        PG_BACKUP_ACCESS_SECRET_KEY: '{{ .harbor_nas_backup_access_secret_key }}'
        dragonfly_auth: '{{ .harbor_dragonfly_pwd }}'
        ### Harbor
        password: '{{ .harbor_db_pwd }}'
        REDIS_PASSWORD: '{{ .harbor_dragonfly_pwd }}'
        HARBOR_ADMIN_PASSWORD: '{{ .harbor_admin_password }}'
        secretKey: '{{ .harbor_secret_key }}'
        ### Argo CD drift guard (randAlphaNum/htpasswd)
        secret: '{{ .harbor_core_secret }}'
        CSRF_KEY: '{{ .harbor_csrf_key }}'
        'tls.crt': '{{ .harbor_core_tls_crt }}'
        'tls.key': '{{ .harbor_core_tls_key }}'
        JOBSERVICE_SECRET: '{{ .harbor_jobservice_secret }}'
        REGISTRY_HTTP_SECRET: '{{ .harbor_registry_http_secret }}'
        REGISTRY_PASSWD: '{{ .harbor_registry_password }}'
        REGISTRY_HTPASSWD: '{{ .harbor_registry_htpasswd }}'
        ### OIDC
        OAUTH_CLIENT_ID: '{{ .harbor_oauth_client_id }}'
        OAUTH_CLIENT_SECRET: '{{ .harbor_oauth_client_secret }}'

  dataFrom:
    - extract:
        key: harbor

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pg-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    template:
      type: kubernetes.io/basic-auth
      data:
        username: harbor
        password: '{{ .harbor_db_pwd }}'
  dataFrom:
    - extract:
        key: harbor
