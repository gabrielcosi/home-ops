---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor
spec:
  components:
    - ../../../../components/kopiur/restore
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: cloudnative-pg
      namespace: cnpg-system
    - name: plugin-barman-cloud
      namespace: cnpg-system
    - name: dragonfly-operator
      namespace: dragonfly-system
    - name: miroir
      namespace: miroir-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: harbor-pg
      namespace: tools
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      name: harbor-dragonfly
      namespace: tools
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: harbor
      namespace: tools
  interval: 1h
  path: ./kubernetes/apps/tools/harbor/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: tools
  wait: false
  postBuild:
    substitute:
      APP: harbor
      KOPIUR_CAPACITY: "10Gi"
      KOPIUR_STORAGECLASS: ceph-filesystem
      KOPIUR_ACCESSMODES: ReadWriteMany
      KOPIUR_PUID: "10000"
      KOPIUR_PGID: "10000"
      KOPIUR_SNAPSHOTCLASS: csi-ceph-filesystem
      KOPIUR_STAGING_STORAGECLASS: cephfs-backingsnapshot
      KOPIUR_STAGING_ACCESSMODES: ReadOnlyMany
