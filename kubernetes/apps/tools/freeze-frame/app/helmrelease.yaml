---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: freeze-frame
spec:
  chartRef:
    kind: OCIRepository
    name: freeze-frame
  interval: 1h
  values:
    controllers:
      freeze-frame:
        pod:
          imagePullSecrets:
            - name: registry-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

        containers:
          app:
            image:
              repository: reg.xcd.dev/private/freeze-frame
              tag: latest@sha256:8839ff50030395c25af490f380c7cc1fa367085a209f711222cb7129084f7c6b
            resources:
              requests:
                cpu: 1m
                memory: 10Mi
              limits:
                memory: 10Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ['ALL']

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /var/cache/nginx
          - path: /var/run
          - path: /tmp

    service:
      app:
        ports:
          http:
            port: 8080

    route:
      app:
        hostnames:
          - 'freeze-frame.xcd.dev'
        parentRefs:
          - name: envoy-internal
            namespace: network
