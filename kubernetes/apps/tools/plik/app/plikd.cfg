ListenPort     = 8080
ListenAddress  = "0.0.0.0"
LogLevel       = "INFO"

PlikDomain     = "https://share.xcd.dev"
SourceIpHeader = "X-Forwarded-For"

MaxFileSizeStr = "1TB"
DefaultTTLStr  = "30d"
MaxTTLStr      = "30d"

FeatureAuthentication    = "forced"
FeatureLocalLogin        = "disabled"
OIDCProviderName         = "Authentik"
OIDCProviderURL          = "https://auth.xcd.dev/application/o/plik/"
OIDCRequireVerifiedEmail = false

DataBackend = "file"
[DataBackendConfig]
    Directory = "/home/plik/server/files"

[MetadataBackendConfig]
    Driver           = "sqlite3"
    ConnectionString = "/home/plik/server/db/plik.db"
