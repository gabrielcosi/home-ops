---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plik
spec:
  dependsOn:
    - name: keda
      namespace: monitoring
    - name: rook-ceph-cluster
      namespace: rook-ceph
  components:
    - ../../../../components/kopiur/restore
    - ../../../../components/kopiur/backup
    - ../../../../components/keda/nfs
  interval: 1h
  path: ./kubernetes/apps/tools/plik/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: tools
  wait: false
  postBuild:
    substitute:
      APP: plik
      KOPIUR_PUID: "5010"
      KOPIUR_PGID: "3008"
      KOPIUR_CAPACITY: "100Mi"
