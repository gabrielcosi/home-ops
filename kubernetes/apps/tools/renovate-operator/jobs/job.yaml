---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: forgejo
spec:
  skipForks: true
  provider:
    name: forgejo
    endpoint: https://git.xcd.dev/api/v1
  extraEnv:
    - name: LOG_LEVEL
      value: info
  image: ghcr.io/renovatebot/renovate:44.165.1@sha256:455f4169a364a4c8bdc38a08694e3509649f3d7cb9aaea35c86946b38015ac47
  parallelism: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 4Gi
  schedule: '0 * * * *'
  secretRef: renovate-job-secrets
