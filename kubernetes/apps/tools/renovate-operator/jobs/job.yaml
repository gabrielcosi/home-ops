---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: forgejo
spec:
  skipForks: true
  provider:
    name: forgejo
    endpoint: https://git.xcd.dev/api/v1
  extraEnv:
    - name: LOG_LEVEL
      value: info
  image: ghcr.io/renovatebot/renovate:44.221.6@sha256:52454eae0bdcb51ddfecc39035e0fc2d97172751124049144e89d44343f6ae81
  parallelism: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 4Gi
  schedule: '0 * * * *'
  secretRef: renovate-job-secrets
