---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: forgejo
spec:
  skipForks: true
  provider:
    name: forgejo
    endpoint: https://git.xcd.dev/api/v1
  extraEnv:
    - name: LOG_LEVEL
      value: info
  image: ghcr.io/renovatebot/renovate:44.181.0@sha256:1a06e15f2d8bc08342828ec43c0a90de0ac9192900f513af90e77765e0991b6d
  parallelism: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 4Gi
  schedule: '0 * * * *'
  secretRef: renovate-job-secrets
