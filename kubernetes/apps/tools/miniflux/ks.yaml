---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: miniflux
spec:
  components:
    - ../../../../components/postgres/pass
  dependsOn:
    - name: cloudnative-pg
      namespace: cnpg-system
    - name: shared-pg
      namespace: database
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: miniflux
      namespace: tools
  interval: 1h
  path: ./kubernetes/apps/tools/miniflux/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: tools
  wait: false
  postBuild:
    substitute:
      APP: miniflux
