---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miniflux
spec:
  chartRef:
    kind: OCIRepository
    name: miniflux
  interval: 1h
  values:
    controllers:
      miniflux:
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/miniflux/miniflux
              tag: 2.3.4-distroless@sha256:4a457e73b6c298bd44f42b38d744afb8a08d3b94318f0c636162d0b35ce0f217
            env:
              TZ: Europe/Berlin
              BASE_URL: 'https://rss.xcd.dev'
              RUN_MIGRATIONS: '1'
              FETCHER_ALLOW_PRIVATE_NETWORKS: '1'
              OAUTH2_PROVIDER: oidc
              OAUTH2_OIDC_PROVIDER_NAME: Authentik
              OAUTH2_OIDC_DISCOVERY_ENDPOINT: 'https://auth.xcd.dev/application/o/miniflux/'
              OAUTH2_REDIRECT_URL: 'https://rss.xcd.dev/oauth2/oidc/callback'
              OAUTH2_USER_CREATION: '1'
              DISABLE_LOCAL_AUTH: '1'
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: miniflux-postgres
                    key: url
            envFrom:
              - secretRef:
                  name: miniflux-secret
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /healthcheck
              readiness:
                enabled: true
                type: HTTP
                path: /healthcheck
              startup:
                enabled: true
                type: HTTP
                path: /healthcheck
                spec:
                  periodSeconds: 5
                  failureThreshold: 12
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames:
          - 'rss.xcd.dev'
        parentRefs:
          - name: envoy-internal
            namespace: network
