---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cachette
spec:
  chartRef:
    kind: OCIRepository
    name: cachette
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          main:
            env:
              CACHETTE_EXTERNAL_URL: https://registry.xcd.dev
              CACHETTE_UPSTREAM_TRUSTED_NETWORKS: 10.42.0.0/16,192.168.0.0/16
              CACHETTE_UPSTREAM_ALLOWLIST: ceph.github.io,git.erwanleboucher.dev,helm.goharbor.io,kedacore.github.io,kubernetes-sigs.github.io,nvidia.github.io,pkgs.tailscale.com,registry.erwanleboucher.dev
              CACHETTE_PASSWORD_AUTH: admins
              CACHETTE_OIDC_ENABLED: 'true'
              CACHETTE_OIDC_NAME: Authentik
              CACHETTE_OIDC_ISSUER: https://auth.xcd.dev/application/o/cachette/
              CACHETTE_OIDC_PROVISION: 'true'
              CACHETTE_ADMIN_GROUPS: Cachette Admins
            envFrom:
              - secretRef:
                  name: cachette-secret

    persistence:
      data:
        existingClaim: cachette

    route:
      main:
        annotations:
          gatus.home-operations.com/endpoint: |
            url: https://registry.xcd.dev/v2/
            conditions:
              - '[STATUS] == 401'
              - '[BODY].errors[0].code == UNAUTHORIZED'
        hostnames:
          - 'registry.xcd.dev'
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: main
                port: http

    serviceMonitor:
      main:
        enabled: true
