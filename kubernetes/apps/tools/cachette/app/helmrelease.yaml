---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cachette
spec:
  chartRef:
    kind: OCIRepository
    name: cachette
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

    controllers:
      main:
        replicas: 2
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: 'true'
        podDisruptionBudget:
          minAvailable: 1
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cachette
                  app.kubernetes.io/controller: main
        containers:
          main:
            env:
              CACHETTE_EXTERNAL_URL: https://registry.xcd.dev
              CACHETTE_DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: cachette-postgres
                    key: url
              CACHETTE_UPSTREAM_TRUSTED_NETWORKS: 10.42.0.0/16,192.168.0.0/16
              CACHETTE_UPSTREAM_ALLOWLIST: ceph.github.io,code.forgejo.org,data.forgejo.org,docker.dragonflydb.io,docker.io,ghcr.io,git.erwanleboucher.dev,git.ow-ops.eu,gsoci.azurecr.io,kedacore.github.io,kubernetes-sigs.github.io,mirror.gcr.io,nvcr.io,nvidia.github.io,pkgs.tailscale.com,public.ecr.aws,quay.io,registry.erwanleboucher.dev,registry.k8s.io
              CACHETTE_DEFAULT_UPSTREAM_QUOTA_BYTES: '5368709120'
              CACHETTE_PASSWORD_AUTH: admins
              CACHETTE_OIDC_ENABLED: 'true'
              CACHETTE_OIDC_NAME: Authentik
              CACHETTE_OIDC_ISSUER: https://auth.xcd.dev/application/o/cachette/
              CACHETTE_OIDC_PROVISION: 'true'
              CACHETTE_OIDC_ADMIN_GROUPS: Cachette Admins
            envFrom:
              - secretRef:
                  name: cachette-secrets

    signingKey:
      existingSecret: cachette-keys

    encryptionKey:
      existingSecret: cachette-keys

    persistence:
      data:
        existingClaim: cachette

    route:
      main:
        annotations:
          gatus.home-operations.com/endpoint: |
            url: https://registry.xcd.dev/v2/
            conditions:
              - '[STATUS] == 401'
              - '[BODY].errors[0].code == UNAUTHORIZED'
        hostnames:
          - 'registry.xcd.dev'
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: main
                port: http

    serviceMonitor:
      main:
        enabled: true
