---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cachette
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: cnpg-system
    - name: shared-pg
      namespace: database
    - name: rook-ceph-cluster
      namespace: rook-ceph
  components:
    - ../../../../components/kopiur/restore
    - ../../../../components/kopiur/backup
    - ../../../../components/postgres/pass
  interval: 1h
  path: ./kubernetes/apps/tools/cachette/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: tools
  wait: false
  postBuild:
    substitute:
      APP: cachette
      DATABASE_HOST: shared-pg-rw.database.svc.cluster.local
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"
      KOPIUR_CAPACITY: "100Gi"
      KOPIUR_STORAGECLASS: ceph-filesystem
      KOPIUR_ACCESSMODES: ReadWriteMany
      KOPIUR_SNAPSHOTCLASS: csi-ceph-filesystem
      KOPIUR_STAGING_STORAGECLASS: cephfs-backingsnapshot
      KOPIUR_STAGING_ACCESSMODES: ReadOnlyMany
