---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: outline
spec:
  chartRef:
    kind: OCIRepository
    name: outline
  interval: 1h
  values:
    controllers:
      outline:
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: docker.io/outlinewiki/outline
              tag: 1.9.2
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: outline-postgres
                    key: url
              # General
              TZ: Europe/Berlin
              URL: 'https://docs.xcd.dev'
              PORT: 3000
              FORCE_HTTPS: false
              ENABLE_UPDATES: false
              WEB_CONCURRENCY: 2
              LOG_LEVEL: info
              DEFAULT_LANGUAGE: en_US
              # File storage
              FILE_STORAGE: local
              FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
              FILE_STORAGE_UPLOAD_MAX_SIZE: '10485760'
              # OIDC
              OIDC_DISPLAY_NAME: Authentik
              OIDC_SCOPES: 'openid profile email'
              OIDC_AUTH_URI: 'https://auth.xcd.dev/application/o/authorize/'
              OIDC_TOKEN_URI: 'https://auth.xcd.dev/application/o/token/'
              OIDC_USERINFO_URI: 'https://auth.xcd.dev/application/o/userinfo/'
              OIDC_LOGOUT_URI: 'https://auth.xcd.dev/application/o/outline/end-session/'
              OIDC_USERNAME_CLAIM: preferred_username
              # SMTP
              SMTP_HOST: smtp-relay.tools.svc.cluster.local
              SMTP_PORT: 25
              SMTP_FROM_EMAIL: 'outline@xcd.dev'
              SMTP_SECURE: false
            envFrom:
              - secretRef:
                  name: outline-secrets
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /_health
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                type: HTTP
                path: /_health
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                type: HTTP
                path: /_health
                spec:
                  periodSeconds: 5
                  failureThreshold: 12
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        ports:
          http:
            port: 3000

    route:
      app:
        hostnames:
          - 'docs.xcd.dev'
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      data:
        existingClaim: outline
        advancedMounts:
          outline:
            app:
              - path: /var/lib/outline/data
      tmp:
        type: emptyDir
        advancedMounts:
          outline:
            app:
              - path: /tmp
                subPath: tmp
              - path: /home/node
                subPath: node
