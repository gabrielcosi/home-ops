---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: forgejo-store
spec:
  configuration:
    destinationPath: s3://forgejo-backup
    endpointURL: https://s3.xcd.dev
    s3Credentials:
      accessKeyId:
        name: forgejo-secrets
        key: PG_BACKUP_ACCESS_KEY_ID
      secretAccessKey:
        name: forgejo-secrets
        key: PG_BACKUP_ACCESS_SECRET_KEY
    wal:
      compression: lz4
      maxParallel: 4
    data:
      compression: gzip
  retentionPolicy: '7d'
