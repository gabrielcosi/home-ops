cache:
  enabled: true
  dir: /data/cache
  port: 8088
  proxy_port: 8089
container:
  docker_host: "-"
  workdir_parent: shared/workdir
host:
  workdir_parent: /data/act
kubernetes:
  namespace: tools
  poll_timeout: 10m
log:
  level: info
plugins:
  k8s:
    address: "unix:///plugin/forgejo-runner-k8s.sock"
    options:
      namespace: tools
      poll_timeout: 10m
      labels: "app.kubernetes.io/name=forgejo-runner-instance"
runner:
  allowed_repos:
    - "gabrielcosi/*"
    - "xcd/*"
  blacklist_mode: false
  reject_text: "This runner is not allowed to run this job in this repository: {REPO}."
  capacity: 2
  envs:
    FORGEJO_PUBLIC_URL: https://git.xcd.dev
  labels:
    - ubuntu-latest:k8s:/config/podspec-default.yaml
    - default:k8s:/config/podspec-default.yaml
    - docker:k8s:/config/podspec-dind.yaml
  timeout: 3h
