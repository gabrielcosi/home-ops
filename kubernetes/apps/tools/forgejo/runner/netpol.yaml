---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-runner-jobs
  namespace: tools
spec:
  description: Restrict CI job pods to DNS, forgejo, crawl4ai, the runner cache, the external gateway, and internet 80/443.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner-instance
  enableDefaultDeny:
    ingress: true
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tools
            k8s:app.kubernetes.io/name: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app.kubernetes.io/name: crawl4ai
      toPorts:
        - ports:
            - port: "11235"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tools
            k8s:app.kubernetes.io/name: forgejo-runner
      toPorts:
        - ports:
            - port: "8088"
              protocol: TCP
            - port: "8089"
              protocol: TCP
    - toCIDR:
        - 192.168.69.182/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toCIDRSet:
        - cidrGroupRef: internet
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
  egressDeny:
    - toCIDRSet:
        - cidr: 10.0.0.0/8
          except:
            - 10.42.0.0/16
            - 10.43.0.0/16
    - toCIDRSet:
        - cidr: 192.168.0.0/16
          except:
            - 192.168.69.182/32
    - toCIDR:
        - 172.16.0.0/12
