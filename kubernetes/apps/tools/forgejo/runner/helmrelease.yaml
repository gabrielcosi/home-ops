---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: forgejo-runner-values
      valuesKey: config.yaml
      targetPath: runnerConfig
    - kind: ConfigMap
      name: forgejo-runner-values
      valuesKey: podspec-default.yaml
      targetPath: podSpecs.podspec-default\.yaml
    - kind: ConfigMap
      name: forgejo-runner-values
      valuesKey: podspec-dind.yaml
      targetPath: podSpecs.podspec-dind\.yaml
  values:
    replicaCount: 2

    forgejo:
      url: http://forgejo-http.tools.svc.cluster.local:3000
      existingSecret: forgejo-runner-secret

    image:
      repository: git.xcd.dev/gabrielcosi/runner
      tag: "12.13.0@sha256:ae90653c9dbbbbd7a97dbc817168ef8075d72384f13c7080c573d920acf6d794"
    plugin:
      image:
        repository: registry.erwanleboucher.dev/eleboucher/runner-k8s-plugin

    podLabels:
      app.kubernetes.io/component: forgejo-runner

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: forgejo-runner
                  app.kubernetes.io/instance: forgejo-runner
