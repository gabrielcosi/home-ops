---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: runner-shirley
spec:
  dependsOn:
    - name: forgejo
      namespace: forgejo
    - name: priority-classes
      namespace: kube-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: runner-shirley
      namespace: forgejo
  interval: 1h
  path: ./kubernetes/apps/forgejo/runner-shirley/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: forgejo
  wait: false
