cache:
  enabled: true
  dir: /data/cache
  port: 8088
  proxy_port: 8089
container:
  docker_host: "-"
  workdir_parent: shared/workdir
host:
  workdir_parent: /data/act
log:
  level: info
plugins:
  k8s:
    address: "unix:///plugin/forgejo-runner-k8s.sock"
    options:
      namespace: forgejo
      poll_timeout: 10m
      labels: "app.kubernetes.io/name=runner-shirley-instance"
runner:
  capacity: 1
  envs:
    FORGEJO_PUBLIC_URL: https://git.xcd.dev
  labels:
    - docker:k8s:/config/podspec-dind.yaml
  timeout: 3h
  shutdown_timeout: 4m
