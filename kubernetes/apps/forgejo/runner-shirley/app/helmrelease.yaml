---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runner-shirley
spec:
  chartRef:
    kind: OCIRepository
    name: runner-shirley
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: runner-shirley-values
      valuesKey: config.yaml
      targetPath: runnerConfig
    - kind: ConfigMap
      name: runner-shirley-values
      valuesKey: podspec-dind.yaml
      targetPath: podSpecs.podspec-dind\.yaml
  values:
    nameOverride: runner
    fullnameOverride: runner-shirley

    replicaCount: 1

    forgejo:
      url: http://forgejo-http.forgejo.svc.cluster.local:3000
      existingSecret: runner-shirley-secret

    image:
      repository: data.forgejo.org/forgejo/runner
      tag: "13.2.2@sha256:a8543a45fe62bebef0534d5c223cf485d3294e6dd2e42a82dbcbfd40c54a6a22"
    plugin:
      image:
        repository: registry.xcd.dev/x/registry.erwanleboucher.dev/eleboucher/runner-k8s-plugin
        tag: "13.2.2@sha256:403b5348a38934eae4b06011a457fcdeae3d16df1074eb758b8b31c10f837d76"

    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 256Mi

    podLabels:
      app.kubernetes.io/component: runner
