---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runner-shirley
spec:
  chartRef:
    kind: OCIRepository
    name: runner-shirley
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: runner-shirley-values
      valuesKey: config.yaml
      targetPath: runnerConfig
    - kind: ConfigMap
      name: runner-shirley-values
      valuesKey: podspec-dind.yaml
      targetPath: podSpecs.podspec-dind\.yaml
  values:
    nameOverride: runner
    fullnameOverride: runner-shirley

    replicaCount: 1

    forgejo:
      url: http://forgejo-http.forgejo.svc.cluster.local:3000
      existingSecret: runner-shirley-secret

    image:
      repository: data.forgejo.org/forgejo/runner
      tag: "13.2.1@sha256:568cea8c15ddc01fc8f330124892f572af7db37fa28344a2c1914405793bf61d"
    plugin:
      image:
        repository: registry.xcd.dev/x/registry.erwanleboucher.dev/eleboucher/runner-k8s-plugin
        tag: "13.2.1@sha256:d62811841a20fd1a311b2c90c6ffcec37d09e52ebb46834b0c04f3ad2a3bcbe7"

    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        memory: 256Mi

    podLabels:
      app.kubernetes.io/component: runner
