---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: runner
  namespace: forgejo
spec:
  scaleTargetRef:
    name: runner
  minReplicaCount: 1
  maxReplicaCount: 2
  pollingInterval: 15
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 180
  triggers:
    - type: prometheus
      name: wrk
      metadata:
        serverAddress: http://vmsingle-victoria-metrics-cluster.monitoring.svc.cluster.local:8428
        query: 1 + max(kube_node_status_condition{node="wrk-01",condition="Ready",status="true"})
        threshold: "1"
