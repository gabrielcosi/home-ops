initContainers:
  - name: format
    image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:fea96a5b525857bee41cc132cf95df67191b73cdd681569ada3000111420397e
    command:
      - sh
      - -c
      - mkfs.ext4 -q -F -m0 /dev/docker-disk
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 512Mi
    volumeDevices:
      - name: docker-storage
        devicePath: /dev/docker-disk
  - name: dind
    image: docker:29-dind
    command:
      - sh
      - -c
      - mount -o discard /dev/docker-disk /var/lib/docker && exec dockerd-entrypoint.sh
    restartPolicy: Always
    securityContext:
      privileged: true
    env:
      - name: DOCKER_TLS_CERTDIR
        value: /certs
    resources:
      requests:
        cpu: 750m
        memory: 2560Mi
      limits:
        cpu: 2
        memory: 4Gi
    volumeDevices:
      - name: docker-storage
        devicePath: /dev/docker-disk
    volumeMounts:
      - name: docker-certs
        mountPath: /certs
    startupProbe:
      tcpSocket:
        port: 2376
      initialDelaySeconds: 5
      periodSeconds: 1
      failureThreshold: 30
containers:
  - name: main
    image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:fea96a5b525857bee41cc132cf95df67191b73cdd681569ada3000111420397e
    imagePullPolicy: IfNotPresent
    env:
      - name: DEBIAN_FRONTEND
        value: noninteractive
      - name: DOCKER_HOST
        value: tcp://localhost:2376
      - name: DOCKER_TLS_VERIFY
        value: '1'
      - name: DOCKER_CERT_PATH
        value: /certs/client
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 2Gi
    volumeMounts:
      - name: docker-certs
        mountPath: /certs
        readOnly: true
      - name: shared
        mountPath: /shared
        subPath: workspace
      - name: shared
        mountPath: /root/.cache
        subPath: cache
      - name: shared
        mountPath: /root/.local/share/mise
        subPath: mise
      - name: shared
        mountPath: /root/go
        subPath: go
runtimeClassName: kata
priorityClassName: batch-low
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
volumes:
  - name: shared
    ephemeral:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: miroir-local
          resources:
            requests:
              storage: 20Gi
  - name: docker-storage
    ephemeral:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: miroir-local
          volumeMode: Block
          resources:
            requests:
              storage: 20Gi
  - name: docker-certs
    emptyDir: {}
restartPolicy: Never
