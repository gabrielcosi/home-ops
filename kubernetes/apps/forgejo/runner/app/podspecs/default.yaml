containers:
  - name: main
    image: ghcr.io/catthehacker/ubuntu:act-24.04@sha256:f195e42bedd719818f81f28c6e54c1d08c5a8400f3012aa187cb90df3823e59a
    imagePullPolicy: IfNotPresent
    env:
      - name: DEBIAN_FRONTEND
        value: noninteractive
    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 4
        memory: 6Gi
    volumeMounts:
      - name: shared
        mountPath: /shared
        subPath: workspace
      - name: shared
        mountPath: /root/.cache
        subPath: cache
      - name: shared
        mountPath: /root/.local/share/mise
        subPath: mise
      - name: shared
        mountPath: /root/go
        subPath: go
runtimeClassName: kata
priorityClassName: batch-low
restartPolicy: Never
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
volumes:
  - name: shared
    ephemeral:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: miroir-local
          resources:
            requests:
              storage: 20Gi
