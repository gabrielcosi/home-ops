containers:
  - name: main
    image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:fea96a5b525857bee41cc132cf95df67191b73cdd681569ada3000111420397e
    imagePullPolicy: IfNotPresent
    env:
      - name: DEBIAN_FRONTEND
        value: noninteractive
    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 4
        memory: 6Gi
    volumeMounts:
      - name: shared
        mountPath: /shared
        subPath: workspace
      - name: shared
        mountPath: /root/.cache
        subPath: cache
      - name: shared
        mountPath: /root/.local/share/mise
        subPath: mise
      - name: shared
        mountPath: /root/go
        subPath: go
runtimeClassName: kata
priorityClassName: batch-low
restartPolicy: Never
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
volumes:
  - name: shared
    ephemeral:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: miroir-local
          resources:
            requests:
              storage: 20Gi
