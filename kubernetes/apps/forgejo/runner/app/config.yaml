cache:
  enabled: true
  external_server: http://runner-cache.forgejo.svc.cluster.local:8088/
  proxy_port: 8089
  secret_url: file:///etc/forgejo-runner-secret/cache
container:
  docker_host: "-"
  workdir_parent: shared/workdir
host:
  workdir_parent: /data/act
log:
  level: info
plugins:
  k8s:
    address: "unix:///plugin/forgejo-runner-k8s.sock"
    options:
      namespace: forgejo
      poll_timeout: 10m
      labels: "app.kubernetes.io/name=runner-instance"
runner:
  capacity: 4
  envs:
    FORGEJO_PUBLIC_URL: https://git.xcd.dev
  labels:
    - ubuntu-latest:k8s:/config/podspec-default.yaml
    - default:k8s:/config/podspec-default.yaml
    - docker:k8s:/config/podspec-dind.yaml
  timeout: 3h
  shutdown_timeout: 4m
