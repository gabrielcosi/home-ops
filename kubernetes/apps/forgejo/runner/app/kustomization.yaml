---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./externalsecret.yaml
  - ./netpol.yaml
  - ./scaledobject.yaml

configMapGenerator:
  - name: runner-values
    files:
      - config.yaml
      - podspec-default.yaml=podspecs/default.yaml
      - podspec-dind.yaml=podspecs/dind.yaml
      - podspec-large.yaml=podspecs/large.yaml
      - podspec-dindlarge.yaml=podspecs/dindlarge.yaml

generatorOptions:
  disableNameSuffixHash: true
