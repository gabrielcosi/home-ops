---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: runner-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect

  target:
    template:
      data:
        uuid: '{{ .forgejo_runner_uuid }}'
        token: '{{ .forgejo_runner_token }}'

  dataFrom:
    - extract:
        key: forgejo
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: runner-keda
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect

  target:
    template:
      data:
        token: '{{ .forgejo_keda_token }}'

  dataFrom:
    - extract:
        key: forgejo
