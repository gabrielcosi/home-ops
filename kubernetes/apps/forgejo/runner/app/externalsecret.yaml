---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: runner-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect

  target:
    template:
      data:
        uuid: '{{ .forgejo_runner_uuid }}'
        token: '{{ .forgejo_runner_token }}'
        cache: '{{ .forgejo_runner_cache_secret }}'

  dataFrom:
    - extract:
        key: forgejo
