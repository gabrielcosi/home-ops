---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runner
spec:
  chartRef:
    kind: OCIRepository
    name: runner
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: runner-values
      valuesKey: config.yaml
      targetPath: runnerConfig
    - kind: ConfigMap
      name: runner-values
      valuesKey: podspec-default.yaml
      targetPath: podSpecs.podspec-default\.yaml
    - kind: ConfigMap
      name: runner-values
      valuesKey: podspec-dind.yaml
      targetPath: podSpecs.podspec-dind\.yaml
    - kind: ConfigMap
      name: runner-values
      valuesKey: podspec-talos.yaml
      targetPath: podSpecs.podspec-talos\.yaml
  values:
    nameOverride: runner
    fullnameOverride: runner

    replicaCount: 2

    forgejo:
      url: http://forgejo-http.forgejo.svc.cluster.local:3000
      existingSecret: runner-secret

    image:
      repository: data.forgejo.org/forgejo/runner
      tag: "13.2.0@sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552"
    plugin:
      image:
        repository: registry.xcd.dev/x/registry.erwanleboucher.dev/eleboucher/runner-k8s-plugin
        tag: "13.2.1@sha256:d62811841a20fd1a311b2c90c6ffcec37d09e52ebb46834b0c04f3ad2a3bcbe7"

    podLabels:
      app.kubernetes.io/component: runner

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: runner
                  app.kubernetes.io/instance: runner
