---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runner
spec:
  chartRef:
    kind: OCIRepository
    name: runner
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: runner-values
      valuesKey: config.yaml
      targetPath: runnerConfig
    - kind: ConfigMap
      name: runner-values
      valuesKey: podspec-default.yaml
      targetPath: podSpecs.podspec-default\.yaml
    - kind: ConfigMap
      name: runner-values
      valuesKey: podspec-dind.yaml
      targetPath: podSpecs.podspec-dind\.yaml
    - kind: ConfigMap
      name: runner-values
      valuesKey: podspec-large.yaml
      targetPath: podSpecs.podspec-large\.yaml
    - kind: ConfigMap
      name: runner-values
      valuesKey: podspec-dindlarge.yaml
      targetPath: podSpecs.podspec-dindlarge\.yaml
  values:
    nameOverride: runner
    fullnameOverride: runner

    replicaCount: 1
    terminationGracePeriodSeconds: 960

    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        memory: 256Mi

    forgejo:
      url: http://forgejo-http.forgejo.svc.cluster.local:3000
      existingSecret: runner-secret

    image:
      repository: data.forgejo.org/forgejo/runner
      tag: "13.2.2@sha256:a8543a45fe62bebef0534d5c223cf485d3294e6dd2e42a82dbcbfd40c54a6a22"
    plugin:
      image:
        repository: registry.xcd.dev/x/registry.erwanleboucher.dev/eleboucher/runner-k8s-plugin
        tag: "13.3.1@sha256:efb3dedcdd60ce99243dd3d560bf1fad2a06bb1f27a689feb9a220b84e3497e2"

    podLabels:
      app.kubernetes.io/component: runner

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: runner
                  app.kubernetes.io/instance: runner
