---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: runner-cache
  namespace: forgejo
spec:
  description: Allow the runner daemons to reach the cache server, and deny its egress.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: runner-cache
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: forgejo
            k8s:app.kubernetes.io/instance: runner
            k8s:app.kubernetes.io/name: runner
      toPorts:
        - ports:
            - port: "8088"
              protocol: TCP
  egressDeny:
    - toEntities:
        - all
