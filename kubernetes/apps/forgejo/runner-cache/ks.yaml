---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: runner-cache
spec:
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: runner
      namespace: forgejo
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: runner-cache
      namespace: forgejo
  interval: 1h
  path: ./kubernetes/apps/forgejo/runner-cache/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: forgejo
  wait: false
