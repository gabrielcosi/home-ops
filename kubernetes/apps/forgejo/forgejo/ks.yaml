---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo
spec:
  components:
    - ../../../../components/kopiur/restore
    - ../../../../components/kopiur/backup
    - ../../../../components/anubis
    - ../../../../components/dragonfly
  dependsOn:
    - name: cloudnative-pg
      namespace: cnpg-system
    - name: plugin-barman-cloud
      namespace: cnpg-system
    - name: dragonfly-operator
      namespace: dragonfly-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: forgejo-pg
      namespace: forgejo
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      name: forgejo-dragonfly
      namespace: forgejo
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: forgejo
      namespace: forgejo
  interval: 1h
  path: ./kubernetes/apps/forgejo/forgejo/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: forgejo
  wait: false
  postBuild:
    substitute:
      APP: forgejo
      APP_NAMESPACE: forgejo
      ANUBIS_TARGET: http://forgejo-http.forgejo.svc.cluster.local:3000
      DRAGONFLY_PASSWORD_KEY: dragonfly_auth
      KOPIUR_CAPACITY: "10Gi"
      KOPIUR_STORAGECLASS: ceph-filesystem
      KOPIUR_ACCESSMODES: ReadWriteMany
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"
      KOPIUR_SNAPSHOTCLASS: csi-ceph-filesystem
      KOPIUR_STAGING_STORAGECLASS: cephfs-backingsnapshot
      KOPIUR_STAGING_ACCESSMODES: ReadOnlyMany
