---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-pg
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 3
  primaryUpdateMethod: switchover
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:23719505c7cc417b043ffd9998b44ab8d57fec1d92f0bf11b231a1754a5962f2

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          cnpg.io/cluster: forgejo-pg

  bootstrap:
    recovery:
      source: &src source
      database: forgejodb
      owner: forgejo
      secret:
        name: forgejo-pg-credentials

  externalClusters:
    - name: *src
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: forgejo-store
          serverName: forgejo-pg-v18

  storage:
    pvcTemplate:
      storageClassName: ceph-block
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 3Gi

  resources:
    requests:
      memory: '512Mi'
      cpu: '50m'
    limits:
      memory: '1Gi'

  postgresql:
    parameters:
      timezone: Europe/Berlin
      max_wal_size: '512MB'
      min_wal_size: '128MB'
      max_slot_wal_keep_size: '1GB'
      wal_compression: 'on'
      wal_keep_size: '0'

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: forgejo-store
        serverName: forgejo-pg-v18

  managed:
    roles:
      - name: forgejo
        ensure: present
        login: true
        passwordSecret:
          name: forgejo-pg-credentials
