---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wyoming-openai
spec:
  chartRef:
    kind: OCIRepository
    name: wyoming-openai
  interval: 1h
  values:
    controllers:
      wyoming-openai:
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/roryeckel/wyoming_openai
              tag: 0.8.0@sha256:c88a1b06e3305140a830705213977dd5ea7cd7dd970bf99e3f84abfd7e83f26e
            env:
              WYOMING_URI: 'tcp://0.0.0.0:10300'
              WYOMING_LOG_LEVEL: INFO
              WYOMING_LANGUAGES: en
              STT_OPENAI_URL: 'http://bifrost.ai.svc.cluster.local:8080/v1'
              STT_MODELS: zeus/stt
              STT_BACKEND: OPENAI
              TTS_OPENAI_URL: 'http://bifrost.ai.svc.cluster.local:8080/v1'
              TTS_MODELS: zeus/tts
              TTS_VOICES: angel.wav
              TTS_BACKEND: OPENAI
            envFrom:
              - secretRef:
                  name: wyoming-openai-secrets
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10300
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10300
                  initialDelaySeconds: 3
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10300
                  periodSeconds: 5
                  failureThreshold: 30
                  timeoutSeconds: 1
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      wyoming-openai:
        ports:
          wyoming:
            port: 10300
