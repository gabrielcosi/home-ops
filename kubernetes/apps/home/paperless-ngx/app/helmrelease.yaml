---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
spec:
  chartRef:
    kind: OCIRepository
    name: paperless-ngx
  interval: 1h
  values:
    controllers:
      paperless-ngx:
        pod:
          annotations:
            reloader.stakater.com/auto: 'true'
          securityContext:
            runAsUser: 5001
            runAsGroup: 5001
            runAsNonRoot: true
            fsGroup: 5001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            env:
              PAPERLESS_TIME_ZONE: Europe/Berlin
              PAPERLESS_URL: https://paperless.xcd.dev
              PAPERLESS_OCR_LANGUAGE: deu+eng+spa
              PAPERLESS_FILENAME_FORMAT: '{{ `{{ created_year }}/{{ document_type }}/{{ created_year }}-{{ created_month }}-{{ created_day }}_{{ title }}` }}'
              PAPERLESS_DATA_DIR: /paperless/data
              PAPERLESS_MEDIA_ROOT: /paperless/media
              PAPERLESS_CONSUMER_DISABLE: 'true'
              PAPERLESS_CONSUMPTION_DIR: /tmp/consume
              PAPERLESS_EXPORT_DIR: /tmp/export
              PAPERLESS_WEBSERVER_WORKERS: '2'
              PAPERLESS_TASK_WORKERS: '2'
              PAPERLESS_FILENAME_FORMAT_REMOVE_NONE: 'true'
              USER_IS_NON_ROOT: '1'
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: '1'
              PAPERLESS_APPS: 'allauth.socialaccount.providers.openid_connect'
              PAPERLESS_DISABLE_REGULAR_LOGIN: 'true'
              PAPERLESS_REDIRECT_LOGIN_TO_SSO: 'true'
              PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: 'true'

            envFrom:
              - secretRef:
                  name: paperless-secrets

            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.1.1
              pullPolicy: IfNotPresent
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ['ALL']

            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 5

            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi

    service:
      app:
        controller: paperless-ngx
        ports:
          http:
            port: 8000

    route:
      app:
        hostnames:
          - 'paperless.xcd.dev'
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      paperless:
        existingClaim: paperless-ngx
        advancedMounts:
          paperless-ngx:
            app:
              - path: /paperless/data
                subPath: data
              - path: /paperless/media
                subPath: media

      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

      run:
        type: emptyDir
        globalMounts:
          - path: /run
