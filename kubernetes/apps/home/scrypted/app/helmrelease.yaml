---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrypted
spec:
  chartRef:
    kind: OCIRepository
    name: scrypted
  interval: 1h
  values:
    controllers:
      scrypted:
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |-
              [{
                "name": "trusted",
                "namespace": "kube-system",
                "ips": ["192.168.10.4/24"],
                "mac": "be:24:11:10:00:04"
              }]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/gabrielcosi/containers/scrypted
              tag: v0.148.10-noble-full@sha256:8fa6284e7dc41583d0e579682d3491d409ca56d491b9d24205195f596d52c3d2
            resources:
              requests:
                cpu: 75m
                memory: 1.25Gi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ['ALL']

    service:
      app:
        ports:
          http:
            port: 11080

    route:
      app:
        hostnames:
          - 'scrypted.xcd.dev'
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      config:
        existingClaim: scrypted
        advancedMounts:
          scrypted:
            app:
              - path: /server/volume
      tmp:
        type: emptyDir
        globalMounts:
          - path: /home/ubuntu
          - path: /tmp
