---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matter
spec:
  chartRef:
    kind: OCIRepository
    name: matter
  interval: 1h
  values:
    controllers:
      matter:
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |-
              [{
                "name": "iot",
                "namespace": "kube-system",
                "ips": ["192.168.70.11/24"],
                "mac": "be:24:11:70:00:11"
              }]
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/matter-js/matterjs-server
              tag: 1.4.0
            env:
              TZ: Europe/Berlin
            args:
              - --storage-path=/data
              - --primary-interface=net1
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ['ALL']
                add: ['NET_RAW']

    service:
      app:
        ports:
          http:
            port: 5580

    route:
      app:
        hostnames:
          - 'matter.xcd.dev'
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      data:
        existingClaim: matter
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
