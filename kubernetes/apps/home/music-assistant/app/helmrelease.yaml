---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: music-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: music-assistant
  interval: 1h
  values:
    controllers:
      music-assistant:
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |-
              [{
                "name": "trusted",
                "namespace": "kube-system",
                "ips": ["192.168.10.3/24"],
                "mac": "be:24:11:10:00:03"
              }]
          securityContext:
            runAsNonRoot: true
            runAsGroup: 65534
            runAsUser: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/music-assistant/server
              tag: 2.10.0.dev2026082115
            env:
              TZ: Europe/Berlin
              LOG_LEVEL: info
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ['ALL'] }
            resources:
              requests:
                cpu: 25m
                memory: 1Gi
              limits:
                memory: 1Gi

    service:
      app:
        ports:
          http:
            port: 8095
          stream:
            port: 8097
          snapstream:
            port: 1704
          snapcontrol:
            port: 1705
          snapstream-range-start:
            port: 4953
          snapstream-range-end:
            port: 5153

    route:
      app:
        hostnames:
          - 'music.xcd.dev'
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      config:
        existingClaim: music-assistant
        advancedMounts:
          music-assistant:
            app:
              - path: /data
                subPath: data
              - path: /cache
                subPath: cache
