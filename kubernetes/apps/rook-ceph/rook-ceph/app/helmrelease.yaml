---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  interval: 1h
  values:
    csi:
      cephFSKernelMountOptions: ms_mode=prefer-crc
      csiRBDProvisionerResource: |
        - name: csi-provisioner
          resource:
            requests:
              cpu: 10m
              memory: 128Mi
        - name: csi-resizer
          resource:
            requests:
              cpu: 10m
              memory: 128Mi
        - name: csi-attacher
          resource:
            requests:
              cpu: 10m
              memory: 128Mi
        - name: csi-snapshotter
          resource:
            requests:
              cpu: 10m
              memory: 128Mi
        - name: csi-rbdplugin
          resource:
            requests:
              cpu: 10m
              memory: 128Mi
        - name: liveness-prometheus
          resource:
            requests:
              cpu: 10m
              memory: 64Mi
      csiRBDPluginResource: |
        - name: driver-registrar
          resource:
            requests:
              cpu: 10m
              memory: 64Mi
        - name: csi-rbdplugin
          resource:
            requests:
              cpu: 10m
              memory: 128Mi
        - name: liveness-prometheus
          resource:
            requests:
              cpu: 10m
              memory: 64Mi
      csiCephFSProvisionerResource: |
        - name: csi-provisioner
          resource:
            requests:
              cpu: 10m
              memory: 128Mi
        - name: csi-resizer
          resource:
            requests:
              cpu: 10m
              memory: 128Mi
        - name: csi-attacher
          resource:
            requests:
              cpu: 10m
              memory: 128Mi
        - name: csi-snapshotter
          resource:
            requests:
              cpu: 10m
              memory: 128Mi
        - name: csi-cephfsplugin
          resource:
            requests:
              cpu: 10m
              memory: 128Mi
        - name: liveness-prometheus
          resource:
            requests:
              cpu: 10m
              memory: 64Mi
      csiCephFSPluginResource: |
        - name: driver-registrar
          resource:
            requests:
              cpu: 10m
              memory: 64Mi
        - name: csi-cephfsplugin
          resource:
            requests:
              cpu: 10m
              memory: 128Mi
        - name: liveness-prometheus
          resource:
            requests:
              cpu: 10m
              memory: 64Mi
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    resources:
      requests:
        cpu: 100m # unchangeable
        memory: 128Mi # unchangeable
      limits: {}
