---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gabrielcosi
spec:
  chartRef:
    kind: OCIRepository
    name: gabrielcosi
  interval: 1h
  values:
    controllers:
      gabrielcosi:
        replicas: 2
        strategy: RollingUpdate
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: gabrielcosi
          imagePullSecrets:
            - name: registry-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

        containers:
          app:
            image:
              repository: registry.xcd.dev/gabrielcosi/gabrielcosi.dev
              tag: latest@sha256:9169b0f6f10035737765a2950ca41bdc97ad92beb1f3d1461bf80ee135307558
            envFrom:
              - secretRef:
                  name: gabrielcosi-secrets
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ['ALL']
            resources:
              requests:
                cpu: '5m'
                memory: '200Mi'
              limits:
                memory: '200Mi'

    service:
      app:
        ports:
          web:
            port: 3000

    route:
      app:
        hostnames:
          - 'gabrielcosi.dev'
        parentRefs:
          - name: envoy-external
            namespace: network
