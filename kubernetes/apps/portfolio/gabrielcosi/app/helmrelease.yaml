---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gabrielcosi
spec:
  chartRef:
    kind: OCIRepository
    name: gabrielcosi
  interval: 1h
  values:
    controllers:
      gabrielcosi:
        replicas: 2
        strategy: RollingUpdate
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: gabrielcosi
          imagePullSecrets:
            - name: registry-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

        containers:
          app:
            image:
              repository: reg.xcd.dev/private/gabrielcosi.dev
              tag: latest@sha256:5d9c6607770c4a2b1a7cc41cfee8b904bfbcebb808dddbd8c0a38c38ab462714
            envFrom:
              - secretRef:
                  name: gabrielcosi-secrets
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ['ALL']
            resources:
              requests:
                cpu: '5m'
                memory: '200Mi'
              limits:
                memory: '200Mi'

    service:
      app:
        ports:
          web:
            port: 3000

    route:
      app:
        hostnames:
          - 'gabrielcosi.dev'
        parentRefs:
          - name: envoy-external
            namespace: network
