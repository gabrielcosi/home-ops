---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shirleyrossell
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: shirleyrossell
      namespace: portfolio
  interval: 1h
  path: ./kubernetes/apps/portfolio/shirleyrossell/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: portfolio
  wait: false
