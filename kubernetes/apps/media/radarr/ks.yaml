---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: radarr
spec:
  dependsOn:
    - name: keda
      namespace: monitoring
    - name: rook-ceph-cluster
      namespace: rook-ceph
  components:
    - ../../../../components/kopiur/restore
    - ../../../../components/kopiur/backup
    - ../../../../components/keda/nfs
  interval: 1h
  path: ./kubernetes/apps/media/radarr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
  postBuild:
    substitute:
      APP: radarr
      KOPIUR_PUID: "5006"
      KOPIUR_PGID: "3007"
      KOPIUR_CAPACITY: "500Mi"
