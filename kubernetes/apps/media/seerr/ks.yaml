---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seerr
spec:
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  components:
    - ../../../../components/kopiur/restore
    - ../../../../components/kopiur/backup
    - ../../../../components/anubis
  interval: 1h
  path: ./kubernetes/apps/media/seerr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
  postBuild:
    substitute:
      APP: seerr
      APP_NAMESPACE: media
      ANUBIS_TARGET: http://seerr.media.svc.cluster.local:5055
      KOPIUR_PUID: '65534'
      KOPIUR_PGID: '65534'
      KOPIUR_CAPACITY: '100Mi'
