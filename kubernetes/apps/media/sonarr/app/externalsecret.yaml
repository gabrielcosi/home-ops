---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    template:
      data:
        api_key: '{{ .sonarr_api_key }}'
  dataFrom:
    - extract:
        key: sonarr
