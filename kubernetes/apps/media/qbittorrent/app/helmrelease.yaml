---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  interval: 1h
  values:
    controllers:
      qbittorrent:
        replicas: 0
        annotations:
          reloader.stakater.com/auto: 'true'

        pod:
          securityContext:
            fsGroup: 3007
            fsGroupChangePolicy: 'OnRootMismatch'
            seccompProfile:
              type: RuntimeDefault

        initContainers:
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.1
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
                squat.ai/tun: 1
            env:
              VPN_SERVICE_PROVIDER: protonvpn
              VPN_TYPE: wireguard
              SERVER_COUNTRIES: Netherlands
              PORT_FORWARD_ONLY: 'on'
              VPN_INTERFACE: tun0
              VPN_PORT_FORWARDING: 'on'
              WIREGUARD_ADDRESSES: 10.2.0.2/32
              FIREWALL_INPUT_PORTS: '8080,9999'
              HEALTH_SERVER_ADDRESS: ':9999'
            envFrom:
              - secretRef:
                  name: qbittorrent-secrets
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
            restartPolicy: Always
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - (ip rule del table 51820; ip -6 rule del table 51820) || true
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ['ALL']
                add: ['NET_ADMIN'] # required for iptables and VPN tunnel

        containers:
          app:
            nameOverride: qbittorrent
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.3
            env:
              QBT_WEBUI_PORT: 8080
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/app/version
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              runAsNonRoot: true
              runAsUser: 5004
              runAsGroup: 3007
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ['ALL'] }

    service:
      app:
        ports:
          http:
            port: 8080

    route:
      app:
        hostnames:
          - 'qbit.xcd.dev'
        parentRefs:
          - name: envoy-internal-auth
            namespace: network

    persistence:
      config:
        existingClaim: qbittorrent
        advancedMounts:
          qbittorrent:
            app:
              - path: /config

      downloads:
        type: nfs
        server: tank.internal
        path: /mnt/home-pool/library/downloads
        globalMounts:
          - path: /downloads
