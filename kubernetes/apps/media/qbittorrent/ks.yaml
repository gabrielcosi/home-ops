---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qbittorrent
spec:
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  components:
    - ../../../../components/kopiur/restore
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./kubernetes/apps/media/qbittorrent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
  postBuild:
    substitute:
      APP: qbittorrent
      KOPIUR_PUID: "5004"
      KOPIUR_PGID: "3007"
      KOPIUR_CAPACITY: "100Mi"
