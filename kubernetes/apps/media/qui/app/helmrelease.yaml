---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qui
spec:
  chartRef:
    kind: OCIRepository
    name: qui
  interval: 1h
  values:
    controllers:
      qui:
        replicas: 0
        annotations:
          reloader.stakater.com/auto: 'true'

        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 5005
            runAsGroup: 3007
            fsGroup: 3007
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

        containers:
          app:
            image:
              repository: ghcr.io/autobrr/qui
              tag: v1.23.0
            env:
              QUI__HOST: 0.0.0.0
              QUI__METRICS_ENABLED: 'true'
              QUI__METRICS_HOST: 0.0.0.0
              QUI__METRICS_PORT: 9074
              QUI__OIDC_DISABLE_BUILT_IN_LOGIN: 'true'
              QUI__OIDC_ENABLED: 'true'
              QUI__OIDC_ISSUER: https://auth.xcd.dev/application/o/qui/
              QUI__OIDC_REDIRECT_URL: https://qui.xcd.dev/api/auth/oidc/callback
              QUI__PORT: 8080
              TZ: Europe/Berlin
            envFrom:
              - secretRef:
                  name: qui-secrets
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        ports:
          http:
            port: 8080
          metrics:
            port: 9074

    # serviceMonitor:
    #   app:
    #     serviceName: qui
    #     endpoints:
    #       - port: metrics
    #         path: /metrics
    #         interval: 30s

    route:
      app:
        hostnames:
          - 'qui.xcd.dev'
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      config:
        existingClaim: qui
        advancedMounts:
          qui:
            app:
              - path: /config

      downloads:
        type: nfs
        server: tank.internal
        path: /mnt/home-pool/library/downloads
        globalMounts:
          - path: /downloads
