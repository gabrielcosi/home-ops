---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sabnzbd-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect

  target:
    template:
      data:
        SABNZBD__API_KEY: '{{ .sabnzbd_api_key }}'
        SABNZBD__NZB_KEY: '{{ .sabnzbd_nzb_key }}'

  dataFrom:
    - extract:
        key: sabnzbd
