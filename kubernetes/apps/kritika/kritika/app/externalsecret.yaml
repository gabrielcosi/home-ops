---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    template:
      data:
        PG_BACKUP_ACCESS_KEY_ID: '{{ .kritika_nas_backup_access_key_id }}'
        PG_BACKUP_ACCESS_SECRET_KEY: '{{ .kritika_nas_backup_access_secret_key }}'
        KRITIKA_OIDC_CLIENT_ID: '{{ .kritika_oauth_client_id }}'
        KRITIKA_OIDC_CLIENT_SECRET: '{{ .kritika_oauth_client_secret }}'
        KRITIKA_FORGEJO_PRIVATE_KEY: '{{ .kritika_forgejo_private_key }}'
        KRITIKA_FORGEJO_WEBHOOK_SECRET: '{{ .kritika_forgejo_webhook_secret }}'
        KRITIKA_BIFROST_VK: '{{ .bifrost_vk_kritika }}'
  dataFrom:
    - extract:
        key: kritika
    - extract:
        key: bifrost
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-pg-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika
        password: '{{ .kritika_pg_pwd }}'
        uri: 'postgres://kritika:{{ .kritika_pg_pwd }}@kritika-pg-rw.kritika.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10'
  dataFrom:
    - extract:
        key: kritika
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-pg-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika_app
        password: '{{ .kritika_pg_app_pwd }}'
        uri: 'postgres://kritika_app:{{ .kritika_pg_app_pwd }}@kritika-pg-rw.kritika.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10'
  dataFrom:
    - extract:
        key: kritika
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-pg-runner
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika_runner
        password: '{{ .kritika_pg_runner_pwd }}'
        uri: 'postgres://kritika_runner:{{ .kritika_pg_runner_pwd }}@kritika-pg-rw.kritika.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10'
  dataFrom:
    - extract:
        key: kritika
