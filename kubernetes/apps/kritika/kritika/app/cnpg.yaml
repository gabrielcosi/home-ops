---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kritika-pg
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 3
  primaryUpdateMethod: switchover
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          cnpg.io/cluster: kritika-pg

  bootstrap:
    recovery:
      source: &src source
      database: kritika
      owner: kritika
      secret:
        name: kritika-pg-credentials

  externalClusters:
    - name: *src
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: kritika-store
          serverName: kritika-pg-v18

  storage:
    pvcTemplate:
      storageClassName: ceph-block
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi

  resources:
    requests:
      memory: '512Mi'
      cpu: '50m'
    limits:
      memory: '1Gi'

  postgresql:
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1@sha256:bdea43bed2a414e21bbf71767bf6f0739747ac480b267b51772dc214ac28dcb3
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib/
        extension_control_path:
          - /usr/share/postgresql/18/
    shared_preload_libraries:
      - vchord
    parameters:
      timezone: Europe/Berlin
      max_wal_size: '512MB'
      min_wal_size: '128MB'
      max_slot_wal_keep_size: '1GB'
      wal_compression: 'on'
      wal_keep_size: '0'

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: kritika-store
        serverName: kritika-pg-v18

  managed:
    roles:
      - name: kritika_app
        ensure: present
        login: true
        passwordSecret:
          name: kritika-pg-app
      - name: kritika_runner
        ensure: present
        login: true
        passwordSecret:
          name: kritika-pg-runner
