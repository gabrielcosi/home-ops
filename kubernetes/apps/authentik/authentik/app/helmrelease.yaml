---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  chartRef:
    kind: OCIRepository
    name: authentik
  interval: 1h
  values:
    authentik:
      secret_key: file:///authentik-secrets/secret_key

      postgresql:
        host: authentik-pooler.authentik.svc.cluster.local
        password: file:///authentik-secrets/pg_password
        conn_max_age: 300
        conn_health_checks: true
        disable_server_side_cursors: true

      redis:
        host: dragonfly.database.svc.cluster.local
        db: 2

      email:
        host: smtp-relay.tools.svc.cluster.local
        port: 25
        use_tls: false
        use_ssl: false
        from: auth@xcd.dev

    global:
      volumes:
        - name: authentik-secrets
          secret:
            secretName: authentik-secrets

      volumeMounts:
        - name: authentik-secrets
          mountPath: /authentik-secrets
          readOnly: true

    server:
      replicas: 2
      livenessProbe:
        timeoutSeconds: 10
        failureThreshold: 5
      readinessProbe:
        timeoutSeconds: 10
        failureThreshold: 5
      startupProbe:
        timeoutSeconds: 10
        failureThreshold: 30
        initialDelaySeconds: 60

      pdb:
        enabled: true
        minAvailable: 1

      resources:
        requests:
          memory: '1Gi'
          cpu: '50m'
        limits:
          memory: '1Gi'

      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: authentik
              app.kubernetes.io/component: server

    worker:
      replicas: 1
      env:
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: authentik-pg-rw.authentik.svc.cluster.local
      livenessProbe:
        timeoutSeconds: 10
        failureThreshold: 5
      readinessProbe:
        timeoutSeconds: 10
        failureThreshold: 5
      startupProbe:
        timeoutSeconds: 10
        failureThreshold: 30
        initialDelaySeconds: 60

      resources:
        requests:
          memory: '640Mi'
          cpu: '100m'
        limits:
          memory: '640Mi'
