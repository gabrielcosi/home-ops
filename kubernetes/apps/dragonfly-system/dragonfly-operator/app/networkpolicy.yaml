---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-vmagent-to-dragonfly-admin
spec:
  description: Allow vmagent to scrape Dragonfly admin metrics across namespaces.
  endpointSelector:
    matchLabels:
      k8s:app: dragonfly
      k8s:app.kubernetes.io/name: dragonfly
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
