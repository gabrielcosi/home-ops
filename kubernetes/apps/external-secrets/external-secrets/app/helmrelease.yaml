---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  chartRef:
    kind: OCIRepository
    name: external-secrets
  interval: 1h
  values:
    leaderElect: true

    resources:
      requests:
        cpu: 5m
        memory: 128Mi
      limits:
        memory: 512Mi

    serviceMonitor:
      enabled: true
      interval: 1m

    grafanaDashboard:
      enabled: true

    webhook:
      replicaCount: 2

      resources:
        requests:
          cpu: 5m
          memory: 100Mi
        limits:
          memory: 100Mi

      serviceMonitor:
        enabled: true
        interval: 1m

    certController:
      resources:
        requests:
          cpu: 5m
          memory: 100Mi
        limits:
          memory: 100Mi

      serviceMonitor:
        enabled: true
        interval: 1m
