---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword-connect-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: onepassword-connect-credentials-secret
    template:
      data:
        1password-credentials.json: '{{ .OP_CONNECT_CREDENTIALS_JSON }}'
  dataFrom:
    - extract:
        key: 1password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword-connect-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: onepassword-connect-token-secret
    template:
      data:
        OP_CONNECT_TOKEN: '{{ .OP_CONNECT_TOKEN }}'
  dataFrom:
    - extract:
        key: 1password
