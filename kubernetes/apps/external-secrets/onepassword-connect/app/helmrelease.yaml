---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword-connect
spec:
  chartRef:
    kind: OCIRepository
    name: onepassword-connect
  interval: 1h
  values:
    connect:
      annotations:
        reloader.stakater.com/auto: 'true'
      credentialsName: onepassword-connect-credentials-secret
      api:
        httpPort: 8080
        imageRepository: ghcr.io/1password/connect-api
        resources:
          requests:
            cpu: 5m
            memory: 50Mi
          limits:
            memory: 128Mi
        serviceMonitor:
          enabled: true
      sync:
        imageRepository: ghcr.io/1password/connect-sync
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 64Mi
