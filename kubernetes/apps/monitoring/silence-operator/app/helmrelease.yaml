---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silence-operator
spec:
  chartRef:
    kind: OCIRepository
    name: silence-operator
  interval: 1h
  values:
    alertmanagerAddress: http://vmalertmanager-victoria-metrics-cluster.monitoring.svc.cluster.local:9093
    networkPolicy:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        cpu: null
        memory: 100Mi
