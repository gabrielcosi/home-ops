---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: smartctl-exporter
spec:
  interval: 1h
  path: ./kubernetes/apps/monitoring/smartctl-exporter/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: smartctl-exporter
    namespace: flux-system
  targetNamespace: monitoring
  wait: false
