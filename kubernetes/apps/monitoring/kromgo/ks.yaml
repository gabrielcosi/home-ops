---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kromgo
spec:
  interval: 1h
  path: ./kubernetes/apps/monitoring/kromgo/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: kromgo
    namespace: flux-system
  targetNamespace: monitoring
  wait: false
