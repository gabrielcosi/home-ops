---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-syslog
  namespace: monitoring
  annotations:
    io.cilium/lb-ipam-ips: '192.168.69.189'
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: victoria-logs
    app.kubernetes.io/name: victoria-logs-single
  ports:
    - name: syslog-udp
      port: 514
      targetPort: 5514
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-talos
  namespace: monitoring
spec:
  type: ClusterIP
  clusterIP: 10.43.0.60
  internalTrafficPolicy: Local
  selector:
    app.kubernetes.io/instance: victoria-logs
    app.kubernetes.io/name: vector
  ports:
    - name: talos-kmsg
      port: 6050
      targetPort: 6050
      protocol: TCP
