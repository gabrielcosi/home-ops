---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-syslog
  namespace: monitoring
  annotations:
    io.cilium/lb-ipam-ips: '192.168.69.189'
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: victoria-logs
    app.kubernetes.io/name: victoria-logs-single
  ports:
    - name: syslog-udp
      port: 514
      targetPort: 5514
      protocol: UDP
