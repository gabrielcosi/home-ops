---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 1h
  values:
    global:
      image:
        registry: quay.io

    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
        spec:
          allowCrossNamespaceImport: true
          instanceSelector:
            matchLabels:
              dashboards: grafana

    server:
      fullnameOverride: victoria-logs
      retentionPeriod: 90d
      nodeSelector:
        node-role.kubernetes.io/control-plane: ''
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 50Gi
      resources:
        requests:
          cpu: 60m
          memory: 600Mi
        limits:
          memory: 2Gi
      serviceMonitor:
        enabled: true
      syslog:
        udp:
          - name: syslog-udp
            value: :5514
            streamFields: '["hostname","app_name"]'
            useLocalTimestamp: true
            useRemoteIP: true

    vector:
      enabled: true
      role: Agent
      image:
        repository: docker.io/timberio/vector
        tag: 0.62.0-distroless-libc
      rbac:
        create: false
      persistence:
        hostPath:
          enabled: false
      defaultVolumes: []
      defaultVolumeMounts: []
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      containerPorts:
        - name: prom-exporter
          containerPort: 9090
          protocol: TCP
        - name: talos-kmsg
          containerPort: 6050
          protocol: TCP
      service:
        enabled: false
      podMonitor:
        enabled: true
      customConfig:
        sources:
          k8s:
            type: socket
            mode: tcp
            address: 0.0.0.0:6050
            framing:
              method: newline_delimited
              newline_delimited:
                max_length: 262144
        transforms:
          parser:
            drop_on_error: true
            source: |
              . = merge(object!(parse_json!(.message)), {"node": get_env_var!("VECTOR_SELF_NODE_NAME")})
              service = string(."talos-service") ?? ""
              if includes(["kernel", "dns-resolve-cache"], service) || (service == "machined" && contains(string(.msg) ?? "", "match with service \"dashboard\"")) {
                abort
              }
              if is_string(.msg) {
                .msg = replace(string!(.msg), r'\n$', "")
              }
              if is_string(.content) {
                .content = replace(string!(.content), r'\n$', "")
              }
              if exists(."talos-level") {
                .level = del(."talos-level")
              }
        sinks:
          vlogs:
            request:
              headers:
                VL-Time-Field: talos-time
                VL-Stream-Fields: node,talos-service,facility
                VL-Msg-Field: msg,content
