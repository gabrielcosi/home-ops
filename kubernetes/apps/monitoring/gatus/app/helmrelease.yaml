---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gatus-sidecar
  values:
    fullnameOverride: gatus

    deploymentAnnotations:
      reloader.stakater.com/auto: 'true'

    gatus:
      delayStartSeconds: '5'
      env:
        TZ: Europe/Berlin
      extraEnv:
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: gatus-postgres
              key: url
        - name: PUSHOVER_TOKEN
          valueFrom:
            secretKeyRef:
              name: gatus-secrets
              key: PUSHOVER_TOKEN
        - name: PUSHOVER_USER_KEY
          valueFrom:
            secretKeyRef:
              name: gatus-secrets
              key: PUSHOVER_USER_KEY

    sidecar:
      gatewayNames:
        - envoy-external
      kinds:
        httproute:
          enable: true
          auto: true
        service:
          enable: false

    config:
      existingConfigMap: gatus-config
      items:
        - key: config.yaml
          path: config.yaml
        - key: buddy.yaml
          path: buddy.yaml

    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/enabled: 'false'
      hostnames:
        - 'status.xcd.dev'
      parentRefs:
        - name: envoy-external
          namespace: network

    monitoring:
      serviceMonitor:
        enabled: true

    resources:
      requests:
        cpu: 50m
      limits:
        memory: 512Mi
