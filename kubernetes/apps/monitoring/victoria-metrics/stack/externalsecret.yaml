---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ingest-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    template:
      data:
        vps-password: '{{ .monitoring_vps_ingest_password }}'
  dataFrom:
    - extract:
        key: monitoring

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alertmanager-secret
    template:
      data:
        heartbeat_token: '{{ .monitoring_gatus_heartbeat_token }}'
        pushover_token: '{{ .monitoring_alertmanager_pushover_token }}'
        pushover_user_key: '{{ .monitoring_pushover_user_key }}'
  dataFrom:
    - extract:
        key: monitoring
