---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmagent
  namespace: monitoring
spec:
  description: Restrict vmagent ingress to vmauth-ingest, its own scrapes, the host, and its backends.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: victoria-metrics-cluster
      app.kubernetes.io/name: vmagent
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: ingest
            app.kubernetes.io/name: vmauth
      toPorts:
        - ports:
            - port: '8429'
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: victoria-metrics-cluster
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: '8429'
              protocol: TCP
            - port: '8435'
              protocol: TCP
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: victoria-metrics-cluster
            app.kubernetes.io/name: vmsingle
        - matchLabels:
            app.kubernetes.io/instance: blackbox-exporter
            app.kubernetes.io/name: prometheus-blackbox-exporter
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmalert
  namespace: monitoring
spec:
  description: Restrict vmalert ingress to metrics scrapes, the host, and its backends.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: victoria-metrics-cluster
      app.kubernetes.io/name: vmalert
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: victoria-metrics-cluster
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
            - port: '8435'
              protocol: TCP
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: victoria-metrics-cluster
            app.kubernetes.io/name: vmauth
        - matchLabels:
            app.kubernetes.io/instance: victoria-metrics-cluster
            app.kubernetes.io/name: vmsingle
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmalertmanager
  namespace: monitoring
spec:
  description: Restrict alertmanager ingress to alert senders and readers, its peers, metrics scrapes, and the host.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: victoria-metrics-cluster
      app.kubernetes.io/name: vmalertmanager
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: victoria-metrics-cluster
            app.kubernetes.io/name: vmalert
        - matchLabels:
            app.kubernetes.io/instance: karma
            app.kubernetes.io/name: karma
        - matchLabels:
            app.kubernetes.io/instance: silence-operator
            app.kubernetes.io/name: silence-operator
        - matchLabels:
            app: grafana
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
            k8s:app: notification-controller
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: system-upgrade
            k8s:app.kubernetes.io/name: tuppr
      toPorts:
        - ports:
            - port: '9093'
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: victoria-metrics-cluster
            app.kubernetes.io/name: vmalertmanager
      toPorts:
        - ports:
            - port: '9094'
              protocol: TCP
            - port: '9094'
              protocol: UDP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: victoria-metrics-cluster
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: '9093'
              protocol: TCP
            - port: '8435'
              protocol: TCP
    - fromEntities:
        - host
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmauth
  namespace: monitoring
spec:
  description: Restrict vmauth ingress to grafana, kromgo, metrics scrapes, the host, and its backends.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: victoria-metrics-cluster
      app.kubernetes.io/name: vmauth
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: grafana
        - matchLabels:
            app.kubernetes.io/instance: kromgo
            app.kubernetes.io/name: kromgo
      toPorts:
        - ports:
            - port: '8427'
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: victoria-metrics-cluster
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: '8427'
              protocol: TCP
            - port: '8435'
              protocol: TCP
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: victoria-metrics-cluster
            app.kubernetes.io/name: vmsingle
        - matchLabels:
            app.kubernetes.io/instance: victoria-metrics-cluster
            app.kubernetes.io/name: vmalert
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmsingle
  namespace: monitoring
spec:
  description: Restrict vmsingle ingress to its writers and readers, the host, and vmalert.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: victoria-metrics-cluster
      app.kubernetes.io/name: vmsingle
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: victoria-metrics-cluster
            app.kubernetes.io/name: vmagent
        - matchLabels:
            app.kubernetes.io/instance: victoria-metrics-cluster
            app.kubernetes.io/name: vmauth
        - matchLabels:
            app: keda-operator
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app: vmetrics-mcp
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: rook-ceph
            k8s:app: rook-ceph-mgr
      toPorts:
        - ports:
            - port: '8428'
              protocol: TCP
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: victoria-metrics-cluster
            app.kubernetes.io/name: vmalert
