---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: ingest
spec:
  userSelector:
    matchLabels:
      app.kubernetes.io/part-of: external-ingest
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: vps
  labels:
    app.kubernetes.io/part-of: external-ingest
spec:
  username: vps
  passwordRef:
    name: ingest-credentials
    key: vps-password
  targetRefs:
    - paths:
        - /api/v1/write.*
      static:
        url: http://vmagent-victoria-metrics-cluster.monitoring.svc.cluster.local:8429
    - paths:
        - /insert/jsonline.*
      static:
        url: http://victoria-logs.monitoring.svc.cluster.local:9428
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: zeus
  labels:
    app.kubernetes.io/part-of: external-ingest
spec:
  username: zeus
  passwordRef:
    name: ingest-credentials
    key: zeus-password
  targetRefs:
    - paths:
        - /api/v1/write.*
      static:
        url: http://vmagent-victoria-metrics-cluster.monitoring.svc.cluster.local:8429
