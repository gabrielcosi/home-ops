---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: unpoller
spec:
  groups:
    - name: unpoller.rules
      rules:
        - alert: UniFiDeviceHighCPU
          expr: |-
            avg_over_time(unpoller_device_cpu_utilization_ratio[15m]) > 0.75
          for: 15m
          annotations:
            summary: >-
              UniFi device {{ $labels.name }} has averaged {{ $value | humanizePercentage }} CPU over the last 15 minutes
          labels:
            severity: warning

        - alert: UniFiDeviceCPUCreep
          expr: |-
            max by (name) (avg_over_time(unpoller_device_cpu_utilization_ratio{type="udm"}[2h]))
              -
            sum by (name) (
              rate(unpoller_device_port_receive_packets_total[2h])
                + rate(unpoller_device_port_transmit_packets_total[2h])
            ) * 3.2e-6
              > 0.2
          for: 1h
          annotations:
            summary: >-
              UniFi device {{ $labels.name }} has averaged {{ $value | humanizePercentage }} baseline CPU over the last 2 hours
          labels:
            severity: warning

        - alert: UniFiDeviceHighMemory
          expr: |-
            avg_over_time(unpoller_device_memory_utilization_ratio[15m]) > 0.9
          for: 30m
          annotations:
            summary: >-
              UniFi device {{ $labels.name }} has averaged {{ $value | humanizePercentage }} memory over the last 15 minutes
          labels:
            severity: warning

        - alert: UniFiDeviceMemoryLeak
          expr: |-
            predict_linear(unpoller_device_memory_utilization_ratio[12h], 24 * 3600) > 0.95
              and unpoller_device_memory_utilization_ratio > 0.85
          for: 1h
          annotations:
            summary: >-
              UniFi device {{ $labels.name }} is trending toward memory exhaustion within 24 hours
          labels:
            severity: warning

        - alert: UniFiControllerUnreachable
          expr: |-
            unpoller_controller_up == 0
          for: 10m
          annotations:
            summary: >-
              unpoller cannot reach the UniFi controller — UniFi device metrics and alerts are blind
          labels:
            severity: warning
