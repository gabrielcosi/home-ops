---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unpoller
spec:
  interval: 1h
  path: ./kubernetes/apps/monitoring/unpoller/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: unpoller
    namespace: flux-system
  targetNamespace: monitoring
  wait: false
