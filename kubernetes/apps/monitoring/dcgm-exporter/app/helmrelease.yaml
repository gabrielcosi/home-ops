---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dcgm-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: dcgm-exporter
  interval: 1h
  values:
    fullnameOverride: dcgm-exporter
    runtimeClassName: nvidia
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: extensions.talos.dev/nvidia-open-gpu-kernel-modules-production
                  operator: Exists
    config:
      metrics:
        - name: default
          file: /etc/dcgm-exporter/counters/counters.csv
          every: 30s
          enrichment:
            kubernetes: auto
            container: false
            dra: true
            hpc_jobs: false
      sources:
        dra:
          mode: kubernetes
    extraConfigMapVolumes:
      - name: counters
        configMap:
          name: dcgm-exporter-counters
    extraVolumeMounts:
      - name: counters
        mountPath: /etc/dcgm-exporter/counters
        readOnly: true
    serviceMonitor:
      enabled: true
      honorLabels: true
      relabelings:
        - action: replace
          regex: (.*)
          replacement: $1.internal
          sourceLabels:
            - __meta_kubernetes_endpoint_node_name
          targetLabel: instance
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
