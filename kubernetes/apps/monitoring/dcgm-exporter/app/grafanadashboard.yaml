---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: nvidia-gpu
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: |
    {
      "uid": "nvidia-gpu",
      "title": "NVIDIA GPU",
      "tags": ["nvidia", "gpu", "dcgm"],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "time": {"from": "now-3h", "to": "now"},
      "timepicker": {},
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "instance",
            "label": "Node",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "victoriametrics"},
            "query": {"qryType": 1, "query": "label_values(DCGM_FI_DEV_GPU_TEMP, instance)", "refId": "PrometheusVariableQueryEditor-VariableQuery"},
            "includeAll": true,
            "multi": true,
            "current": {"selected": true, "text": ["All"], "value": ["$__all"]},
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "model",
            "label": "GPU",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "victoriametrics"},
            "query": {
              "qryType": 1,
              "query": "label_values(DCGM_FI_DEV_GPU_TEMP{instance=~\"$instance\"}, modelName)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "includeAll": true,
            "multi": true,
            "current": {"selected": true, "text": ["All"], "value": ["$__all"]},
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {"type": "row", "title": "Overview", "id": 100, "collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}, "panels": []},
        {
          "type": "stat",
          "title": "Temperature",
          "id": 1,
          "gridPos": {"h": 4, "w": 3, "x": 0, "y": 1},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [{"refId": "A", "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_GPU_TEMP{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")", "legendFormat": "{{card}}"}],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "decimals": 0,
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "green", "value": null}, {"color": "#EAB839", "value": 75}, {"color": "orange", "value": 90}, {"color": "red", "value": 100}]
              }
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name", "colorMode": "background", "graphMode": "area"}
        },
        {
          "type": "stat",
          "title": "Peak Temp (range)",
          "id": 2,
          "gridPos": {"h": 4, "w": 3, "x": 3, "y": 1},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {
              "refId": "A",
              "expr": "label_replace(max by (instance, gpu, modelName) (max_over_time(DCGM_FI_DEV_GPU_TEMP{instance=~\"$instance\",modelName=~\"$model\"}[$__range])), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")",
              "instant": true,
              "legendFormat": "{{card}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "decimals": 0,
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "green", "value": null}, {"color": "#EAB839", "value": 75}, {"color": "orange", "value": 90}, {"color": "red", "value": 100}]
              }
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name", "colorMode": "background", "graphMode": "none"}
        },
        {
          "type": "stat",
          "title": "Power Draw",
          "id": 3,
          "gridPos": {"h": 4, "w": 3, "x": 6, "y": 1},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [{"refId": "A", "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_POWER_USAGE{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")", "legendFormat": "{{card}}"}],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 1,
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name", "colorMode": "background", "graphMode": "area"}
        },
        {
          "type": "stat",
          "title": "SM Clock",
          "id": 4,
          "gridPos": {"h": 4, "w": 3, "x": 9, "y": 1},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [{"refId": "A", "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_SM_CLOCK{instance=~\"$instance\",modelName=~\"$model\"}) * 1000000, \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")", "legendFormat": "{{card}}"}],
          "fieldConfig": {
            "defaults": {
              "unit": "hertz",
              "decimals": 2,
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name", "colorMode": "background", "graphMode": "area"}
        },
        {
          "type": "stat",
          "title": "GPU Utilization",
          "id": 5,
          "gridPos": {"h": 4, "w": 4, "x": 12, "y": 1},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [{"refId": "A", "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_GPU_UTIL{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")", "legendFormat": "{{card}}"}],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 0,
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name", "colorMode": "background", "graphMode": "area"}
        },
        {
          "type": "stat",
          "title": "VRAM Used",
          "id": 6,
          "gridPos": {"h": 4, "w": 4, "x": 16, "y": 1},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {
              "refId": "A",
              "expr": "label_replace(100 * max by (instance, gpu, modelName) (DCGM_FI_DEV_FB_USED{instance=~\"$instance\",modelName=~\"$model\"}) / clamp_min(max by (instance, gpu, modelName) (DCGM_FI_DEV_FB_USED{instance=~\"$instance\",modelName=~\"$model\"}) + max by (instance, gpu, modelName) (DCGM_FI_DEV_FB_FREE{instance=~\"$instance\",modelName=~\"$model\"}), 1), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")",
              "legendFormat": "{{card}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "#EAB839", "value": 85}, {"color": "red", "value": 95}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name", "colorMode": "background", "graphMode": "area"}
        },
        {
          "type": "stat",
          "title": "Fan Speed",
          "id": 7,
          "gridPos": {"h": 4, "w": 4, "x": 20, "y": 1},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [{"refId": "A", "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_FAN_SPEED{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")", "legendFormat": "{{card}}"}],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 0,
              "noValue": "n/a",
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "colorMode": "background", "graphMode": "area"}
        },
        {
          "type": "row",
          "title": "Clocks, Utilization & Memory",
          "id": 101,
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 5},
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Clocks",
          "id": 10,
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 6},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {"refId": "A", "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_SM_CLOCK{instance=~\"$instance\",modelName=~\"$model\"}) * 1000000, \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")", "legendFormat": "{{card}} sm"},
            {
              "refId": "B",
              "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_MEM_CLOCK{instance=~\"$instance\",modelName=~\"$model\"}) * 1000000, \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")",
              "legendFormat": "{{card}} memory"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "hertz",
              "decimals": 2,
              "min": 0,
              "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true}
            },
            "overrides": [{"matcher": {"id": "byName", "options": "memory"}, "properties": [{"id": "custom.axisPlacement", "value": "right"}]}]
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "type": "timeseries",
          "title": "Utilization",
          "id": 11,
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 6},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {
              "refId": "A",
              "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_GPU_UTIL{instance=~\"$instance\",modelName=~\"$model\"}) / 100, \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")",
              "legendFormat": "{{card}} gpu util"
            },
            {
              "refId": "B",
              "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_PROF_GR_ENGINE_ACTIVE{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")",
              "legendFormat": "{{card}} graphics engine"
            },
            {"refId": "C", "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_PROF_SM_ACTIVE{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")", "legendFormat": "{{card}} sm active"},
            {
              "refId": "D",
              "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_PROF_SM_OCCUPANCY{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")",
              "legendFormat": "{{card}} sm occupancy"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "min": 0,
              "max": 1,
              "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 0, "showPoints": "never", "spanNulls": true}
            },
            "overrides": []
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "type": "timeseries",
          "title": "Workload Mix",
          "id": 14,
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 6},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {
              "refId": "A",
              "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_PROF_PIPE_TENSOR_ACTIVE{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")",
              "legendFormat": "{{card}} tensor"
            },
            {
              "refId": "B",
              "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_PROF_PIPE_FP32_ACTIVE{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")",
              "legendFormat": "{{card}} fp32"
            },
            {
              "refId": "C",
              "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_PROF_PIPE_FP16_ACTIVE{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")",
              "legendFormat": "{{card}} fp16"
            },
            {
              "refId": "D",
              "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_PROF_DRAM_ACTIVE{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")",
              "legendFormat": "{{card}} memory interface"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "min": 0,
              "max": 1,
              "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true}
            },
            "overrides": []
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "type": "timeseries",
          "title": "Encoder / Decoder",
          "id": 12,
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {"refId": "A", "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_ENC_UTIL{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")", "legendFormat": "{{card}} encoder"},
            {"refId": "B", "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_DEC_UTIL{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")", "legendFormat": "{{card}} decoder"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 0,
              "min": 0,
              "max": 100,
              "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true}
            },
            "overrides": []
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "type": "timeseries",
          "title": "VRAM",
          "id": 13,
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {"refId": "A", "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_FB_USED{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")", "legendFormat": "{{card}} used"},
            {"refId": "B", "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_FB_FREE{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")", "legendFormat": "{{card}} free"},
            {"refId": "C", "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_FB_RESERVED{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")", "legendFormat": "{{card}} reserved"},
            {"refId": "D", "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_FB_TOTAL{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")", "legendFormat": "{{card}} total"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "mbytes",
              "decimals": 0,
              "min": 0,
              "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true}
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "total"},
                "properties": [
                  {"id": "custom.fillOpacity", "value": 0},
                  {"id": "custom.lineStyle", "value": {"fill": "dash", "dash": [10, 10]}},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "text"}}
                ]
              }
            ]
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {"type": "row", "title": "Thermals & Power", "id": 102, "collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 22}, "panels": []},
        {
          "type": "timeseries",
          "title": "Temperature",
          "id": 20,
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 23},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {"refId": "A", "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_GPU_TEMP{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")", "legendFormat": "{{card}} core"},
            {
              "refId": "B",
              "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_MEMORY_TEMP{instance=~\"$instance\",modelName=~\"$model\"}) > 0, \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")",
              "legendFormat": "{{card}} memory"
            },
            {
              "refId": "C",
              "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_SLOWDOWN_TEMP{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")",
              "legendFormat": "{{card}} slowdown limit"
            },
            {
              "refId": "D",
              "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_SHUTDOWN_TEMP{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")",
              "legendFormat": "{{card}} shutdown limit"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "decimals": 0,
              "min": 0,
              "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true}
            },
            "overrides": [
              {
                "matcher": {"id": "byRegexp", "options": ".*limit.*"},
                "properties": [
                  {"id": "custom.fillOpacity", "value": 0},
                  {"id": "custom.lineStyle", "value": {"fill": "dash", "dash": [10, 10]}},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}
                ]
              }
            ]
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "type": "timeseries",
          "title": "Power",
          "id": 21,
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 23},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {"refId": "A", "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_POWER_USAGE{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")", "legendFormat": "{{card}} draw"},
            {
              "refId": "B",
              "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_ENFORCED_POWER_LIMIT{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")",
              "legendFormat": "{{card}} enforced limit"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 1,
              "min": 0,
              "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true}
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "enforced limit"},
                "properties": [
                  {"id": "custom.fillOpacity", "value": 0},
                  {"id": "custom.lineStyle", "value": {"fill": "dash", "dash": [10, 10]}},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}
                ]
              }
            ]
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "type": "timeseries",
          "title": "Fan Speed",
          "id": 22,
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 23},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [{"refId": "A", "expr": "label_replace(max by (instance, gpu, modelName) (DCGM_FI_DEV_FAN_SPEED{instance=~\"$instance\",modelName=~\"$model\"}), \"card\", \"$1\", \"modelName\", \"NVIDIA RTX (PRO [0-9]+).*\")", "legendFormat": "{{card}} fan"}],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 0,
              "noValue": "not reported by this GPU",
              "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true}
            },
            "overrides": []
