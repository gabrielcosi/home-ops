---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: dcgm-exporter
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
  url: https://grafana.com/api/dashboards/12239/revisions/2/download
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: nvidia-gpu
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: |
    {
      "uid": "nvidia-gpu",
      "title": "NVIDIA GPU",
      "tags": ["nvidia", "gpu", "dcgm"],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "time": {"from": "now-3h", "to": "now"},
      "timepicker": {},
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "instance",
            "label": "Node",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "victoriametrics"},
            "query": {"qryType": 1, "query": "label_values(DCGM_FI_DEV_GPU_TEMP, instance)", "refId": "PrometheusVariableQueryEditor-VariableQuery"},
            "includeAll": true,
            "multi": true,
            "current": {"selected": true, "text": ["All"], "value": ["$__all"]},
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "gpu",
            "label": "GPU",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "victoriametrics"},
            "query": {
              "qryType": 1,
              "query": "label_values(DCGM_FI_DEV_GPU_TEMP{instance=~\"$instance\"}, gpu)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "includeAll": true,
            "multi": true,
            "current": {"selected": true, "text": ["All"], "value": ["$__all"]},
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {"type": "row", "title": "Overview", "id": 100, "collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}, "panels": []},
        {
          "type": "stat",
          "title": "Temperature",
          "id": 1,
          "gridPos": {"h": 4, "w": 3, "x": 0, "y": 1},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [{"refId": "A", "expr": "DCGM_FI_DEV_GPU_TEMP{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "core"}],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "decimals": 0,
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "green", "value": null}, {"color": "#EAB839", "value": 75}, {"color": "orange", "value": 90}, {"color": "red", "value": 100}]
              }
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "colorMode": "background", "graphMode": "area"}
        },
        {
          "type": "stat",
          "title": "Peak Temp (range)",
          "id": 2,
          "gridPos": {"h": 4, "w": 3, "x": 3, "y": 1},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {
              "refId": "A",
              "expr": "max_over_time(DCGM_FI_DEV_GPU_TEMP{instance=~\"$instance\",gpu=~\"$gpu\"}[$__range])",
              "instant": true,
              "legendFormat": "peak"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "decimals": 0,
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "green", "value": null}, {"color": "#EAB839", "value": 75}, {"color": "orange", "value": 90}, {"color": "red", "value": 100}]
              }
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "colorMode": "background", "graphMode": "none"}
        },
        {
          "type": "stat",
          "title": "Power Draw",
          "id": 3,
          "gridPos": {"h": 4, "w": 3, "x": 6, "y": 1},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [{"refId": "A", "expr": "DCGM_FI_DEV_POWER_USAGE{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "draw"}],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 1,
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "colorMode": "background", "graphMode": "area"}
        },
        {
          "type": "stat",
          "title": "SM Clock",
          "id": 4,
          "gridPos": {"h": 4, "w": 3, "x": 9, "y": 1},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [{"refId": "A", "expr": "DCGM_FI_DEV_SM_CLOCK{instance=~\"$instance\",gpu=~\"$gpu\"} * 1000000", "legendFormat": "sm"}],
          "fieldConfig": {
            "defaults": {
              "unit": "hertz",
              "decimals": 2,
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "colorMode": "background", "graphMode": "area"}
        },
        {
          "type": "stat",
          "title": "GPU Utilization",
          "id": 5,
          "gridPos": {"h": 4, "w": 4, "x": 12, "y": 1},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [{"refId": "A", "expr": "DCGM_FI_DEV_GPU_UTIL{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "util"}],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 0,
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "colorMode": "background", "graphMode": "area"}
        },
        {
          "type": "stat",
          "title": "VRAM Used",
          "id": 6,
          "gridPos": {"h": 4, "w": 4, "x": 16, "y": 1},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {
              "refId": "A",
              "expr": "100 * DCGM_FI_DEV_FB_USED{instance=~\"$instance\",gpu=~\"$gpu\"} / clamp_min(DCGM_FI_DEV_FB_USED{instance=~\"$instance\",gpu=~\"$gpu\"} + DCGM_FI_DEV_FB_FREE{instance=~\"$instance\",gpu=~\"$gpu\"}, 1)",
              "legendFormat": "used"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "#EAB839", "value": 85}, {"color": "red", "value": 95}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "colorMode": "background", "graphMode": "area"}
        },
        {
          "type": "stat",
          "title": "Fan Speed",
          "id": 7,
          "gridPos": {"h": 4, "w": 4, "x": 20, "y": 1},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [{"refId": "A", "expr": "DCGM_FI_DEV_FAN_SPEED{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "fan"}],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 0,
              "noValue": "n/a",
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "colorMode": "background", "graphMode": "area"}
        },
        {
          "type": "row",
          "title": "Clocks, Utilization & Memory",
          "id": 101,
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 5},
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Clocks",
          "id": 10,
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 6},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {"refId": "A", "expr": "DCGM_FI_DEV_SM_CLOCK{instance=~\"$instance\",gpu=~\"$gpu\"} * 1000000", "legendFormat": "sm"},
            {"refId": "B", "expr": "DCGM_FI_DEV_MEM_CLOCK{instance=~\"$instance\",gpu=~\"$gpu\"} * 1000000", "legendFormat": "memory"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "hertz",
              "decimals": 2,
              "min": 0,
              "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true}
            },
            "overrides": [{"matcher": {"id": "byName", "options": "memory"}, "properties": [{"id": "custom.axisPlacement", "value": "right"}]}]
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "type": "timeseries",
          "title": "Utilization",
          "id": 11,
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 6},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {"refId": "A", "expr": "DCGM_FI_DEV_GPU_UTIL{instance=~\"$instance\",gpu=~\"$gpu\"} / 100", "legendFormat": "gpu util"},
            {"refId": "B", "expr": "DCGM_FI_PROF_GR_ENGINE_ACTIVE{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "graphics engine"},
            {"refId": "C", "expr": "DCGM_FI_PROF_SM_ACTIVE{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "sm active"},
            {"refId": "D", "expr": "DCGM_FI_PROF_SM_OCCUPANCY{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "sm occupancy"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "min": 0,
              "max": 1,
              "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 0, "showPoints": "never", "spanNulls": true}
            },
            "overrides": []
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "type": "timeseries",
          "title": "Workload Mix",
          "id": 14,
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 6},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {"refId": "A", "expr": "DCGM_FI_PROF_PIPE_TENSOR_ACTIVE{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "tensor"},
            {"refId": "B", "expr": "DCGM_FI_PROF_PIPE_FP32_ACTIVE{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "fp32"},
            {"refId": "C", "expr": "DCGM_FI_PROF_PIPE_FP16_ACTIVE{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "fp16"},
            {"refId": "D", "expr": "DCGM_FI_PROF_DRAM_ACTIVE{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "memory interface"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "min": 0,
              "max": 1,
              "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true}
            },
            "overrides": []
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "type": "timeseries",
          "title": "Encoder / Decoder",
          "id": 12,
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {"refId": "A", "expr": "DCGM_FI_DEV_ENC_UTIL{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "encoder"},
            {"refId": "B", "expr": "DCGM_FI_DEV_DEC_UTIL{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "decoder"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 0,
              "min": 0,
              "max": 100,
              "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true}
            },
            "overrides": []
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "type": "timeseries",
          "title": "VRAM",
          "id": 13,
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {"refId": "A", "expr": "DCGM_FI_DEV_FB_USED{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "used"},
            {"refId": "B", "expr": "DCGM_FI_DEV_FB_FREE{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "free"},
            {"refId": "C", "expr": "DCGM_FI_DEV_FB_RESERVED{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "reserved"},
            {"refId": "D", "expr": "DCGM_FI_DEV_FB_TOTAL{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "total"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "mbytes",
              "decimals": 0,
              "min": 0,
              "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true}
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "total"},
                "properties": [
                  {"id": "custom.fillOpacity", "value": 0},
                  {"id": "custom.lineStyle", "value": {"fill": "dash", "dash": [10, 10]}},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "text"}}
                ]
              }
            ]
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {"type": "row", "title": "Thermals & Power", "id": 102, "collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 22}, "panels": []},
        {
          "type": "timeseries",
          "title": "Temperature",
          "id": 20,
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 23},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {"refId": "A", "expr": "DCGM_FI_DEV_GPU_TEMP{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "core"},
            {"refId": "B", "expr": "DCGM_FI_DEV_MEMORY_TEMP{instance=~\"$instance\",gpu=~\"$gpu\"} > 0", "legendFormat": "memory"},
            {"refId": "C", "expr": "DCGM_FI_DEV_SLOWDOWN_TEMP{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "slowdown limit"},
            {"refId": "D", "expr": "DCGM_FI_DEV_SHUTDOWN_TEMP{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "shutdown limit"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "decimals": 0,
              "min": 0,
              "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true}
            },
            "overrides": [
              {
                "matcher": {"id": "byRegexp", "options": ".*limit.*"},
                "properties": [
                  {"id": "custom.fillOpacity", "value": 0},
                  {"id": "custom.lineStyle", "value": {"fill": "dash", "dash": [10, 10]}},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}
                ]
              }
            ]
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "type": "timeseries",
          "title": "Power",
          "id": 21,
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 23},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {"refId": "A", "expr": "DCGM_FI_DEV_POWER_USAGE{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "draw"},
            {"refId": "B", "expr": "DCGM_FI_DEV_ENFORCED_POWER_LIMIT{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "enforced limit"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 1,
              "min": 0,
              "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true}
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "enforced limit"},
                "properties": [
                  {"id": "custom.fillOpacity", "value": 0},
                  {"id": "custom.lineStyle", "value": {"fill": "dash", "dash": [10, 10]}},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}
                ]
              }
            ]
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "type": "timeseries",
          "title": "Fan Speed",
          "id": 22,
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 23},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [{"refId": "A", "expr": "DCGM_FI_DEV_FAN_SPEED{instance=~\"$instance\",gpu=~\"$gpu\"}", "legendFormat": "fan"}],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 0,
              "noValue": "not reported by this GPU",
              "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": true}
            },
            "overrides": []
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "type": "timeseries",
          "title": "Throttling",
          "id": 24,
          "gridPos": {"h": 7, "w": 24, "x": 0, "y": 31},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {
              "refId": "A",
              "expr": "rate(DCGM_FI_DEV_POWER_VIOLATION{instance=~\"$instance\",gpu=~\"$gpu\"}[$__rate_interval]) / 1e7",
              "legendFormat": "power"
            },
            {
              "refId": "B",
              "expr": "rate(DCGM_FI_DEV_THERMAL_VIOLATION{instance=~\"$instance\",gpu=~\"$gpu\"}[$__rate_interval]) / 1e7",
              "legendFormat": "thermal"
            },
            {
              "refId": "C",
              "expr": "rate(DCGM_FI_DEV_BOARD_LIMIT_VIOLATION{instance=~\"$instance\",gpu=~\"$gpu\"}[$__rate_interval]) / 1e7",
              "legendFormat": "board limit"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 20, "showPoints": "never", "spanNulls": true}
            },
            "overrides": [
              {"matcher": {"id": "byName", "options": "thermal"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]},
              {"matcher": {"id": "byName", "options": "board limit"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "purple"}}]}
            ]
          },
          "options": {
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["mean", "max", "lastNotNull"], "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          }
        },
        {"type": "row", "title": "Workload", "id": 103, "collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 37}, "panels": []},
        {
          "type": "table",
          "title": "GPU Consumers",
          "id": 30,
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 38},
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (instance, gpu, namespace, pod, container, dra_claim_name) (DCGM_FI_DEV_FB_USED{instance=~\"$instance\",gpu=~\"$gpu\"})",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "B",
              "expr": "sum by (instance, gpu, namespace, pod, container, dra_claim_name) (DCGM_FI_DEV_GPU_UTIL{instance=~\"$instance\",gpu=~\"$gpu\"})",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "C",
              "expr": "sum by (instance, gpu, namespace, pod, container, dra_claim_name) (DCGM_FI_DEV_POWER_USAGE{instance=~\"$instance\",gpu=~\"$gpu\"})",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {"id": "merge", "options": {}},
            {
              "id": "organize",
              "options": {
                "excludeByName": {"Time": true, "__name__": true, "instance": true, "dra_claim_name": true},
                "renameByName": {
                  "Value #A": "VRAM (MiB)",
                  "Value #B": "GPU Util (%)",
                  "Value #C": "Power (W)",
                  "gpu": "GPU",
                  "namespace": "Namespace",
                  "pod": "Pod",
                  "container": "Container"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {"custom": {"align": "auto", "filterable": true}},
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "VRAM (MiB)"},
                "properties": [{"id": "unit", "value": "mbytes"}, {"id": "custom.cellOptions", "value": {"type": "gauge", "mode": "gradient"}}]
              },
              {"matcher": {"id": "byName", "options": "Power (W)"}, "properties": [{"id": "unit", "value": "watt"}]}
            ]
          },
          "options": {"showHeader": true, "footer": {"show": false, "reducer": ["sum"], "fields": ""}}
        },
        {
          "type": "timeseries",
