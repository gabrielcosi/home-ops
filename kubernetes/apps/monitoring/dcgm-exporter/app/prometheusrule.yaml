---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dcgm-exporter
spec:
  groups:
    - name: dcgm-exporter.rules
      rules:
        - alert: NvidiaGpuWedgedAtHighClock
          expr: |
            DCGM_FI_DEV_SM_CLOCK_HERTZ > 1e9 and DCGM_FI_DEV_FB_USED_BYTES < 500 * 2^20
          for: 15m
          annotations:
            summary: >-
              GPU {{ $labels.gpu }} on {{ $labels.hostname }} is clocked at {{ $value | humanize }}Hz with an empty framebuffer
          labels:
            severity: warning

        - alert: NvidiaGpuXidError
          expr: |
            DCGM_EXP_XID_ERRORS_COUNT > 0
          for: 0m
          annotations:
            summary: >-
              GPU {{ $labels.gpu }} on {{ $labels.hostname }} reported an XID error
          labels:
            severity: critical

        - alert: NvidiaGpuHealthDegraded
          expr: |
            DCGM_EXP_GPU_HEALTH_STATUS{health_error_severity!="MONITOR"} > 0
          for: 10m
          annotations:
            summary: >-
              GPU {{ $labels.gpu }} on {{ $labels.hostname }} reports DCGM health status {{ $value }}
          labels:
            severity: warning

        - alert: NvidiaGpuRowRemapFailure
          expr: |
            DCGM_FI_DEV_ROW_REMAP_FAILED > 0
          for: 0m
          annotations:
            summary: >-
              GPU {{ $labels.gpu }} on {{ $labels.hostname }} failed to remap a bad memory row
          labels:
            severity: critical

        - alert: NvidiaGpuUncorrectableRemappedRows
          expr: |
            increase(DCGM_FI_DEV_ROW_REMAP_UNCORRECTABLE_TOTAL[1h]) > 0
          for: 0m
          annotations:
            summary: >-
              GPU {{ $labels.gpu }} on {{ $labels.hostname }} remapped a row after an uncorrectable memory error
          labels:
            severity: critical

        - alert: NvidiaGpuThermalThrottling
          expr: |
            increase(DCGM_FI_DEV_GPU_THERMAL_THROTTLE_SECONDS_TOTAL[15m]) > 0
          for: 5m
          annotations:
            summary: >-
              GPU {{ $labels.gpu }} on {{ $labels.hostname }} is throttling on temperature
          labels:
            severity: warning

        - alert: NvidiaGpuNearSlowdownTemp
          expr: |
            DCGM_FI_DEV_GPU_TEMP_CELSIUS > (DCGM_FI_DEV_GPU_TEMP_SLOWDOWN_CELSIUS - 8)
          for: 5m
          annotations:
            summary: >-
              GPU {{ $labels.gpu }} on {{ $labels.hostname }} is at {{ $value }}C, near its slowdown threshold
          labels:
            severity: warning

        - alert: NvidiaGpuPcieReplayErrors
          expr: |
            increase(DCGM_FI_DEV_PCIE_REPLAY_TOTAL[15m]) > 10
          for: 5m
          annotations:
            summary: >-
              GPU {{ $labels.gpu }} on {{ $labels.hostname }} logged {{ $value }} PCIe replays
          labels:
            severity: warning
