---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dcgm-exporter
spec:
  dependsOn:
    - name: nvidia-dra-driver
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/monitoring/dcgm-exporter/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: monitoring
  wait: false
