---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: karma
spec:
  interval: 1h
  path: ./kubernetes/apps/monitoring/karma/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: karma
    namespace: flux-system
  targetNamespace: monitoring
  wait: false
