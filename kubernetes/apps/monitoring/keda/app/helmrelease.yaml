---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
spec:
  chartRef:
    kind: OCIRepository
    name: keda
  interval: 1h
  values:
    enableServiceLinks: false
    operator:
      replicaCount: 2
    metricsServer:
      replicaCount: 2
    topologySpreadConstraints:
      operator:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: keda-operator
      metricsServer:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: keda-operator-metrics-apiserver
    prometheus:
      metricServer:
        enabled: true
        serviceMonitor:
          enabled: true
      operator:
        enabled: true
        serviceMonitor:
          enabled: true
      webhooks:
        enabled: true
        serviceMonitor:
          enabled: true
    resources:
      operator:
        limits:
          cpu: null
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 128Mi

      metricServer:
        limits:
          cpu: null
          memory: 100Mi
        requests:
          cpu: 10m
          memory: 100Mi

      webhooks:
        limits:
          cpu: null
          memory: 100Mi
        requests:
          cpu: 10m
          memory: 100Mi
