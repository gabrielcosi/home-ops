---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda-add-ons-http
spec:
  chartRef:
    kind: OCIRepository
    name: keda-add-ons-http
  interval: 1h
  values:
    interceptor:
      pdb:
        enabled: false
      readinessTimeout: 5m
      replicas:
        max: 1
        min: 1
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
        limits:
          cpu: null
          memory: 128Mi
    operator:
      replicas: 1
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
        limits:
          cpu: null
          memory: 128Mi
    scaler:
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: null
          memory: 64Mi
