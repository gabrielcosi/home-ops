---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: memini
spec:
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  components:
    - ../../../../components/kopiur/restore
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./kubernetes/apps/ai/memini/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
  postBuild:
    substitute:
      APP: memini
      KOPIUR_PUID: "65532"
      KOPIUR_PGID: "65532"
      KOPIUR_CAPACITY: "1Gi"
