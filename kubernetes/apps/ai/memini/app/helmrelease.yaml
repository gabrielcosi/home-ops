---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memini
spec:
  chartRef:
    kind: OCIRepository
    name: memini
  interval: 1h
  values:
    global:
      fullnameOverride: memini
    controllers:
      main:
        type: statefulset
        replicas: 1
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          main:
            env:
              MEMINI_BACKEND: sqlite
              MEMINI_SQLITE_PATH: /data/memini.db
              MEMINI_LOG_FORMAT: json
              MEMINI_EMBED_BASE_URL: http://bifrost.ai.svc.cluster.local:8080/v1
              MEMINI_EMBED_MODEL: sentence-transformers/all-MiniLM-L6-v2
              MEMINI_EMBED_DIMS: '384'
              MEMINI_EMBED_QUERY_PREFIX: "Instruct: Given a user message, retrieve relevant past memories\nQuery: "
              MEMINI_RECALL_EMBED_TIMEOUT: '10s'
              MEMINI_EMBED_MAX_CONCURRENCY: '2'
              MEMINI_LLM_BASE_URL: http://bifrost.ai.svc.cluster.local:8080/v1
              MEMINI_LLM_API: openai
              MEMINI_LLM_MODEL: opencode/mimo-v2.5-pro
              MEMINI_LLM_MAX_TOKENS: '16384'
              MEMINI_DEMOTE_AFTER: 1440h
              MEMINI_TOMBSTONE_TTL: 720h
              TZ: Europe/Berlin
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secrets
                    key: MEMINI_API_KEY
              MEMINI_EMBED_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secrets
                    key: BIFROST_VK_MEMINI
              MEMINI_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secrets
                    key: BIFROST_VK_MEMINI
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi

    persistence:
      data:
        enabled: true
        existingClaim: memini
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    serviceMonitor:
      main:
        enabled: true

    route:
      main:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - memory.xcd.dev
      ui:
        enabled: true
        parentRefs:
          - name: envoy-internal-auth
            namespace: network
        hostnames:
          - memini.xcd.dev
