---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: toolhive
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: |
    {
      "uid": "toolhive-overview",
      "title": "ToolHive MCP Gateway",
      "tags": [
        "toolhive",
        "mcp",
        "ai"
      ],
      "schemaVersion": 39,
      "version": 11,
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {},
      "refresh": "",
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Connected now",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum(toolhive_mcp_active_connections{server=\"mcp-gateway\"})",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "none",
            "colorMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Connections",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "initialize on the gateway only; backend proxies excluded.",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum(increase(toolhive_mcp_requests_total{server=\"mcp-gateway\",mcp_method=\"initialize\"}[$__range]))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "none",
            "colorMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Tool calls",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum(increase(toolhive_mcp_tool_calls_total{server=\"mcp-gateway\",tool=\"call_tool\"}[$__range]))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "none",
            "colorMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Failed calls",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 10,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum(increase(toolhive_mcp_tool_calls_total{server=\"mcp-gateway\",status=\"error\"}[$__range]))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "none",
            "colorMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Tool not found",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "call_tool for a name not in the catalogue.",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 14,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum(increase(toolhive_vmcp_optimizer_call_tool_not_found_total[$__range]))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "none",
            "colorMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Mean connect time",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "sum/count. Percentiles are bucket artefacts here.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 17,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum(increase(toolhive_mcp_request_duration_seconds_sum{server=\"mcp-gateway\",mcp_method=\"initialize\"}[$__range])) / clamp_min(sum(increase(toolhive_mcp_request_duration_seconds_count{server=\"mcp-gateway\",mcp_method=\"initialize\"}[$__range])), 1)",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 3
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "none",
            "colorMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Slow connects (>5s)",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "Usually the embedding cache rebuilding after a restart.",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum(increase(toolhive_mcp_request_duration_seconds_count{server=\"mcp-gateway\",mcp_method=\"initialize\"}[$__range])) - sum(increase(toolhive_mcp_request_duration_seconds_bucket{server=\"mcp-gateway\",mcp_method=\"initialize\",le=\"5\"}[$__range]))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "none",
            "colorMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Activity",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 9,
            "w": 16,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum(increase(toolhive_mcp_requests_total{server=\"mcp-gateway\",mcp_method=\"initialize\"}[$__interval]))",
              "legendFormat": "connections"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum by (tool) (increase(toolhive_mcp_tool_calls_total{server=\"mcp-gateway\"}[$__interval]))",
              "legendFormat": "{{tool}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 80,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "sum"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "interval": "1h"
        },
        {
          "id": 9,
          "type": "bargauge",
          "title": "Clients",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 16,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum by (mcp_resource_id) (increase(toolhive_mcp_requests_total{server=\"mcp-gateway\",mcp_method=\"initialize\"}[$__range]))",
              "legendFormat": "{{mcp_resource_id}}",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "color": {
                "mode": "continuous-BlPu"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "valueMode": "text",
            "showUnfilled": true,
            "sortBy": "Value",
            "sortOrder": "Descending",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 10,
          "type": "table",
          "title": "Backends \u2014 activity, not health",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "No health metric exists. A dead backend reads 0, same as an idle one. Health lives on the VirtualMCPServer object.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum by (target_workload_name) (increase(toolhive_vmcp_backend_requests_total[$__range]))",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum by (target_workload_name) (increase(toolhive_vmcp_backend_errors_total[$__range]))",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum by (target_workload_name) (increase(toolhive_vmcp_backend_requests_duration_seconds_sum[$__range])) / clamp_min(sum by (target_workload_name) (increase(toolhive_vmcp_backend_requests_duration_seconds_count[$__range])), 1)",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "target_workload_name",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true
                },
                "renameByName": {
                  "target_workload_name": "Backend",
                  "Value #A": "Requests",
                  "Value #B": "Errors",
                  "Value #C": "Mean"
                },
                "indexByName": {}
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Errors"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "text",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Mean"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  },
                  {
                    "id": "noValue",
                    "value": "\u2014"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Requests"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "auto"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "footer": {
              "show": false
            },
            "sortBy": [
              {
                "displayName": "Requests",
                "desc": true
              }
            ]
          }
        },
        {
          "id": 11,
          "type": "bargauge",
          "title": "Top tools",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 12,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "topk(10, sum by (target_workload_name, tool_name) (increase(toolhive_vmcp_backend_requests_total[$__range]))) > 0",
              "legendFormat": "{{target_workload_name}}/{{tool_name}}",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "color": {
                "mode": "continuous-BlPu"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "valueMode": "text",
            "showUnfilled": true,
            "sortBy": "Value",
            "sortOrder": "Descending",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 12,
          "type": "stat",
          "title": "Mean search time",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum(increase(toolhive_vmcp_optimizer_find_tool_duration_seconds_sum[$__range])) / clamp_min(sum(increase(toolhive_vmcp_optimizer_find_tool_duration_seconds_count[$__range])), 1)",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "none",
            "colorMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 13,
          "type": "stat",
          "title": "Empty searches",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 17
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum(increase(toolhive_vmcp_optimizer_find_tool_results_bucket{le=\"0\"}[$__range]))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "none",
            "colorMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 14,
          "type": "table",
          "title": "Gateway errors",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "unknown + 404/405/409 = bare GET/HEAD from clients, benign.",
          "gridPos": {
            "h": 6,
            "w": 10,
            "x": 0,
            "y": 21
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum by (mcp_method, status_code) (increase(toolhive_mcp_requests_total{server=\"mcp-gateway\",status=\"error\"}[$__range])) > 0",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
