---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-gateway
spec:
  authServerConfig:
    issuer: https://mcp.xcd.dev
    signingKeySecretRefs:
      - name: toolhive-vmcp-secrets
        key: AUTH_SIGNING_KEY
    hmacSecretRefs:
      - name: toolhive-vmcp-secrets
        key: AUTH_HMAC_KEY
    baselineClientScopes:
      - openid
      - offline_access
    tokenLifespans:
      accessTokenLifespan: 1h
      refreshTokenLifespan: 720h
    upstreamProviders:
      - name: authentik
        type: oidc
        oidcConfig:
          issuerUrl: https://auth.xcd.dev/application/o/toolhive/
          clientId: toolhive
          clientSecretRef:
            name: toolhive-vmcp-secrets
            key: OIDC_CLIENT_SECRET
          redirectUri: https://mcp.xcd.dev/oauth/callback
          allowPrivateIPs: true
          scopes:
            - openid
            - profile
            - email
            - offline_access
  incomingAuth:
    type: oidc
    oidcConfigRef:
      name: mcp-gateway
      audience: https://mcp.xcd.dev/
      resourceUrl: https://mcp.xcd.dev/
      scopes:
        - openid
        - profile
        - email
        - offline_access
  outgoingAuth:
    source: discovered
  serviceType: ClusterIP
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: toolhive-vmcp-secrets
                  key: OPENAI_API_KEY
  sessionStorage:
    provider: redis
    address: dragonfly.database.svc.cluster.local:6379
    db: 7
    keyPrefix: 'thv:vmcp:mcp-gateway:'
  groupRef:
    name: mcp-tools
  telemetryConfigRef:
    name: prometheus
    serviceName: mcp-gateway
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: '{workload}_'
    optimizer:
      embeddingProvider: openai
      embeddingService: http://bifrost.ai.svc.cluster.local:8080/v1
      embeddingModel: llmkube/embeddinggemma-2
      embeddingServiceTimeout: 60s
    operational:
      failureHandling:
        healthCheckInterval: 5m
        statusReportingInterval: 5m
