---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-vmcp-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    template:
      data:
        OPENAI_API_KEY: '{{ .bifrost_vk_toolhive }}'
        OIDC_CLIENT_SECRET: '{{ .toolhive_oidc_client_secret }}'
        AUTH_SIGNING_KEY: '{{ .toolhive_signing_key }}'
        AUTH_HMAC_KEY: '{{ .toolhive_hmac_key }}'
  dataFrom:
    - extract:
        key: bifrost
    - extract:
        key: toolhive
