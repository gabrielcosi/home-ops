---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  chartRef:
    kind: OCIRepository
    name: llmkube
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: PodMonitor
              name: llmkube-inference
            patch: |
              - op: add
                path: /spec/podMetricsEndpoints/0/metricRelabelings
                value:
                  - action: drop
                    sourceLabels: [__name__]
                    regex: vllm:cache_config_info
  values:
    metrics:
      secure: false
    prometheus:
      serviceMonitor:
        enabled: true
        additionalLabels: {}
      inferencePodMonitor:
        enabled: true
        additionalLabels: {}
      routerPodMonitor:
        enabled: true
        additionalLabels: {}
      prometheusRule:
        enabled: true
        additionalLabels: {}
        namespace: ai
        rules:
          gpu:
            enabled: false
          gpuHealth:
            enabled: false
    grafana:
      dashboards:
        enabled: true
        additionalLabels: {}
        only:
          - llamacpp-dashboard
          - llmkube-inference
          - model-router-dashboard
          - vllm-dashboard
        operator:
          enabled: true
          datasources:
            - inputName: DS_PROMETHEUS
              datasourceName: victoriametrics
          instanceSelector:
            matchLabels:
              dashboards: grafana
    modelCache:
      mode: perService
      prep: never
      size: 32Gi
      storageClass: miroir-client
    modelSource:
      allowedRemoteHosts:
        - s3.xcd.dev
