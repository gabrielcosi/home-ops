---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llmkube-models
  namespace: ai
spec:
  groups:
    - name: llmkube-models.rules
      rules:
        - alert: InferenceDecodeSlow
          expr: |-
            increase_pure(llamacpp:tokens_predicted_total[15m])
              / clamp_min(increase_pure(llamacpp:tokens_predicted_seconds_total[15m]), 1) < 12
              and increase_pure(llamacpp:tokens_predicted_total[15m]) > 1000
          for: 15m
          annotations:
            summary: >-
              Model {{ $labels.model }} generates {{ $value | printf "%.1f" }} tokens per second
          labels:
            severity: warning

        - alert: InferencePrefillSlow
          expr: |-
            (
              increase_pure(llamacpp:prompt_tokens_total[15m])
                / clamp_min(increase_pure(llamacpp:prompt_seconds_total[15m]), 1) < 150
                and increase_pure(llamacpp:prompt_tokens_total[15m]) > 20000
            )
            or
            (
              sum by (model) (increase_pure(vllm:prompt_tokens_total[15m]))
                / clamp_min(sum by (model) (increase_pure(vllm:request_prefill_time_seconds_sum[15m])), 1) < 150
                and sum by (model) (increase_pure(vllm:prompt_tokens_total[15m])) > 20000
            )
          for: 15m
          annotations:
            summary: >-
              Model {{ $labels.model }} reads prompts at {{ $value | printf "%.0f" }} tokens per second
          labels:
            severity: warning
