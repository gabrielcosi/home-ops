---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: models-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    template:
      metadata:
        labels:
          inference.llmkube.dev/model-source-credentials: "true"
      data:
        AWS_ACCESS_KEY_ID: "{{ .llmkube_nas_models_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .llmkube_nas_models_access_secret_key }}"
        AWS_ENDPOINT_URL: https://s3.xcd.dev
        AWS_REGION: us-east-1
  dataFrom:
    - extract:
        key: llmkube
