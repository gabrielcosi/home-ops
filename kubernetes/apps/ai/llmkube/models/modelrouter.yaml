---
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelRouter
metadata:
  name: models
spec:
  backends:
    - name: d3-flash
      inferenceServiceRef:
        name: d3-flash
    - name: embeddinggemma-2
      inferenceServiceRef:
        name: embeddinggemma-2
    - name: embeddinggemma-2-wrk
      inferenceServiceRef:
        name: embeddinggemma-2-wrk
    - name: embeddinggemma-2-ctrl
      inferenceServiceRef:
        name: embeddinggemma-2-ctrl
      resolution: endpoint
      balancing:
        mode: LoadAware
    - name: qwen3-8-27b
      displayName: qwen3.8-27b
      inferenceServiceRef:
        name: qwen3-8-27b
  defaultRouteStrategy: BackendNameMatch
  rules:
    - name: embeddinggemma-2
      match:
        models:
          - embeddinggemma-2
      timeout: 120s
      route:
        strategy: primary-fallback
        backends:
          - embeddinggemma-2
          - embeddinggemma-2-wrk
          - embeddinggemma-2-ctrl
  proxy:
    replicas: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            inference.llmkube.dev/model-router: models
    responseHeaderTimeout: 600s
