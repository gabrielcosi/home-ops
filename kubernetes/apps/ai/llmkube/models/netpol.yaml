---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llmkube-inference
  namespace: ai
spec:
  description: Restrict LLMKube inference pods to bifrost and vmagent ingress, and egress to the NAS.
  endpointSelector:
    matchExpressions:
      - key: inference.llmkube.dev/service
        operator: Exists
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app.kubernetes.io/instance: bifrost
            k8s:app.kubernetes.io/name: bifrost
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toCIDR:
        - 192.168.42.20/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
