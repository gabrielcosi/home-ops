---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
spec:
  dependsOn:
    - name: miroir
      namespace: miroir-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  components:
    - ../../../../components/kopiur/restore
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./kubernetes/apps/ai/hermes/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
  postBuild:
    substitute:
      APP: hermes
      KOPIUR_PUID: "10000"
      KOPIUR_PGID: "10000"
      KOPIUR_CAPACITY: "2Gi"
