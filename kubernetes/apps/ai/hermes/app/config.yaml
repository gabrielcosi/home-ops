custom_providers:
  - name: bifrost
    base_url: http://bifrost.ai.svc.cluster.local:8080/v1
    key_env: OPENAI_API_KEY

model:
  default: opencode-anthropic/minimax-m3
  provider: custom:bifrost

model_aliases:
  mimo-v2.5-pro:
    model: opencode/mimo-v2.5-pro
    provider: custom:bifrost
  minimax:
    model: opencode-anthropic/minimax-m3
    provider: custom:bifrost

fallback_providers:
  - provider: custom:bifrost
    model: opencode-anthropic/minimax-m3

memory:
  provider: memini

plugins:
  enabled:
    - memini

terminal:
  backend: local
  timeout: 900
  lifetime_seconds: 1800
  persistent_shell: true

compression:
  enabled: true
  protect_first_n: 0
  threshold: 0.8

auxiliary:
  approval:
    provider: custom:bifrost
    model: opencode-anthropic/minimax-m3
    timeout: 60
  compression:
    provider: custom:bifrost
    model: opencode-anthropic/minimax-m3
  vision:
    provider: custom:bifrost
    model: opencode-anthropic/minimax-m3
  goal_judge:
    provider: custom:bifrost
    model: opencode/mimo-v2.5-pro
  title_generation:
    provider: custom:bifrost
    model: opencode/mimo-v2.5-pro
  curator:
    provider: custom:bifrost
    model: opencode/mimo-v2.5-pro
    timeout: 600
  review:
    provider: custom:bifrost
    model: opencode-anthropic/minimax-m3
  background_review:
    provider: custom:bifrost
    model: opencode/mimo-v2.5-pro
  monitor:
    provider: custom:bifrost
    model: opencode/mimo-v2.5-pro
  mcp:
    provider: custom:bifrost
    model: opencode/mimo-v2.5-pro
  skills_hub:
    provider: custom:bifrost
    model: opencode/mimo-v2.5-pro
  memory_query_rewrite:
    provider: custom:bifrost
    model: opencode/mimo-v2.5-pro

curator:
  consolidate: true

streaming:
  enabled: false

gateway:
  streaming:
    enabled: false

session_reset:
  mode: both
  at_hour: 4
  idle_minutes: 1440
  notify: true

approvals:
  mode: smart
  timeout: 60
  cron_mode: deny

security:
  redact_secrets: true
  website_blocklist:
    enabled: true
    domains:
      - '169.254.169.254'
      - 'metadata.google.internal'

privacy:
  redact_pii: true

agent:
  max_turns: 150
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  reasoning_effort: medium
  disabled_toolsets:
    - browser

delegation:
  provider: custom:bifrost
  model: opencode/mimo-v2.5-pro
  max_concurrent_children: 8
  max_spawn_depth: 2

platforms:
  telegram:
    enabled: true

mcp_servers:
  mcps:
    url: https://mcp.xcd.dev/mcp

web:
  search_backend: searxng
  extract_backend: crawl4ai

unauthorized_dm_behavior: pair
