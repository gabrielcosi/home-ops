custom_providers:
  - name: bifrost
    base_url: http://bifrost.ai.svc.cluster.local:8080/v1
    key_env: OPENAI_API_KEY
    extra_headers:
      x-bf-eh-x-opencode-session: 'hermes'

model:
  default: opencode/deepseek-v4.1-flash
  provider: custom:bifrost

model_aliases:
  deepseek:
    model: opencode/deepseek-v4.1-flash
    provider: custom:bifrost

fallback_providers:
  - provider: custom:bifrost
    model: llama-swap/qwen3.8-27b

memory:
  provider: memini

plugins:
  enabled:
    - memini

terminal:
  backend: local
  timeout: 900
  lifetime_seconds: 1800
  persistent_shell: true

compression:
  enabled: true
  protect_first_n: 0
  threshold: 0.8
  idle_compact_after_seconds: 86400

auxiliary:
  approval:
    provider: custom:bifrost
    model: opencode/deepseek-v4.1-flash
    timeout: 60
  compression:
    provider: custom:bifrost
    model: opencode/deepseek-v4.1-flash
  vision:
    provider: custom:bifrost
    model: opencode/deepseek-v4.1-flash
  goal_judge:
    provider: custom:bifrost
    model: opencode/deepseek-v4.1-flash
  title_generation:
    provider: custom:bifrost
    model: opencode/deepseek-v4.1-flash
  curator:
    provider: custom:bifrost
    model: opencode/deepseek-v4.1-flash
    timeout: 600
  review:
    provider: custom:bifrost
    model: opencode/deepseek-v4.1-flash
  background_review:
    provider: custom:bifrost
    model: opencode/deepseek-v4.1-flash
  monitor:
    provider: custom:bifrost
    model: opencode/deepseek-v4.1-flash
  mcp:
    provider: custom:bifrost
    model: opencode/deepseek-v4.1-flash
  skills_hub:
    provider: custom:bifrost
    model: opencode/deepseek-v4.1-flash
  memory_query_rewrite:
    provider: custom:bifrost
    model: opencode/deepseek-v4.1-flash

curator:
  consolidate: true

streaming:
  enabled: false

gateway:
  streaming:
    enabled: false

approvals:
  mode: smart
  timeout: 60
  cron_mode: deny

security:
  redact_secrets: true
  website_blocklist:
    enabled: true
    domains:
      - '169.254.169.254'
      - 'metadata.google.internal'

privacy:
  redact_pii: true

agent:
  max_turns: 150
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  reasoning_effort: medium
  disabled_toolsets:
    - browser

delegation:
  provider: custom:bifrost
  model: opencode/deepseek-v4.1-flash
  max_concurrent_children: 8
  max_spawn_depth: 2

platforms:
  telegram:
    enabled: true

mcp_servers:
  mcps:
    url: https://mcp.xcd.dev/mcp

web:
  search_backend: searxng
  extract_backend: crawl4ai

unauthorized_dm_behavior: pair
