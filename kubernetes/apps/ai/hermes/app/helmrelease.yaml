---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  values:
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          gateway:
            image:
              repository: ghcr.io/gabrielcosi/containers/hermes-agent
              tag: v0.23.1@sha256:1a4a056a2e2a32f96c72596c4b448c4f3fce13e6fe3874dd43a25663035d0920
            args:
              - gateway
              - run
            env:
              TZ: Europe/Berlin
              HOME: /opt/data/home
              HERMES_HOME: /opt/data
              PATH: /opt/data/home/.local/share/mise/shims:/opt/mise:/opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              API_SERVER_ENABLED: true
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_PORT: '8642'
              HERMES_STREAM_READ_TIMEOUT: '300'
              HERMES_STREAM_STALE_TIMEOUT: '300'
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: '1'
              S6_READ_ONLY_ROOT: '1'
              SEARXNG_URL: http://searxng.tools.svc.cluster.local:8080
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
              MEMINI_NAMESPACE: hermes
              OPENAI_BASE_URL: http://bifrost.ai.svc.cluster.local:8080/v1
              CRAWL4AI_API_URL: http://crawl4ai.ai.svc.cluster.local:11235
              _HERMES_FORCE_GITHUB_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secrets
                    key: GITHUB_TOKEN
            envFrom:
              - secretRef:
                  name: hermes-secrets
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    persistence:
      data:
        existingClaim: hermes
        globalMounts:
          - path: /opt/data
      config:
        type: configMap
        name: hermes-config
        globalMounts:
          - path: /etc/hermes/config.yaml
            subPath: config.yaml
            readOnly: true
      mise:
        type: image
        image: ghcr.io/jdx/mise:2026.11.8@sha256:5c6e71a86c8c997c32d30a169b4269bec9d4681a804e29078bac8f44109f2edc
        globalMounts:
          - path: /opt/mise
            subPath: usr/local/bin
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
          - path: /var/tmp
          - path: /run
