---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llama-swap
  namespace: ai
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: llama-swap
      app.kubernetes.io/name: llama-swap
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
