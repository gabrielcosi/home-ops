---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llama-swap-policy
  labels:
    app.kubernetes.io/instance: llama-swap
    app.kubernetes.io/name: llama-swap
spec:
  description: Restrict llama-swap to Bifrost ingress and internal upstream egress only.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: llama-swap
      app.kubernetes.io/name: llama-swap
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app.kubernetes.io/instance: bifrost
            k8s:app.kubernetes.io/name: bifrost
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toCIDR:
        - 192.168.42.50/32
      toPorts:
        - ports:
            - port: "9292"
              protocol: TCP
