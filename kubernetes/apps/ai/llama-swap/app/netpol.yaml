---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llama-swap-policy
  labels:
    app.kubernetes.io/instance: llama-swap
    app.kubernetes.io/name: llama-swap
spec:
  description: Restrict llama-swap to Bifrost, Envoy Gateway and vmagent ingress, with no egress beyond cluster-wide DNS.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: llama-swap
      app.kubernetes.io/name: llama-swap
  enableDefaultDeny:
    egress: true
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app.kubernetes.io/instance: bifrost
            k8s:app.kubernetes.io/name: bifrost
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            k8s:app.kubernetes.io/managed-by: envoy-gateway
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
