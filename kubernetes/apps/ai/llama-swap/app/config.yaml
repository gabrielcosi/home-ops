healthCheckTimeout: 300
globalTTL: 300

models:
  qwen3.8-27b:
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 131072
    cmd: |
      /app/llama-server \
      --host 0.0.0.0 \
      --port ${PORT} \
      --metrics \
      --model /models/Qwen3.8-27B/Qwen3.8-27B-NVFP4-Q8_0.gguf \
      --mmproj /models/Qwen3.8-27B/Qwen3.8-27B-mmproj-F16.gguf \
      --ctx-size 131072 \
      --parallel 1 \
      --jinja \
      --chat-template-kwargs '{"reasoning_effort":"medium"}' \
      --cache-type-k q8_0 \
      --cache-type-v q8_0 \
      --temp 1.0 \
      --top-p 0.95 \
      --top-k 20 \
      --min-p 0 \
      --presence-penalty 0.0 \
      --repeat-penalty 1.0 \
      --flash-attn on \
      --n-gpu-layers 99 \
      --fit off \
      --reasoning-preserve \
      --spec-type draft-mtp \
      --spec-draft-n-max 2 \
      --spec-draft-p-min 0.0
    useModelName: qwen3.8-27b
    concurrencyLimit: 2

  muse-glimmer-30b:
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 131072
    cmd: |
      /app/llama-server \
      --host 0.0.0.0 \
      --port ${PORT} \
      --metrics \
      --model /models/Muse-Glimmer-30B/Muse-Glimmer-30B-UD-Q4_K_XL.gguf \
      --mmproj /models/Muse-Glimmer-30B/Muse-Glimmer-30B-mmproj-kquant.gguf \
      --ctx-size 262144 \
      --parallel 2 \
      --jinja \
      --chat-template-kwargs '{"reasoning_strength":"high"}' \
      --temp 1.0 \
      --top-p 0.95 \
      --top-k 64 \
      --min-p 0 \
      --presence-penalty 0.0 \
      --repeat-penalty 1.0 \
      --flash-attn on \
      --n-gpu-layers 99 \
      --fit off \
      --reasoning-preserve \
      --spec-type draft-dflash \
      --spec-draft-model /models/Muse-Glimmer-30B/Muse-Glimmer-30B-dflash2-Q4_K_M.gguf \
      --spec-draft-n-max 5
    useModelName: muse-glimmer-30b
    concurrencyLimit: 4

matrix:
  vars:
    q3827b: qwen3.8-27b
    muse30b: muse-glimmer-30b

  sets:
    default: 'q3827b | muse30b'

apiKeys:
  - ${env.LS_API_KEY}
