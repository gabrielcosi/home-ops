healthCheckTimeout: 300
unloadTimeout: 90
logToStdout: proxy,upstream
globalTTL: 0

macros:
  kubeswap: /opt/llama/kubeswap
  sglang-image: ghcr.io/gabrielcosi/containers/sglang:nightly-dev-cu13-20261010-961bcf48@sha256:8bb15e9f84df118818c59300e35cdb5f34c4c74aefcf503a798139d12f9ad496 # renovate: docker=ghcr.io/gabrielcosi/containers/sglang versioning=regex:^nightly-dev-cu13-(?<patch>\d{8})-[0-9a-f]+$
  llama-server: >-
    /usr/local/bin/llama-server
    --host 0.0.0.0
    --port ${PORT}
    --metrics
    --jinja
    --flash-attn on
    --n-gpu-layers 99
    --fit off
    --reasoning-preserve
  llama-server-custom: >-
    /opt/llama/llama-server
    --host 0.0.0.0
    --port ${PORT}
    --metrics
    --jinja
    --flash-attn on
    --n-gpu-layers 99
    --fit off
    --reasoning-preserve

models:
  qwen3.8-27b:
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 172032
    env:
      - CUDA_VISIBLE_DEVICES=GPU-d06ce8cc-4d13-f746-b123-75e2dccdb389
      - GGML_CUDA_MMVQ_MAX_NVFP4=1
    cmd: |
      ${llama-server-custom} \
      --model /models/Swift-1.5-Qwen3.8-27B/Swift-1.5-Qwen3.8-27B-NVFP4.gguf \
      --mmproj /models/Swift-1.5-Qwen3.8-27B/Swift-1.5-Qwen3.8-27B-mmproj-F16.gguf \
      --no-mmproj-offload \
      --ctx-size 172032 \
      --parallel 2 \
      --kv-unified \
      --chat-template-kwargs '{"reasoning_effort":"medium"}' \
      --cache-type-k q8_0 \
      --cache-type-v q8_0 \
      --temp 1.0 \
      --top-p 0.95 \
      --top-k 20 \
      --min-p 0 \
      --presence-penalty 0.0 \
      --repeat-penalty 1.0 \
      --spec-type draft-mtp \
      --spec-draft-sampling probabilistic \
      --spec-draft-n-max 5 \
      --spec-draft-p-min 0.0 \
      --cache-dir /models/.prompt-cache/swift-1.5-qwen3.8-27b \
      --cache-disk 65536
    useModelName: qwen3.8-27b
    concurrencyLimit: 2

  muse-glimmer-30b:
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 131072
    env:
      - CUDA_VISIBLE_DEVICES=GPU-d06ce8cc-4d13-f746-b123-75e2dccdb389
      - GGML_CUDA_MMVQ_MAX_NVFP4=1
    cmd: |
      ${llama-server-custom} \
      --model /models/Muse-Glimmer-30B/Muse-Glimmer-30B-NVFP4-Q8_0.gguf \
      --mmproj /models/Muse-Glimmer-30B/Muse-Glimmer-30B-mmproj-kquant.gguf \
      --ctx-size 262144 \
      --parallel 2 \
      --no-cache-idle-slots \
      --chat-template-kwargs '{"reasoning_strength":"high"}' \
      --temp 1.0 \
      --top-p 0.95 \
      --top-k 64 \
      --min-p 0 \
      --presence-penalty 0.0 \
      --repeat-penalty 1.0 \
      --spec-type draft-dflash \
      --spec-draft-model /models/Muse-Glimmer-30B/Muse-Glimmer-30B-dflash2-Q4_K_M.gguf \
      --spec-draft-n-max 8 \
      --cache-dir /models/.prompt-cache/muse-glimmer-30b \
      --cache-disk 8192
    useModelName: muse-glimmer-30b
    concurrencyLimit: 4

  clef-flash:
    capabilities:
      in: [text, image]
      context: 16384
    concurrencyLimit: 64
    proxy: http://127.0.0.1:${PORT}
    cmd: |
      ${kubeswap} serve \
      --listen 127.0.0.1:${PORT} \
      --model clef-flash \
      --namespace ai \
      --image ${sglang-image} \
      --command python3 --command -m --command sglang.launch_server \
      --resource-claim pro2000=pro2000 \
      --request cpu=2 \
      --request memory=10Gi \
      --limit memory=16Gi \
      --env SGLANG_CLEF_HOST_TABLES=1 \
      --env HF_HUB_OFFLINE=1 \
      --env HF_HUB_DISABLE_TELEMETRY=1 \
      --env DO_NOT_TRACK=1 \
      --volume nfs:tank.internal/mnt/home-pool/models:/library:ro \
      --startup-timeout 5m \
      -- \
      --model-path /library/Clef-Flash/Clef-Flash-NVFP4-SGL \
      --served-model-name clef-flash \
      --host 0.0.0.0 \
      --port 8080 \
      --mem-fraction-static 0.55 \
      --max-running-requests 4 \
      --max-mamba-cache-size 4 \
      --mamba-ssm-dtype bfloat16 \
      --context-length 16640 \
      --max-prefill-tokens 16384 \
      --enable-metrics \
      --sleep-on-idle
    cmdStop: ${kubeswap} delete --model clef-flash --namespace ai --wait 60s
    useModelName: clef-flash

  qwen-image-2.1:
    capabilities:
      in: [text, image]
      out: [image]
    env:
      - CUDA_VISIBLE_DEVICES=GPU-d06ce8cc-4d13-f746-b123-75e2dccdb389
    checkEndpoint: /v1/models
    cmd: |
      /usr/local/bin/sd-server \
      --listen-port ${PORT} \
      --diffusion-model /models/Qwen-Image-2.1/Qwen-Image-2.1-NVFP4.gguf \
      --llm /models/Qwen-Image-2.1/Qwen-Image-2.1-encoder-NVFP4.gguf \
      --llm_vision /models/Qwen-Image-2.1/Qwen-Image-2.1-mmproj-F16.gguf \
      --vae /models/Qwen-Image-2.1/Qwen-Image-2.1-vae-BF16.safetensors \
      --cfg-scale 6.0 \
      --sampling-method euler \
      --diffusion-fa \
      --offload-to-cpu \
      --max-vram -1

  qwen3-embedding-0.6b:
    capabilities:
      in: [text]
      context: 2048
    env:
      - CUDA_VISIBLE_DEVICES=GPU-0b0e499d-1417-17ee-c551-f6a5c8b0e461
    cmd: |
      ${llama-server-custom} \
      --model /models/Qwen3-Embedding-0.6B/Qwen3-Embedding-0.6B-Q8_0.gguf \
      --embedding \
      --ctx-size 8192 \
      --batch-size 2048 \
      --ubatch-size 2048 \
      --parallel 4
    useModelName: qwen3-embedding-0.6b
    concurrencyLimit: 4

routing:
  router:
    use: matrix
    settings:
      matrix:
        vars:
          q3827b: qwen3.8-27b
          muse30b: muse-glimmer-30b
          qwenimg: qwen-image-2.1
          clef: clef-flash
          emb: qwen3-embedding-0.6b

        sets:
          default: '(q3827b | muse30b | qwenimg) & clef & emb'

hooks:
  on_startup:
    preload:
      - qwen3-embedding-0.6b
      - clef-flash

apiKeys:
  - ${env.LS_API_KEY}
