healthCheckTimeout: 300
unloadTimeout: 90
logToStdout: proxy,upstream
globalTTL: 0

macros:
  kubeswap: /usr/local/bin/kubeswap
  vllm-image: docker.io/vllm/vllm-openai:nightly@sha256:cb12c3016938a4ee98ed176ac833984089460689a0982cff4b5a60bb45b3cded # renovate: docker=docker.io/vllm/vllm-openai
  llama-server: >-
    /usr/local/bin/llama-server
    --host 0.0.0.0
    --port ${PORT}
    --metrics
    --jinja
    --flash-attn on
    --n-gpu-layers 99
    --fit off
    --reasoning-preserve
  llama-server-custom: >-
    /opt/llama/llama-server
    --host 0.0.0.0
    --port ${PORT}
    --metrics
    --jinja
    --flash-attn on
    --n-gpu-layers 99
    --fit off
    --reasoning-preserve

models:
  qwen3.8-27b:
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 172032
    env:
      - CUDA_VISIBLE_DEVICES=GPU-d06ce8cc-4d13-f746-b123-75e2dccdb389
      - GGML_CUDA_MMVQ_MAX_NVFP4=1
    cmd: |
      ${llama-server-custom} \
      --model /models/Swift-1.5-Qwen3.8-27B/Swift-1.5-Qwen3.8-27B-NVFP4.gguf \
      --mmproj /models/Swift-1.5-Qwen3.8-27B/Swift-1.5-Qwen3.8-27B-mmproj-F16.gguf \
      --no-mmproj-offload \
      --ctx-size 172032 \
      --parallel 2 \
      --kv-unified \
      --chat-template-kwargs '{"reasoning_effort":"medium"}' \
      --cache-type-k q8_0 \
      --cache-type-v q8_0 \
      --temp 1.0 \
      --top-p 0.95 \
      --top-k 20 \
      --min-p 0 \
      --presence-penalty 0.0 \
      --repeat-penalty 1.0 \
      --spec-type draft-mtp \
      --spec-draft-sampling probabilistic \
      --spec-draft-n-max 5 \
      --spec-draft-p-min 0.0 \
      --cache-dir /models/.prompt-cache/swift-1.5-qwen3.8-27b \
      --cache-disk 65536
    useModelName: qwen3.8-27b
    concurrencyLimit: 2

  muse-glimmer-30b:
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 122880
    env:
      - CUDA_VISIBLE_DEVICES=GPU-d06ce8cc-4d13-f746-b123-75e2dccdb389
      - GGML_CUDA_MMVQ_MAX_NVFP4=1
    cmd: |
      ${llama-server-custom} \
      --model /models/Muse-Glimmer-30B/Muse-Glimmer-30B-NVFP4-Q8_0.gguf \
      --mmproj /models/Muse-Glimmer-30B/Muse-Glimmer-30B-mmproj-kquant.gguf \
      --ctx-size 245760 \
      --parallel 2 \
      --no-cache-idle-slots \
      --chat-template-kwargs '{"reasoning_strength":"high"}' \
      --temp 1.0 \
      --top-p 0.95 \
      --top-k 64 \
      --min-p 0 \
      --presence-penalty 0.0 \
      --repeat-penalty 1.0 \
      --spec-type draft-dflash \
      --spec-draft-model /models/Muse-Glimmer-30B/Muse-Glimmer-30B-dflash2-Q4_K_M.gguf \
      --spec-draft-n-max 8 \
      --cache-dir /models/.prompt-cache/muse-glimmer-30b \
      --cache-disk 8192
    useModelName: muse-glimmer-30b
    concurrencyLimit: 4

  d3-flash:
    capabilities:
      in: [text, image]
      context: 32768
    concurrencyLimit: 16
    proxy: http://127.0.0.1:${PORT}
    cmd: |
      ${kubeswap} serve \
      --listen 127.0.0.1:${PORT} \
      --model d3-flash \
      --namespace ai \
      --image ${vllm-image} \
      --command vllm --command serve \
      --resource-claim pro2000=pro2000 \
      --request cpu=2 \
      --request memory=8Gi \
      --limit memory=16Gi \
      --env HOME=/models/.cache/d3-flash \
      --env PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
      --env VLLM_NO_USAGE_STATS=1 \
      --env HF_HUB_OFFLINE=1 \
      --env HF_HUB_DISABLE_TELEMETRY=1 \
      --env DO_NOT_TRACK=1 \
      --volume pvc:llama-swap:/models \
      --startup-timeout 5m \
      -- \
      /models/D3-Flash/D3-Flash-NVFP4 \
      --served-model-name d3-flash \
      --host 0.0.0.0 \
      --port 8080 \
      --max-model-len 33024 \
      --max-num-seqs 4 \
      --max-num-batched-tokens 33024 \
      --gpu-memory-utilization 0.8 \
      --kv-cache-memory-bytes 512M \
      --limit-mm-per-prompt.video 0 \
      --limit-mm-per-prompt.image 4
    cmdStop: ${kubeswap} delete --model d3-flash --namespace ai --wait 60s
    useModelName: d3-flash

  qwen-image-2.1:
    capabilities:
      in: [text, image]
      out: [image]
    env:
      - CUDA_VISIBLE_DEVICES=GPU-d06ce8cc-4d13-f746-b123-75e2dccdb389
    checkEndpoint: /v1/models
    cmd: |
      /usr/local/bin/sd-server \
      --listen-port ${PORT} \
      --diffusion-model /models/Qwen-Image-2.1/Qwen-Image-2.1-NVFP4.gguf \
      --llm /models/Qwen-Image-2.1/Qwen-Image-2.1-encoder-NVFP4.gguf \
      --llm_vision /models/Qwen-Image-2.1/Qwen-Image-2.1-mmproj-F16.gguf \
      --vae /models/Qwen-Image-2.1/Qwen-Image-2.1-vae-BF16.safetensors \
      --cfg-scale 6.0 \
      --sampling-method euler \
      --flash-attn off,diffusion=on \
      --offload-to-cpu \
      --max-vram -1

  embeddinggemma-2:
    capabilities:
      in: [text]
      context: 8192
    env:
      - CUDA_VISIBLE_DEVICES=GPU-0b0e499d-1417-17ee-c551-f6a5c8b0e461
    cmd: |
      ${llama-server-custom} \
      --model /models/EmbeddingGemma-2/EmbeddingGemma-2-Q8_0.gguf \
      --embedding \
      --ctx-size 32768 \
      --batch-size 8192 \
      --ubatch-size 8192 \
      --parallel 4
    useModelName: embeddinggemma-2
    concurrencyLimit: 4

routing:
  router:
    use: matrix
    settings:
      matrix:
        vars:
          q3827b: qwen3.8-27b
          muse30b: muse-glimmer-30b
          qwenimg: qwen-image-2.1
          d3: d3-flash
          emb: embeddinggemma-2

        sets:
          default: '(q3827b | muse30b | qwenimg) & d3 & emb'

hooks:
  on_startup:
    preload:
      - d3-flash
      - embeddinggemma-2

apiKeys:
  - ${env.LS_API_KEY}
