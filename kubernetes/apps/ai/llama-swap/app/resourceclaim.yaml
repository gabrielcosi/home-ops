---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: llama-swap
  namespace: ai
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            selectors:
              - cel:
                  expression: device.capacity['gpu.nvidia.com'].memory.compareTo(quantity('20Gi')) >= 0
