---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llama-swap
spec:
  chartRef:
    kind: OCIRepository
    name: llama-swap
  interval: 1h
  values:
    controllers:
      llama-swap:
        annotations:
          reloader.stakater.com/auto: 'true'
        strategy: Recreate
        pod:
          terminationGracePeriodSeconds: 120
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: llama-swap
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

        containers:
          app:
            nameOverride: llama-swap
            image:
              repository: ghcr.io/mostlygeek/llama-swap
              tag: v256-cuda-b11028-non-root # renovate: docker=ghcr.io/mostlygeek/llama-swap versioning=regex:^v(?<major>\d+)-cuda-b(?<build>\d+)-non-root$
            args:
              - --config
              - /app/config.yaml
              - --listen
              - 0.0.0.0:8080
            envFrom:
              - secretRef:
                  name: llama-swap-secrets
            lifecycle:
              preStop:
                exec:
                  command:
                    - sh
                    - -c
                    - >-
                      curl -sf -m 60 -H "Authorization: Bearer ${LS_API_KEY}"
                      http://127.0.0.1:8080/unload || true; sleep 15
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 3
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ['ALL']
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 100m
                memory: 4Gi
              limits:
                memory: 24Gi

          exporter:
            image:
              repository: ghcr.io/squat/llama-swap-exporter
              tag: latest@sha256:a9c2e48f397721f0ca263a6700c51869907acc9739e572b2360e6dac40ca8379
            args:
              - -upstream
              - http://127.0.0.1:8080
              - -web.listen-address
              - :9293
            env:
              LLAMA_SWAP_EXPORTER_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: llama-swap-secrets
                    key: LS_API_KEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: 9293
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: 9293
                  initialDelaySeconds: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ['ALL']
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    service:
      app:
        ports:
          http:
            port: 8080
          metrics:
            port: 9293

    route:
      app:
        hostnames:
          - 'llama.xcd.dev'
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      config:
        type: configMap
        name: llama-swap-config
        globalMounts:
          - path: /app/config.yaml
            subPath: config.yaml
            readOnly: true
      models:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: miroir-client
        size: 100Gi
        retain: true
        globalMounts:
          - path: /models
      library:
        type: nfs
        server: tank.internal
        path: /mnt/home-pool/models
        globalMounts:
          - path: /library
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
