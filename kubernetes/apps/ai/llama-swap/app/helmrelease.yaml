---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llama-swap
spec:
  chartRef:
    kind: OCIRepository
    name: llama-swap
  interval: 1h
  values:
    controllers:
      llama-swap:
        annotations:
          reloader.stakater.com/auto: 'true'
        strategy: Recreate
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: llama-swap
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

        containers:
          app:
            nameOverride: llama-swap
            image:
              repository: ghcr.io/mostlygeek/llama-swap
              tag: v249-cuda-b10398-non-root # renovate: docker=ghcr.io/mostlygeek/llama-swap versioning=regex:^v(?<major>\d+)-cuda-b(?<build>\d+)-non-root$
            args:
              - --config
              - /app/config.yaml
              - --listen
              - 0.0.0.0:8080
            envFrom:
              - secretRef:
                  name: llama-swap-secrets
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 3
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ['ALL']
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 100m
                memory: 4Gi
              limits:
                memory: 24Gi

    service:
      app:
        ports:
          http:
            port: 8080

    route:
      app:
        hostnames:
          - 'llama.xcd.dev'
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      config:
        type: configMap
        name: llama-swap-config
        globalMounts:
          - path: /app/config.yaml
            subPath: config.yaml
            readOnly: true
      models:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: miroir-client
        size: 100Gi
        retain: true
        globalMounts:
          - path: /models
      library:
        type: nfs
        server: tank.internal
        path: /mnt/home-pool/models
        globalMounts:
          - path: /library
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
