---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-webui
spec:
  components:
    - ../../../../components/kopiur/restore
    - ../../../../components/kopiur/backup
    - ../../../../components/keda/http
  dependsOn:
    - name: keda-http
      namespace: monitoring
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/ai/open-webui/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
  postBuild:
    substitute:
      APP: open-webui
      KOPIUR_PUID: "65534"
      KOPIUR_PGID: "65534"
      HTTP_SCALER_PORT: "8080"
      SUBDOMAIN: chat
      KOPIUR_CAPACITY: "1Gi"
