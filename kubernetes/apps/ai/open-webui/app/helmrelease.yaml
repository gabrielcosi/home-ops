---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: open-webui
  interval: 1h
  values:
    controllers:
      open-webui:
        pod:
          annotations:
            reloader.stakater.com/auto: 'true'
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.1
            env:
              # Open-webui settings
              WEBUI_URL: 'https://chat.xcd.dev'
              ENABLE_PUBLIC_ACTIVE_USERS_COUNT: false
              ENABLE_AUDIT_STDOUT: true
              ENABLE_OLLAMA_API: false
              ENABLE_OPENAI_API: true
              OPENAI_API_BASE_URL: 'http://bifrost.ai.svc.cluster.local:8080/v1'
              TASK_MODEL: zeus/fast
              ENABLE_FOLLOW_UP_GENERATION: false
              ENABLE_AUTOCOMPLETE_GENERATION: false
              ENABLE_EVALUATION_ARENA_MODELS: false
              ENABLE_COMMUNITY_SHARING: false
              ENABLE_TAGS_GENERATION: false
              ENABLE_DIRECT_CONNECTIONS: false
              OFFLINE_MODE: true
              HF_HUB_OFFLINE: 1
              ENABLE_VERSION_UPDATE_CHECK: false
              ENABLE_PIP_INSTALL_FRONTMATTER_REQUIREMENTS: false
              RAG_EMBEDDING_MODEL_AUTO_UPDATE: false
              RAG_RERANKING_MODEL_AUTO_UPDATE: false
              WHISPER_MODEL_AUTO_UPDATE: false
              CORS_ALLOW_ORIGIN: https://chat.xcd.dev
              # RAG
              RAG_EMBEDDING_ENGINE: openai
              RAG_EMBEDDING_MODEL: zeus/embeddings
              RAG_OPENAI_API_BASE_URL: 'http://bifrost.ai.svc.cluster.local:8080/v1'
              # Web search
              ENABLE_WEB_SEARCH: true
              WEB_SEARCH_ENGINE: searxng
              SEARXNG_QUERY_URL: 'http://searxng.tools.svc.cluster.local:8080/search?q=<query>'
              BYPASS_WEB_SEARCH_WEB_LOADER: true
              # Audio
              AUDIO_STT_ENGINE: ''
              AUDIO_TTS_ENGINE: ''
              # Auth
              ENABLE_OAUTH_PERSISTENT_CONFIG: false
              ENABLE_LOGIN_FORM: false
              ENABLE_SIGNUP: false
              ENABLE_OAUTH_SIGNUP: true
              ENABLE_PASSWORD_AUTH: false
              DEFAULT_USER_ROLE: 'user'
              OAUTH_PROVIDER_NAME: 'authentik'
              OPENID_PROVIDER_URL: 'https://auth.xcd.dev/application/o/chat/.well-known/openid-configuration'
              OPENID_REDIRECT_URI: 'https://chat.xcd.dev/oauth/oidc/callback'
              OAUTH_SCOPES: 'openid email profile groups'
              ENABLE_OAUTH_ROLE_MANAGEMENT: true
              ENABLE_OAUTH_GROUP_MANAGEMENT: true
              ENABLE_OAUTH_GROUP_CREATION: true
              OAUTH_ROLES_CLAIM: 'groups'
              OAUTH_ALLOWED_ROLES: 'OWUI Users, OWUI Admins'
              OAUTH_ADMIN_ROLES: 'OWUI Admins'
            envFrom:
              - secretRef:
                  name: open-webui-secrets
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /health
              readiness:
                enabled: true
                type: HTTP
                path: /health
              startup:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        ports:
          http:
            port: 8080

    route:
      app:
        hostnames:
          - 'chat.xcd.dev'
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      data:
        existingClaim: open-webui
        advancedMounts:
          open-webui:
            app:
              - path: /app/backend/data
      tmp:
        type: emptyDir
        advancedMounts:
          open-webui:
            app:
              - path: /tmp
