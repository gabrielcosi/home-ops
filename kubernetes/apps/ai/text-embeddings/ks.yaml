---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: text-embeddings
spec:
  dependsOn:
    - name: miroir
      namespace: miroir-system
  interval: 1h
  path: ./kubernetes/apps/ai/text-embeddings/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
