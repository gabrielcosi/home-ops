---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bifrost
spec:
  chartRef:
    kind: OCIRepository
    name: bifrost
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: bifrost-values
      valuesKey: providers.yaml
    - kind: ConfigMap
      name: bifrost-values
      valuesKey: governance.yaml
  values:
    replicaCount: 2

    image:
      repository: ghcr.io/maximhq/bifrost
      tag: v2.0.0

    deploymentAnnotations:
      reloader.stakater.com/auto: 'true'

    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: bifrost
                app.kubernetes.io/instance: bifrost
            topologyKey: kubernetes.io/hostname

    serviceAccount:
      automount: false

    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 1000

    resources:
      requests:
        cpu: 25m
        memory: 512Mi
      limits:
        cpu: null
        memory: 2Gi

    bifrost:
      sourceOfTruth: 'config.json'
      framework:
        pricing:
          pricingUrl: file:///pricing/pricing.json
          modelParametersUrl: file:///pricing/models.json
          mcpLibraryUrl: file:///pricing/mcp-library.json
      encryptionKeySecret:
        name: bifrost-secrets
        key: encryption-key
      client:
        logRetentionDays: 90
        allowedOrigins:
          - https://ai.xcd.dev
          - https://bifrost.xcd.dev
        loggingHeaders:
          - X-Request-ID
          - X-Correlation-ID
          - X-Tenant-ID
        compat:
          shouldDropParams: false
          shouldConvertParams: false
      plugins:
        telemetry:
          enabled: true
        logging:
          enabled: true
        governance:
          enabled: true
          config:
            is_vk_mandatory: true
      cluster:
        enabled: true
        discovery:
          enabled: true
          type: kubernetes
          k8sNamespace: ai
          k8sLabelSelector: app.kubernetes.io/instance=bifrost

    storage:
      mode: postgres
      persistence:
        enabled: false
      configStore:
        type: postgres
      logsStore:
        type: postgres

    postgresql:
      enabled: false
      external:
        enabled: true
        host: shared-pg-rw.database.svc.cluster.local
        port: 5432
        user: bifrost
        database: bifrost
        sslMode: require
        existingSecret: bifrost-postgres
        passwordKey: password

    volumes:
      - name: pricing
        configMap:
          name: bifrost-pricing

    volumeMounts:
      - name: pricing
        mountPath: /pricing
        readOnly: true

    envFrom:
      - secretRef:
          name: bifrost-secrets
