---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bifrost
spec:
  groups:
    - name: bifrost.rules
      rules:
        - alert: BifrostVirtualKeyRateLimited
          expr: |-
            sum by (virtual_key_name, provider, model) (rate(bifrost_error_requests_total{status_code=~"429|402"}[5m])) > 0
          for: 5m
          annotations:
            summary: >-
              Virtual key {{ $labels.virtual_key_name }} is rate-limited on {{ $labels.model }} via {{ $labels.provider }}
          labels:
            severity: warning

        - alert: BifrostUpstreamProviderErrors
          expr: |-
            sum by (provider, model) (increase(bifrost_error_requests_total{status_code=~"5.."}[15m])) >= 3
          for: 5m
          annotations:
            summary: >-
              Provider {{ $labels.provider }} is returning server errors for {{ $labels.model }}
          labels:
            severity: warning

        - alert: BifrostForbiddenModelSpike
          expr: |-
            sum by (virtual_key_name) (increase(bifrost_error_requests_total{status_code="403"}[15m])) >= 5
          for: 5m
          annotations:
            summary: >-
              Virtual key {{ $labels.virtual_key_name }} is hitting model allowlist denials
          labels:
            severity: warning

        - alert: BifrostPromptCacheDegraded
          expr: |-
            sum(increase(bifrost_cache_read_input_tokens_total[6h]))
              / clamp_min(sum(increase(bifrost_input_tokens_total[6h])) + sum(increase(bifrost_cache_read_input_tokens_total[6h])), 1) < 0.20
            and sum(increase(bifrost_input_tokens_total[6h])) > 1000000
          for: 1h
          annotations:
            summary: >-
              Provider prompt cache is serving under 20% of input tokens over the last 6h
          labels:
            severity: warning

        - alert: BifrostRoutingRuleRedirecting
          expr: |-
            sum by (virtual_key_name, routing_rule_name) (increase(bifrost_input_tokens_total{routing_rule_id!=""}[1h])) > 0
          for: 30m
          annotations:
            summary: >-
              Routing rule {{ $labels.routing_rule_name }} is redirecting traffic for {{ $labels.virtual_key_name }}
          labels:
            severity: warning

        - alert: BifrostRoutingFallbackActive
          expr: |-
            sum by (virtual_key_name, model) (increase(bifrost_input_tokens_total{fallback_index!="0"}[1h])) > 0
          for: 30m
          annotations:
            summary: >-
              Virtual key {{ $labels.virtual_key_name }} is being served by a fallback, not its primary model
          labels:
            severity: warning

        - alert: BifrostUnauthorizedFlood
          expr: |-
            sum(rate(bifrost_error_requests_total{status_code="401"}[5m])) > 1
          for: 10m
          annotations:
            summary: >-
              Bifrost is receiving a flood of requests with invalid virtual keys
          labels:
            severity: warning
