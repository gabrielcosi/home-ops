apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bifrost-inference
  annotations:
    gatus.home-operations.com/endpoint: |-
      url: https://ai.xcd.dev/health
      conditions:
        - '[STATUS] == 200'
        - '[BODY].status == ok'
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
  hostnames:
    - 'ai.xcd.dev'
  rules:
    - matches:
        - path: { type: PathPrefix, value: /v1 }
        - path: { type: PathPrefix, value: /openai }
        - path: { type: PathPrefix, value: /anthropic }
        - path: { type: Exact, value: /health }
      backendRefs:
        - name: bifrost
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bifrost-admin
spec:
  parentRefs:
    - name: envoy-internal-auth
      namespace: network
  hostnames:
    - 'bifrost.xcd.dev'
  rules:
    - backendRefs:
        - name: bifrost
          port: 8080
