---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: bifrost
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: |
    {
      "uid": "bifrost-overview",
      "title": "Bifrost",
      "tags": ["bifrost", "llm", "ai-gateway"],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "time": { "from": "now-24h", "to": "now" },
      "timepicker": {},
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "provider",
            "label": "Provider",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "victoriametrics" },
            "query": { "qryType": 1, "query": "label_values(bifrost_success_requests_total, provider)", "refId": "PrometheusVariableQueryEditor-VariableQuery" },
            "includeAll": true,
            "multi": true,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "model",
            "label": "Model",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "victoriametrics" },
            "query": { "qryType": 1, "query": "label_values(bifrost_success_requests_total{provider=~\"$provider\"}, model)", "refId": "PrometheusVariableQueryEditor-VariableQuery" },
            "includeAll": true,
            "multi": true,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "vkey",
            "label": "Virtual Key",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "victoriametrics" },
            "query": { "qryType": 1, "query": "label_values(bifrost_success_requests_total{provider=~\"$provider\",model=~\"$model\"}, virtual_key_name)", "refId": "PrometheusVariableQueryEditor-VariableQuery" },
            "includeAll": true,
            "multi": true,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "method",
            "label": "Method",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "victoriametrics" },
            "query": { "qryType": 1, "query": "label_values(bifrost_success_requests_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\"}, method)", "refId": "PrometheusVariableQueryEditor-VariableQuery" },
            "includeAll": true,
            "multi": true,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "type": "stat", "title": "Requests (range)",
          "id": 1, "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "refId": "A", "expr": "sum(increase(bifrost_success_requests_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range])) + sum(increase(bifrost_error_requests_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range]))", "instant": true, "legendFormat": "requests" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto", "colorMode": "background", "graphMode": "area" }
        },
        {
          "type": "stat", "title": "Success Rate",
          "id": 2, "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "refId": "A", "expr": "sum(increase(bifrost_success_requests_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range])) / clamp_min(sum(increase(bifrost_success_requests_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range])) + sum(increase(bifrost_error_requests_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range])), 1e-9)", "instant": true, "legendFormat": "success rate" }
          ],
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 2, "min": 0, "max": 1, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 0.95 }, { "color": "green", "value": 0.99 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" }
        },
        {
          "type": "stat", "title": "Total Cost (range)",
          "id": 3, "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "refId": "A", "expr": "sum(increase(bifrost_cost_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range]))", "instant": true, "legendFormat": "cost" }
          ],
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "decimals": 4, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "purple", "value": null } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" }
        },
        {
          "type": "stat", "title": "Tokens (range)",
          "id": 4, "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "refId": "A", "expr": "sum(increase(bifrost_input_tokens_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range])) + sum(increase(bifrost_output_tokens_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range]))", "instant": true, "legendFormat": "tokens" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" }
        },

        {
          "type": "stat", "title": "Decode speed (streaming, range)",
          "description": "1 / mean inter-token latency. Only recorded on *_stream methods.",
          "id": 5, "gridPos": { "h": 4, "w": 6, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "refId": "A", "expr": "sum(increase(bifrost_stream_inter_token_latency_seconds_count{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range])) / clamp_min(sum(increase(bifrost_stream_inter_token_latency_seconds_sum{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range])), 1e-9)", "instant": true, "legendFormat": "tok/s" }
          ],
          "fieldConfig": { "defaults": { "unit": "suffix:tok/s", "decimals": 1, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 15 }, { "color": "green", "value": 40 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" }
        },
        {
          "type": "stat", "title": "Effective output speed (all requests)",
          "description": "Output tokens / total upstream time. Includes prefill and queueing, and covers non-streaming requests.",
          "id": 6, "gridPos": { "h": 4, "w": 6, "x": 6, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "refId": "A", "expr": "sum(increase(bifrost_output_tokens_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range])) / clamp_min(sum(increase(bifrost_upstream_latency_seconds_sum{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\",is_success=\"true\"}[$__range])), 1e-9)", "instant": true, "legendFormat": "tok/s" }
          ],
          "fieldConfig": { "defaults": { "unit": "suffix:tok/s", "decimals": 1, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 10 }, { "color": "green", "value": 30 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" }
        },
        {
          "type": "stat", "title": "Streaming coverage (TTFT visibility)",
          "description": "Share of inference requests that used a *_stream method. TTFT and inter-token latency are only recorded for those; non-streaming requests contribute nothing to those panels.",
          "id": 7, "gridPos": { "h": 4, "w": 6, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "refId": "A", "expr": "sum(increase(bifrost_success_requests_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\".*_stream\"}[$__range])) / clamp_min(sum(increase(bifrost_success_requests_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"chat_completion.*|responses.*|text_completion.*\"}[$__range])), 1e-9)", "instant": true, "legendFormat": "streamed" }
          ],
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 1, "min": 0, "max": 1, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 0.5 }, { "color": "green", "value": 0.9 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" }
        },
        {
          "type": "stat", "title": "Requests that retried (range)",
          "id": 8, "gridPos": { "h": 4, "w": 6, "x": 18, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "refId": "A", "expr": "sum(increase(bifrost_request_retries_count{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range])) - sum(increase(bifrost_request_retries_bucket{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\",le=\"0\"}[$__range]))", "instant": true, "legendFormat": "retried" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 10 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" }
        },

        {
          "type": "timeseries", "title": "Decode speed by model (streaming, tok/s)",
          "description": "Reciprocal of mean inter-token latency. Streaming requests only.",
          "id": 10, "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "refId": "A", "expr": "sum by (model) (rate(bifrost_stream_inter_token_latency_seconds_count{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__rate_interval])) / sum by (model) (rate(bifrost_stream_inter_token_latency_seconds_sum{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__rate_interval]))", "legendFormat": "{{model}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "suffix:tok/s", "decimals": 1, "min": 0, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineInterpolation": "smooth", "showPoints": "always", "pointSize": 6, "spanNulls": 3600000 } }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["mean","max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries", "title": "Effective output speed by model (all requests, tok/s)",
          "description": "Output tokens divided by total upstream time. Lower than raw decode speed because it includes prefill, queueing and model load, but it covers non-streaming requests too.",
          "id": 11, "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "refId": "A", "expr": "sum by (model) (rate(bifrost_output_tokens_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__rate_interval])) / sum by (model) (rate(bifrost_upstream_latency_seconds_sum{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\",is_success=\"true\"}[$__rate_interval]))", "legendFormat": "{{model}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "suffix:tok/s", "decimals": 1, "min": 0, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineInterpolation": "smooth", "showPoints": "always", "pointSize": 6, "spanNulls": 3600000 } }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["mean","max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },

        {
          "type": "timeseries", "title": "Time to first token p95 by model",
          "description": "Streaming requests only. For llama-swap this includes on-demand model load on a cold start.",
          "id": 20, "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.95, sum by (model, le) (rate(bifrost_stream_first_token_latency_seconds_bucket{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__rate_interval])))", "legendFormat": "{{model}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 2, "min": 0, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineInterpolation": "smooth", "showPoints": "always", "pointSize": 6, "spanNulls": 3600000 } }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["mean","max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries", "title": "Upstream latency p95 by model",
          "id": 21, "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.95, sum by (model, le) (rate(bifrost_upstream_latency_seconds_bucket{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\",is_success=\"true\"}[$__rate_interval])))", "legendFormat": "{{model}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 2, "min": 0, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineInterpolation": "smooth", "showPoints": "always", "pointSize": 6, "spanNulls": 3600000 } }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["mean","max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },

        {
          "type": "timeseries", "title": "Requests by model",
          "id": 30, "gridPos": { "h": 8, "w": 8, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "refId": "A", "expr": "sum by (model) (increase(bifrost_success_requests_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__interval]))", "legendFormat": "{{model}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "min": 0, "custom": { "drawStyle": "bars", "fillOpacity": 70, "stacking": { "mode": "normal", "group": "A" }, "lineWidth": 0 } }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["sum"] }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries", "title": "Input tokens by model",
          "id": 31, "gridPos": { "h": 8, "w": 8, "x": 8, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "refId": "A", "expr": "sum by (model) (increase(bifrost_input_tokens_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__interval]))", "legendFormat": "{{model}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "min": 0, "custom": { "drawStyle": "bars", "fillOpacity": 70, "stacking": { "mode": "normal", "group": "A" }, "lineWidth": 0 } }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries", "title": "Output tokens by model",
          "id": 32, "gridPos": { "h": 8, "w": 8, "x": 16, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "refId": "A", "expr": "sum by (model) (increase(bifrost_output_tokens_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__interval]))", "legendFormat": "{{model}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "min": 0, "custom": { "drawStyle": "bars", "fillOpacity": 70, "stacking": { "mode": "normal", "group": "A" }, "lineWidth": 0 } }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },

        {
          "type": "table", "title": "Top models (range)",
          "id": 40, "gridPos": { "h": 9, "w": 12, "x": 0, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "refId": "A", "expr": "sum by (model) (increase(bifrost_success_requests_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range]))", "instant": true, "format": "table", "legendFormat": "" },
            { "refId": "B", "expr": "sum by (model) (increase(bifrost_input_tokens_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range]))", "instant": true, "format": "table" },
            { "refId": "C", "expr": "sum by (model) (increase(bifrost_output_tokens_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range]))", "instant": true, "format": "table" },
            { "refId": "D", "expr": "sum by (model) (increase(bifrost_cost_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range]))", "instant": true, "format": "table" }
          ],
          "transformations": [
            { "id": "merge", "options": {} },
            { "id": "organize", "options": { "excludeByName": { "Time": true }, "renameByName": { "model": "Model", "Value #A": "Requests", "Value #B": "Input", "Value #C": "Output", "Value #D": "Cost" }, "indexByName": { "model": 0, "Value #A": 1, "Value #B": 2, "Value #C": 3, "Value #D": 4 } } }
          ],
          "fieldConfig": { "defaults": { "custom": { "align": "auto" } }, "overrides": [
            { "matcher": { "id": "byName", "options": "Cost" }, "properties": [ { "id": "unit", "value": "currencyUSD" }, { "id": "decimals", "value": 4 } ] },
            { "matcher": { "id": "byName", "options": "Requests" }, "properties": [ { "id": "unit", "value": "short" }, { "id": "decimals", "value": 0 } ] },
            { "matcher": { "id": "byName", "options": "Input" }, "properties": [ { "id": "unit", "value": "short" }, { "id": "decimals", "value": 0 } ] },
            { "matcher": { "id": "byName", "options": "Output" }, "properties": [ { "id": "unit", "value": "short" }, { "id": "decimals", "value": 0 } ] }
          ] },
          "options": { "showHeader": true, "footer": { "show": true, "reducer": ["sum"], "fields": ["Requests", "Input", "Output", "Cost"] }, "sortBy": [ { "displayName": "Cost", "desc": true } ] }
        },
        {
          "type": "timeseries", "title": "Errors by status code",
          "id": 41, "gridPos": { "h": 9, "w": 12, "x": 0, "y": 41 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "refId": "A", "expr": "sum by (status_code, model) (increase(bifrost_error_requests_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__interval]))", "legendFormat": "{{status_code}} {{model}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "min": 0, "custom": { "drawStyle": "bars", "fillOpacity": 80, "stacking": { "mode": "normal", "group": "A" }, "lineWidth": 0 } }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["sum"] }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },

        {
          "type": "table", "title": "Top virtual keys (range)",
          "id": 50, "gridPos": { "h": 9, "w": 12, "x": 12, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "targets": [
            { "refId": "A", "expr": "sum by (virtual_key_name) (increase(bifrost_success_requests_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range]))", "instant": true, "format": "table", "legendFormat": "" },
            { "refId": "B", "expr": "sum by (virtual_key_name) (increase(bifrost_input_tokens_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range]) + increase(bifrost_output_tokens_total{provider=~\"$provider\",model=~\"$model\",virtual_key_name=~\"$vkey\",method=~\"$method\"}[$__range]))", "instant": true, "format": "table" },
