---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: unifi-mcp
spec:
  image: ghcr.io/sirkirby/unifi-network-mcp:0.45.0@sha256:5c14d804e23b714850b58c4b45b722aeed9159d0acf47b182a3bfa92d2d17e7c
  transport: streamable-http
  mcpPort: 3000
  groupRef:
    name: mcp-tools
  env:
    - name: UNIFI_HOST
      value: unifi.internal
    - name: UNIFI_MCP_HTTP_ENABLED
      value: "true"
    - name: UNIFI_MCP_HOST
      value: 0.0.0.0
    - name: UNIFI_MCP_ALLOWED_HOSTS
      value: mcp-unifi-mcp
    - name: UNIFI_REQUIRE_PREVIEW_TOKEN
      value: "true"
  secrets:
    - name: unifi-mcp-secrets
      key: UNIFI_USERNAME
    - name: unifi-mcp-secrets
      key: UNIFI_PASSWORD
    - name: unifi-mcp-secrets
      key: UNIFI_API_KEY
  podTemplateSpec:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: mcp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  resourceOverrides:
    proxyDeployment:
      env:
        - name: TOOLHIVE_SKIP_UPDATE_CHECK
          value: "true"
        - name: TOOLHIVE_USAGE_METRICS_ENABLED
          value: "false"
  telemetryConfigRef:
    name: prometheus
    serviceName: unifi-mcp
  resources:
    requests:
      cpu: 10m
      memory: 192Mi
    limits:
      memory: 512Mi
