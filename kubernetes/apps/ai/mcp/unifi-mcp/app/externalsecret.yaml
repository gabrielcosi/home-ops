---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-mcp-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    template:
      data:
        UNIFI_USERNAME: '{{ .mcps_unifi_username }}'
        UNIFI_PASSWORD: '{{ .mcps_unifi_password }}'
        UNIFI_API_KEY: '{{ .mcps_unifi_api_key }}'
  dataFrom:
    - extract:
        key: mcps
