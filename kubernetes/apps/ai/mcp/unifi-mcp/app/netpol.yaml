---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi-mcp-proxy
  namespace: ai
spec:
  description: Restrict the unifi-mcp proxy to the mcp-gateway vMCP and vmagent ingress, and egress to its backend and the API server.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: unifi-mcp
      app.kubernetes.io/name: mcpserver
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app.kubernetes.io/name: virtualmcpserver
            k8s:app.kubernetes.io/instance: mcp-gateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app: unifi-mcp
    - fromEntities:
        - kube-apiserver
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app: unifi-mcp
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi-mcp
  namespace: ai
spec:
  description: Restrict the unifi-mcp backend ingress to its proxy, and egress to the UniFi gateway.
  endpointSelector:
    matchLabels:
      app: unifi-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app.kubernetes.io/instance: unifi-mcp
            k8s:app.kubernetes.io/name: mcpserver
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toCIDR:
        - 192.168.1.1/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
