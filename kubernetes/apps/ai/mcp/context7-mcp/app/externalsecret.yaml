---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: context7-mcp-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect

  target:
    template:
      data:
        CONTEXT7_API_KEY: "{{ .mcps_context7_api_key }}"

  dataFrom:
    - extract:
        key: mcps
