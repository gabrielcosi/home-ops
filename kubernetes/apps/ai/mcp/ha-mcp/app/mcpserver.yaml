---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: ha-mcp
spec:
  image: ghcr.io/homeassistant-ai/ha-mcp:9.1.2@sha256:381b1e01635d3c51f35a01882863610bc0b76a22bae93835a6a5a5c926d9ecb4
  transport: streamable-http
  groupRef:
    name: mcp-tools
  env:
    - name: HOMEASSISTANT_URL
      value: https://home.xcd.dev
    - name: HA_MCP_DISABLE_UPDATE_CHECK
      value: "true"
    - name: FASTMCP_CHECK_FOR_UPDATES
      value: "off"
  secrets:
    - name: ha-mcp-token
      key: HOMEASSISTANT_TOKEN
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          command:
            - ha-mcp-web
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  resourceOverrides:
    proxyDeployment:
      env:
        - name: TOOLHIVE_SKIP_UPDATE_CHECK
          value: "true"
        - name: TOOLHIVE_USAGE_METRICS_ENABLED
          value: "false"
  telemetryConfigRef:
    name: prometheus
    serviceName: ha-mcp
  resources:
    requests:
      cpu: 1m
      memory: 128Mi
    limits:
      memory: 128Mi
