---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ha-mcp-proxy
  namespace: ai
spec:
  description: Restrict the ha-mcp proxy to the mcp-gateway vMCP and vmagent ingress, and egress to its backend and the API server.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: ha-mcp
      app.kubernetes.io/name: mcpserver
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app.kubernetes.io/name: virtualmcpserver
            k8s:app.kubernetes.io/instance: mcp-gateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app: ha-mcp
    - fromEntities:
        - kube-apiserver
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app: ha-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ha-mcp
  namespace: ai
spec:
  description: Restrict the ha-mcp backend ingress to its proxy, and egress to the external gateway proxies.
  endpointSelector:
    matchLabels:
      app: ha-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app.kubernetes.io/instance: ha-mcp
            k8s:app.kubernetes.io/name: mcpserver
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            k8s:app.kubernetes.io/managed-by: envoy-gateway
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-external
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            k8s:app.kubernetes.io/managed-by: envoy-gateway
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
