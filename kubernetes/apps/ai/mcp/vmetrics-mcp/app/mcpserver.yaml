---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: vmetrics-mcp
spec:
  image: ghcr.io/victoriametrics/mcp-victoriametrics:v1.22.0@sha256:d304060eaf2e104e6c90e6b68c71a0cac668b7c6aa9fedaa5b35023eaabbaa99
  transport: streamable-http
  mcpPort: 8080
  groupRef:
    name: mcp-tools
  env:
    - name: VM_INSTANCE_ENTRYPOINT
      value: http://vmsingle-victoria-metrics-cluster.monitoring.svc.cluster.local:8428
    - name: VM_INSTANCE_TYPE
      value: single
    - name: MCP_SERVER_MODE
      value: http
    - name: MCP_LISTEN_ADDR
      value: :8080
    - name: MCP_DISABLE_RESOURCES
      value: "true"
  podTemplateSpec:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 10m
              memory: 800Mi
            limits:
              memory: 1.5Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  resourceOverrides:
    proxyDeployment:
      env:
        - name: TOOLHIVE_SKIP_UPDATE_CHECK
          value: "true"
        - name: TOOLHIVE_USAGE_METRICS_ENABLED
          value: "false"
  telemetryConfigRef:
    name: prometheus
    serviceName: vmetrics-mcp
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi
