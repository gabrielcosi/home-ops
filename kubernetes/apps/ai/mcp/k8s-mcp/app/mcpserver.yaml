---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: k8s-mcp
spec:
  image: docker.io/rohitghumare64/kubectl-mcp-server:1.24.0@sha256:17134e36a3e1d3a5e457c12d61e8c7f7c52a7927c6ae4250131dfd95a74a2331
  transport: stdio
  serviceAccount: k8s-mcp
  groupRef:
    name: mcp-tools
  permissionProfile:
    type: builtin
    name: network
  telemetryConfigRef:
    name: prometheus
    serviceName: k8s-mcp
  resources:
    requests:
      cpu: 1m
      memory: 128Mi
    limits:
      memory: 128Mi
