---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mcp

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp-read-only-diagnostics
rules:
  - apiGroups: ['']
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - endpoints
      - namespaces
      - nodes
      - events
      - configmaps
      - persistentvolumeclaims
      - persistentvolumes
      - podtemplates
      - replicationcontrollers
      - resourcequotas
      - limitranges
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['apps']
    resources:
      - controllerrevisions
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['batch']
    resources:
      - jobs
      - cronjobs
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['networking.k8s.io']
    resources:
      - ingressclasses
      - ingresses
      - ipaddresses
      - networkpolicies
      - servicecidrs
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['events.k8s.io']
    resources:
      - events
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['autoscaling']
    resources:
      - horizontalpodautoscalers
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['discovery.k8s.io']
    resources:
      - endpointslices
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['metrics.k8s.io']
    resources:
      - pods
      - nodes
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['policy']
    resources:
      - poddisruptionbudgets
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['apiextensions.k8s.io']
    resources:
      - customresourcedefinitions
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['apiregistration.k8s.io']
    resources:
      - apiservices
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['kustomize.toolkit.fluxcd.io']
    resources:
      - kustomizations
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['helm.toolkit.fluxcd.io']
    resources:
      - helmreleases
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['source.toolkit.fluxcd.io']
    resources:
      - buckets
      - gitrepositories
      - helmcharts
      - helmrepositories
      - ocirepositories
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['notification.toolkit.fluxcd.io']
    resources:
      - alerts
      - providers
      - receivers
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['fluxcd.controlplane.io']
    resources:
      - fluxinstances
      - fluxreports
      - resourcesetinputproviders
      - resourcesets
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['gateway.networking.k8s.io']
    resources:
      - backendtlspolicies
      - gatewayclasses
      - gateways
      - grpcroutes
      - httproutes
      - listenersets
      - referencegrants
      - tcproutes
      - tlsroutes
      - udproutes
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['gateway.envoyproxy.io']
    resources:
      - backends
      - backendtrafficpolicies
      - clienttrafficpolicies
      - envoyextensionpolicies
      - envoypatchpolicies
      - envoyproxies
      - httproutefilters
      - securitypolicies
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['cert-manager.io']
    resources:
      - certificaterequests
      - certificates
      - clusterissuers
      - issuers
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['acme.cert-manager.io']
    resources:
      - challenges
      - orders
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['cilium.io']
    resources:
      - ciliumbgpadvertisements
      - ciliumbgpclusterconfigs
      - ciliumbgpnodeconfigoverrides
      - ciliumbgpnodeconfigs
      - ciliumbgppeerconfigs
      - ciliumbgppeeringpolicies
      - ciliumcidrgroups
      - ciliumclusterwideenvoyconfigs
      - ciliumclusterwidenetworkpolicies
      - ciliumendpoints
      - ciliumendpointslices
      - ciliumenvoyconfigs
      - ciliumexternalworkloads
      - ciliumgatewayclassconfigs
      - ciliumidentities
      - ciliuml2announcementpolicies
      - ciliumloadbalancerippools
      - ciliumlocalredirectpolicies
      - ciliumnetworkpolicies
      - ciliumnodeconfigs
      - ciliumnodes
      - ciliumpodippools
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['k8s.cni.cncf.io']
    resources:
      - network-attachment-definitions
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['storage.k8s.io']
    resources:
      - csidrivers
      - csinodes
      - csistoragecapacities
      - storageclasses
      - volumeattachments
      - volumeattributesclasses
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['snapshot.storage.k8s.io']
    resources:
      - volumesnapshotclasses
      - volumesnapshotcontents
      - volumesnapshots
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['groupsnapshot.storage.k8s.io']
    resources:
      - volumegroupsnapshotclasses
      - volumegroupsnapshotcontents
      - volumegroupsnapshots
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['resource.k8s.io']
    resources:
      - deviceclasses
      - resourceclaims
      - resourceclaimtemplates
      - resourceslices
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['monitoring.coreos.com']
    resources:
      - alertmanagerconfigs
      - alertmanagers
      - podmonitors
      - probes
      - prometheusagents
      - prometheuses
      - prometheusrules
      - scrapeconfigs
      - servicemonitors
      - thanosrulers
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['operator.victoriametrics.com']
    resources:
      - vlagents
      - vlclusters
      - vlogs
      - vlsingles
      - vmagents
      - vmalertmanagerconfigs
      - vmalertmanagers
      - vmalerts
      - vmanomalies
      - vmanomalyconfigs
      - vmauths
      - vmclusters
      - vmdistributed
      - vmnodescrapes
      - vmpodscrapes
      - vmprobes
      - vmrules
      - vmscrapeconfigs
      - vmservicescrapes
      - vmsingles
      - vmstaticscrapes
      - vmusers
      - vtclusters
      - vtsingles
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['monitoring.giantswarm.io']
    resources:
      - silences
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['observability.giantswarm.io']
    resources:
      - silences
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['postgresql.cnpg.io']
    resources:
      - backups
      - clusterimagecatalogs
      - clusters
      - databases
      - failoverquorums
      - imagecatalogs
      - poolers
      - publications
      - scheduledbackups
      - subscriptions
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['dragonflydb.io']
    resources:
      - dragonflies
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['kopiur.home-operations.com']
    resources:
      - clusterrepositories
      - maintenances
      - repositories
      - repositoryreplications
      - restores
      - snapshotpolicies
      - snapshots
      - snapshotschedules
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['keda.sh']
    resources:
      - clustertriggerauthentications
      - scaledjobs
      - scaledobjects
      - triggerauthentications
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['http.keda.sh']
    resources:
      - httpscaledobjects
      - interceptorroutes
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['eventing.keda.sh']
    resources:
      - cloudeventsources
      - clustercloudeventsources
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['node.k8s.io']
    resources:
      - runtimeclasses
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['toolhive.stacklok.dev']
    resources:
      - embeddingservers
      - mcpexternalauthconfigs
      - mcpgroups
      - mcpoidcconfigs
      - mcpregistries
      - mcpremoteproxies
      - mcpserverentries
      - mcpservers
      - mcptelemetryconfigs
      - mcptoolconfigs
      - mcpwebhookconfigs
      - virtualmcpcompositetooldefinitions
      - virtualmcpservers
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['renovate-operator.mogenius.com']
    resources:
      - renovatejobs
    verbs: ['get', 'list', 'watch']

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-read-only-diagnostics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-mcp-read-only-diagnostics
subjects:
  - kind: ServiceAccount
    name: k8s-mcp
    namespace: ai
