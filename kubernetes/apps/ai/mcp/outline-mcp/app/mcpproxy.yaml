---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: outline-mcp
spec:
  remoteUrl: 'https://docs.xcd.dev/mcp'
  transport: streamable-http
  groupRef:
    name: mcp-tools
  resourceOverrides:
    proxyDeployment:
      env:
        - name: TOOLHIVE_SKIP_UPDATE_CHECK
          value: "true"
        - name: TOOLHIVE_USAGE_METRICS_ENABLED
          value: "false"
  telemetryConfigRef:
    name: prometheus
    serviceName: outline-mcp
  headerForward:
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          name: outline-mcp-token
          key: OUTLINE_MCP_TOKEN
