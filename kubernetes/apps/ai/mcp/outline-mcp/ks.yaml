---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: outline-mcp
spec:
  dependsOn:
    - name: toolhive-operator
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/mcp/outline-mcp/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: mcp
    namespace: flux-system
  targetNamespace: ai
  wait: false
