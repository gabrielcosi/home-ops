---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vlogs-mcp-proxy
  namespace: ai
spec:
  description: Restrict the vlogs-mcp proxy to the mcp-gateway vMCP and vmagent ingress, and egress to its backend and the API server.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: vlogs-mcp
      app.kubernetes.io/name: mcpserver
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app.kubernetes.io/name: virtualmcpserver
            k8s:app.kubernetes.io/instance: mcp-gateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app: vlogs-mcp
    - fromEntities:
        - kube-apiserver
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app: vlogs-mcp
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vlogs-mcp
  namespace: ai
spec:
  description: Restrict the vlogs-mcp backend ingress to its proxy, and egress to VictoriaLogs.
  endpointSelector:
    matchLabels:
      app: vlogs-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app.kubernetes.io/instance: vlogs-mcp
            k8s:app.kubernetes.io/name: mcpserver
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: victoria-logs-single
            k8s:app.kubernetes.io/instance: victoria-logs
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
