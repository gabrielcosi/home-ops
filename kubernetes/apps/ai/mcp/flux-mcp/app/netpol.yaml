---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-mcp-proxy
  namespace: ai
spec:
  description: Restrict the flux-mcp proxy to the mcp-gateway vMCP and vmagent ingress, and egress to its backend and the API server.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: flux-mcp
      app.kubernetes.io/name: mcpserver
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app.kubernetes.io/name: virtualmcpserver
            k8s:app.kubernetes.io/instance: mcp-gateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app: flux-mcp
    - fromEntities:
        - kube-apiserver
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app: flux-mcp
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-mcp
  namespace: ai
spec:
  description: Restrict the flux-mcp backend ingress to its proxy, and egress to the API server.
  endpointSelector:
    matchLabels:
      app: flux-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app.kubernetes.io/instance: flux-mcp
            k8s:app.kubernetes.io/name: mcpserver
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
