---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: n8n
spec:
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  components:
    - ../../../../components/kopiur/restore
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./kubernetes/apps/ai/n8n/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
  postBuild:
    substitute:
      APP: n8n
      KOPIUR_PUID: '1000'
      KOPIUR_PGID: '1000'
      KOPIUR_CAPACITY: '10Gi'
