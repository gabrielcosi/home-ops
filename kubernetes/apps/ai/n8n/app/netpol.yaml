---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: n8n
spec:
  description: Restrict n8n egress to the external gateway proxies, the NAS, and the npm registry.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: n8n
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-external
    - toCIDR:
        - 192.168.42.20/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toFQDNs:
        - matchName: registry.npmjs.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
