---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
spec:
  chartRef:
    kind: OCIRepository
    name: n8n
  interval: 1h
  values:
    controllers:
      n8n:
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          imagePullSecrets:
            - name: registry-credentials
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            nameOverride: n8n
            image:
              repository: ghcr.io/n8n-io/n8n
              tag: 2.37.1
            env:
              N8N_LOG_LEVEL: debug
              TZ: Europe/Berlin
              GENERIC_TIMEZONE: Europe/Berlin
              DB_TYPE: sqlite
              DB_SQLITE_POOL_SIZE: 5
              N8N_RUNNERS_MODE: external
              N8N_PORT: '5678'
              N8N_PROTOCOL: https
              N8N_HOST: n8n.xcd.dev
              N8N_EDITOR_BASE_URL: https://n8n.xcd.dev
              WEBHOOK_URL: https://n8n.xcd.dev
              N8N_PROXY_HOPS: 1
              N8N_PERSONALIZATION_ENABLED: false
              N8N_VERSION_NOTIFICATIONS_ENABLED: false
              N8N_TEMPLATES_ENABLED: false
              N8N_DIAGNOSTICS_ENABLED: false
              N8N_HIRING_BANNER_ENABLED: false
              N8N_DYNAMIC_BANNERS_ENABLED: false
              N8N_VERIFIED_PACKAGES_ENABLED: false
              N8N_DISABLED_MODULES: mcp-registry
              N8N_DIAGNOSTICS_CONFIG_FRONTEND: ''
              N8N_DIAGNOSTICS_CONFIG_BACKEND: ''
              EXTERNAL_FRONTEND_HOOKS_URLS: ''
            envFrom:
              - secretRef:
                  name: n8n-secrets
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /healthz
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                type: HTTP
                path: /healthz/readiness
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                type: HTTP
                path: /healthz/readiness
                spec:
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 24
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

          task-runner:
            image:
              repository: ghcr.io/n8n-io/runners
              tag: 2.37.1
            env:
              GENERIC_TIMEZONE: Europe/Berlin
              N8N_RUNNERS_AUTH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: n8n-secrets
                    key: N8N_RUNNERS_AUTH_TOKEN
              N8N_RUNNERS_TASK_BROKER_URI: 'http://127.0.0.1:5679'
              N8N_RUNNERS_MAX_CONCURRENCY: '5'
              N8N_RUNNERS_STDLIB_ALLOW: '*'
              NODE_FUNCTION_ALLOW_BUILTIN: '*'
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            probes:
              liveness:
                enabled: true
                type: HTTP
                port: 5680
                path: /healthz
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                type: HTTP
                port: 5680
                path: /healthz
                spec:
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 12
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        ports:
          http:
            port: 5678

    route:
      app:
        hostnames:
          - 'n8n.xcd.dev'
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      data:
        existingClaim: n8n
        advancedMounts:
          n8n:
            app:
              - path: /home/node/.n8n

      tmp:
        type: emptyDir
        advancedMounts:
          n8n:
            app:
              - path: /tmp
              - path: /home/node/.cache
              - path: /home/node/.npm
            task-runner:
              - path: /tmp

      runner-config:
        type: configMap
        name: runner-config
        advancedMounts:
          n8n:
            task-runner:
              - path: /etc/n8n-task-runners.json
                subPath: n8n-task-runners.json
                readOnly: true
