---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gpu
spec:
  dependsOn:
    - name: nvidia-dra-driver
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/ai/gpu/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
