---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: cliproxyapi-reauth
spec:
  groups:
    - name: cliproxyapi
      type: vlogs
      interval: 1m
      rules:
        - alert: CliProxyApiReauthNeeded
          expr: |
            _time:15m {kubernetes.pod_namespace="ai", kubernetes.pod_name=~"cliproxyapi.*"}
            ("invalid_grant" OR "refresh_token_reused" OR "refresh_token_expired" OR "refresh_token_revoked")
            | extract_regexp `\[(?P<provider>anthropic|openai)_auth\.go:`
            | stats by (provider) count() as hits
            | filter hits:>0
          for: 2m
          annotations:
            summary: >-
              CLIProxyAPI {{ $labels.provider }} credentials need an interactive re-login
          labels:
            severity: critical
