---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cliproxyapi
spec:
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  components:
    - ../../../../components/kopiur/restore
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./kubernetes/apps/ai/cliproxyapi/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
  postBuild:
    substitute:
      APP: cliproxyapi
      KOPIUR_PUID: "65534"
      KOPIUR_PGID: "65534"
      KOPIUR_CAPACITY: "32Mi"
