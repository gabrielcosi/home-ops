---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./base
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      annotationSelector: "!anubis.home/skip-route-patch"
    patch: |
      - op: add
        path: /spec/values/route/app/rules
        value:
          - backendRefs:
              - name: ${APP}-anubis
                port: 8080
  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
    patch: |-
      - op: replace
        path: /spec/rules
        value:
          - backendRefs:
              - name: ${APP}-anubis
                port: 8080
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: .*-anubis
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: _
      spec:
        patches:
          - patch: |-
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: _
              spec:
                maxHistory: 3
                install:
                  crds: CreateReplace
                rollback:
                  cleanupOnFail: true
                upgrade:
                  cleanupOnFail: true
                  crds: CreateReplace
                  strategy:
                    name: RemediateOnFailure
                  remediation:
                    remediateLastFailure: true
                    retries: 2
            target:
              group: helm.toolkit.fluxcd.io
              kind: HelmRelease
