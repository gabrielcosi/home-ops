---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-nas
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kopiur-nas-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .kopiur_kopia_password }}"
        AWS_ACCESS_KEY_ID: "{{ .kopiur_nas_backup_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .kopiur_nas_backup_access_secret_key }}"
  dataFrom:
    - extract:
        key: kopiur
