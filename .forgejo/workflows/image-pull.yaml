---
name: Image Pull

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.event.pull_request.number || forgejo.ref }}
  cancel-in-progress: true

jobs:
  extract:
    name: Extract images
    if: ${{ forgejo.event.pull_request.head.repo.full_name == forgejo.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout PR
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ forgejo.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Extract images
        id: extract
        env:
          BASE_SHA: ${{ forgejo.event.pull_request.base.sha }}
        run: |-
          set -euo pipefail
          base=$(git merge-base "${BASE_SHA}" HEAD)
          rendered=$(flate diff images --path ./kubernetes/flux/cluster --base "${base}" \
            --allow-missing-secrets --no-progress --output json)
          referenced=$(git diff --unified=0 "${base}" HEAD -- kubernetes \
            | { grep -E '^\+[^+]' || true; } \
            | { grep -oE '[a-z0-9.-]+\.[a-z]{2,}(:[0-9]+)?/[a-z0-9._/-]+:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' || true; } \
            | jq -R . | jq -s .)
          images=$(jq -cn --argjson a "${rendered}" --argjson b "${referenced}" '$a + $b | unique')
          echo "${images}" | jq .
          echo "images=${images}" >> "${GITHUB_OUTPUT}"

  pull:
    name: Pull ${{ matrix.image }}
    needs: extract
    if: ${{ needs.extract.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        image: ${{ fromJSON(needs.extract.outputs.images != '[]' && needs.extract.outputs.images || '[""]') }}
      max-parallel: 4
      fail-fast: false
    env:
      CRANE_VERSION: 'v0.22.1' # renovate: github-releases=google/go-containerregistry
    steps:
      - name: Install crane
        run: |-
          set -euo pipefail
          base="https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}"
          archive=go-containerregistry_Linux_x86_64.tar.gz
          curl -fsSLO "${base}/${archive}"
          curl -fsSL "${base}/checksums.txt" | grep " ${archive}$" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${archive}" -C "${HOME}/.local/bin" crane
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Pull image
        env:
          IMAGE: ${{ matrix.image }}
        run: |-
          host=${IMAGE%%/*}
          if [[ "${IMAGE}" != */* || ( "${host}" != *.* && "${host}" != *:* ) ]]; then
            host=docker.io
            IMAGE="docker.io/${IMAGE}"
          fi
          case "${host}" in
            registry.xcd.dev | git.xcd.dev)
              echo "::notice::${IMAGE} is not served through the mirror; skipping"
              exit 0
              ;;
          esac
          for attempt in 1 2 3; do
            if out=$(crane pull --platform linux/amd64 "registry.xcd.dev/x/${IMAGE}" /dev/null 2>&1); then
              exit 0
            fi
            echo "${out}"
            if grep -qiE 'unauthorized|denied|forbidden|status code:? ?40[13]\b' <<< "${out}"; then
              echo "::warning::${IMAGE} is not allowlisted in cachette or needs registry credentials; skipping"
              exit 0
            fi
            sleep 10
          done
          exit 1

  pulled:
    name: Images pulled
    needs:
      - extract
      - pull
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check pull results
        env:
          RESULTS: ${{ needs.extract.result }} ${{ needs.pull.result }}
        run: |-
          echo "${RESULTS}"
          ! grep -qE 'failure|cancelled' <<< "${RESULTS}"
