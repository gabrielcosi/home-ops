---
name: Flate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.event.pull_request.number || forgejo.ref }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLATE_VERSION: 'v0.8.0' # renovate: github-releases=home-operations/flate
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install flate
        run: |-
          set -euo pipefail
          version=${FLATE_VERSION#v}
          base="https://github.com/home-operations/flate/releases/download/${FLATE_VERSION}"
          archive="flate_${version}_linux_amd64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          echo "$(curl -fsSL "${base}/${archive}.sha256")  ${archive}" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${archive}" -C "${HOME}/.local/bin" flate
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Test
        run: flate test all --path ./kubernetes/apps --no-progress
